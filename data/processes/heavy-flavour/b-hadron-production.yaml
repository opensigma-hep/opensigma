        predictions:
          - label: "NNLO QCD (MATRIX, nf = 4, μ0 = m_b), b quarks"
            accuracy:
              qcd: NNLO
              approximations: ["parton-level b quark, no fragmentation; average of b and b̄ pseudorapidity (η_b^av) in 2 < η < 5", "m_b = 4.92 GeV pole mass, NNPDF3.1 NNLO nf = 4"]
            codes: ["MATRIX"]
            uses_amplitudes: ["amp:2L/gg-ttbar", "amp:2L/qqbar-ttbar"]
            total: {value_pct: 30, provenance: {uid: '4443e076', ref: "inspire:1824426", locator: "Table 4, NNLO (μ0 = m_b), 13 TeV: 123.4(7) +30% −25% µb; larger side of the scale variation", source: agent, status: cross-checked, date: "2026-10-16"}}
            uncertainties:
              - category: MHOU
                specific: "μR, μF scale variation"
                method: "7-point variation of μR, μF by a factor of 2 around μ0 = m_b, 0.5 ≤ μR/μF ≤ 2"
                size: {range: [25, 30], unit: "%", asymmetric: true}
                provenance: {uid: '78481e91', ref: "inspire:1824426", locator: "Table 4, NNLO (μ0 = m_b), 13 TeV: +30% −25%", source: agent, status: cross-checked, date: "2026-10-16"}
              - category: numerical
                specific: "Monte Carlo and r_cut → 0 extrapolation"
                size: {range: [0.57, 0.57], unit: "%", asymmetric: false}
                provenance: {uid: '882e9474', ref: "inspire:1824426", locator: "Table 4, NNLO (μ0 = m_b), 13 TeV: numerical error (7) in the last digit of 123.4 µb", source: agent, status: cross-checked, date: "2026-10-16"}
            compared_to: ["meas:b-hadron-production/lhc-13/lhcb-2017-hb"]
            refs: ["inspire:1824426"]
            provenance: {uid: 370a0930, ref: "inspire:1824426", locator: "Sec. 3.3, Table 4 (integral of the pseudorapidity distribution over 2 < η < 5; compared with the LHCb measurement)", source: agent, status: cross-checked, date: "2026-10-16"}
            headline: true
          - label: "FONLL (NLO + NLL), b hadrons"
            accuracy:
              qcd: NLO
              resummation: [{accuracy: "NLL", variable: "pT/m_b"}]
            codes: ["FONLL"]
            total: {value_pct: 46, provenance: {uid: ca58f62e, ref: "inspire:1504058", locator: "text after Table 3: FONLL prediction 111 +51 −44 µb at 13 TeV in 2 < η < 5; larger side of the quoted band", source: agent, status: cross-checked, date: "2026-10-16"}}
            compared_to: ["meas:b-hadron-production/lhc-13/lhcb-2017-hb"]
            refs: ["inspire:1384271", "inspire:1504058"]
            provenance: {uid: 022299fd, ref: "inspire:1504058", locator: "text after Table 3 and Fig. 2 (FONLL prediction by Cacciari, Mangano, Nason)", source: agent, status: cross-checked, date: "2026-10-16"}
      - id: "obs:b-hadron-production/lhc-13/sigma-bplus-fid"
        name: "σ(pp → B⁺ X), CMS fiducial region"
        kind: fiducial
        variable: "σ summed over 10 ≤ pT(B⁺) < 17 GeV, |y| < 1.45 and 17 ≤ pT(B⁺) < 100 GeV, |y| < 2.1 (B⁺ → J/ψ K⁺, single charge state)"
