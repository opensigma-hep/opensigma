        experiment: "LHCb"
        dataset: "13 TeV, 4.60 pb⁻¹ (special low-luminosity runs, 2015)"
        ref: "inspire:1504058"
        hepdata: "hepdata:ins1504058/Table 2"
      - id: "meas:b-hadron-production/lhc-13/cms-2017-bplus"
        experiment: "CMS"
        dataset: "13 TeV, 48.1 pb⁻¹ (2015)"
        ref: "inspire:1485195"
        hepdata: "hepdata:ins1485195/Table 7"
    observables:
      - id: "obs:b-hadron-production/lhc-13/sigma-hb-fwd"
        name: "σ(pp → H_b X), 2 < η < 5"
        kind: fiducial
        variable: "σ integrated over b-hadron pseudorapidity 2 < η < 5 and all pT; average of b and b̄ hadrons (H_b contains b or b̄, not both)"
        results:
          - measurement: "meas:b-hadron-production/lhc-13/lhcb-2017-hb"
            total: {value_pct: 15, provenance: {uid: ca7bc463, ref: "inspire:1504058", locator: "Abstract and text below Table 3: 144 ± 1 (stat) ± 21 (syst) µb; added in quadrature (14.6%)", source: agent, status: cross-checked, date: "2026-10-16"}}
            uncertainties:
              - category: stat
                specific: "Data statistics"
                size: {range: [0.69, 0.69], unit: "%", asymmetric: false}
                provenance: {uid: 4245d6bb, ref: "inspire:1504058", locator: "Abstract: ± 1 (stat) of 144 µb", source: agent, status: cross-checked, date: "2026-10-16"}
              - category: lumi
                specific: "Luminosity"
                size: {range: [3.9, 3.9], unit: "%", asymmetric: false}
                provenance: {uid: b1a40345, ref: "inspire:1504058", locator: "Table 4, 13 TeV column", source: agent, status: cross-checked, date: "2026-10-16"}
              - category: efficiency
                specific: "Tracking efficiency"
                size: {range: [6.3, 6.3], unit: "%", asymmetric: false}
