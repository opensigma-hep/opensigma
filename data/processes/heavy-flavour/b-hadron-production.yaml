            total: {value_pct: 33, provenance: {uid: 4fd9c5de, ref: "inspire:1485195", locator: "Table 2 (inclusive bin): FONLL 9.9 +3.3 −2.2 µb; larger side; band includes scale, b-mass and PDF variations", source: agent, status: cross-checked, date: "2026-10-16"}}
            compared_to: ["meas:b-hadron-production/lhc-13/cms-2017-bplus"]
