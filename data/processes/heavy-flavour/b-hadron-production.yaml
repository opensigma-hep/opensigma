id: "proc:b-hadron-production"
name: "Open b production (pp, pp̄ → b-hadron + X)"
family: "fam:heavy-flavour"
sector: SM
description: "Inclusive production of hadrons containing a b quark in hadron collisions, pp/pp̄ → H_b + X. A classic test of perturbative QCD with a heavy quark (bottom mass m_b ~ 4–5 GeV gives slow perturbative convergence and large scale uncertainties), a probe of the low-x gluon PDF in the forward region, and the normalisation for b-flavour yields and backgrounds. Predictions exist at NNLO QCD for on-shell b quarks (no fragmentation) and as FONLL (NLO + next-to-leading-log resummation of ln(pT/m_b), with fragmentation) for b hadrons."
watch:
  recids: [1824426, 1504058, 1485195, 668026, 1384271]
  queries:
    - 't "b-hadron" and t "production cross" and (collaboration:ATLAS or collaboration:CMS or collaboration:LHCb)'
    - 't "bottom" and t "production" and t "hadron colliders" and (t NNLO or t FONLL or t "fragmentation")'
building_blocks:
  - row: "NLO QCD"
    cells:
      1L:
        status: done
        refs: ["inspire:251743", "inspire:277634", "inspire:264718"]
        provenance: {uid: 9a9bca37, ref: "inspire:1824426", locator: "Sec. 1, second paragraph (NLO QCD predictions for bb̄ production available since refs. [21–23]: Nason–Dawson–Ellis 1988/89, Beenakker et al. 1989)", source: agent, status: cross-checked, date: "2026-10-16"}
      code:
        status: done
        approximations: ["FONLL: massive NLO matched to NLL resummation of ln(pT/m_b) with perturbative fragmentation, folded with non-perturbative fragmentation functions"]
        refs: ["inspire:468385", "inspire:553013", "inspire:1116414"]
        provenance: {uid: 3a92351c, ref: "inspire:1824426", locator: "Sec. 1, second paragraph (FONLL [29–32] is the standard reference for comparison with b-hadron data)", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "NNLO QCD"
    cells:
      2L:
        status: done
        amplitude: "amp:2L/gg-ttbar"
        approximations: ["two-loop virtuals from a numerical grid (originally computed for tt̄)"]
        refs: ["inspire:1273586", "inspire:1824426"]
        provenance: {uid: 31bc0ab7, ref: "inspire:1824426", locator: "Sec. 1 (last paragraph) and Sec. 3 (paragraph on the two-loop virtual corrections)", source: agent, status: cross-checked, date: "2026-10-16"}
      RV:
        status: done
        approximations: ["one-loop amplitudes from OpenLoops; bb̄+jet at NLO with dipole subtraction"]
        refs: ["inspire:1824426"]
        provenance: {uid: ce8a33f1, ref: "inspire:1824426", locator: "Sec. 2, Eq. (1) and following text", source: agent, status: cross-checked, date: "2026-10-16"}
      RR:
        status: done
        approximations: ["bb̄+jet at NLO with dipole subtraction (real emission part), tree-level bb̄bb̄ contributions are at the per-mille level"]
        refs: ["inspire:1824426"]
        provenance: {uid: 8884de65, ref: "inspire:1824426", locator: "Sec. 2, Eq. (1) and Sec. 3 (four-bottom contributions)", source: agent, status: cross-checked, date: "2026-10-16"}
      ir_scheme:
        status: done
        approximations: ["qT subtraction extended to heavy-quark production; r_cut → 0 extrapolation uncertainty of about 0.5% on the total cross section"]
        refs: ["inspire:745577", "inspire:1824426"]
        provenance: {uid: 654d01c2, ref: "inspire:1824426", locator: "Sec. 2 and Sec. 3.1 (r_cut → 0 extrapolation)", source: agent, status: cross-checked, date: "2026-10-16"}
      code:
        status: done
        approximations: ["four-flavour scheme, on-shell b quarks: no fragmentation or hadronisation, no resummation of ln(pT/m_b)"]
        refs: ["inspire:1636973", "inspire:1824426"]
        provenance: {uid: 2f433b54, ref: "inspire:1824426", locator: "Abstract and Sec. 2 (implemented in the MATRIX framework)", source: agent, status: cross-checked, date: "2026-10-16"}
channels:
  - id: "chan:b-hadron-production/lhc-13"
    collider: "col:lhc-13"
    initial_state: "pp"
    coverage: partial
    last_reviewed: "2026-10-16"
    headline: {observable: "obs:b-hadron-production/lhc-13/sigma-hb-fwd", region: "2 < η < 5 (LHCb acceptance), all pT"}
    measurements:
