id: "proc:charm-production"
name: "Open charm production (pp, pp̄ → charm hadron + X)"
family: "fam:heavy-flavour"
sector: SM
description: "Inclusive production of hadrons containing a charm quark in hadron collisions, pp/pp̄ → D + X (prompt, i.e. not from b-hadron decays). Tests heavy-quark perturbative QCD at a low scale (m_c ~ 1.5 GeV), probes the gluon PDF at very small x in the forward region, and enters backgrounds for neutrino astronomy and flavour physics. Predictions available are at NLO QCD in massive, FONLL (NLO+NLL), GM-VFNS and POWHEG-matched forms, all folded with charm fragmentation functions."
watch:
  recids: []
  queries:
    - '(collaboration:ALICE or collaboration:LHCb or collaboration:ATLAS or collaboration:CMS or collaboration:CDF) and t charm and (t "production cross" or t "cross-section" or t "cross section") and (t "pp collisions" or t "proton-proton" or t "TeV")'
    - 't charm and (t hadroproduction or t "pair production" or t "total cross") and (t NNLO or t FONLL or t "GM-VFNS" or t SACOT)'
    - 't charm and (t "total cross" or t "total charm") and (t LHC or t "pp collisions" or t "proton-proton")'
  last_run: '2026-10-16'
building_blocks:
  - row: "NLO QCD"
    cells:
      code:
        status: done
        approximations: ["POWHEG+NNPDF3.0L, FONLL (NLO+NLL) and GM-VFNS; all convolved with charm fragmentation functions"]
        refs: ["inspire:1379948", "inspire:1384271", "inspire:1087276"]
        provenance: {uid: b45b2a87, ref: "inspire:1396331", locator: "Sec. 1 and Sec. 7 (all three sets of calculations [1] POWHEG+NNPDF3.0L, [2] FONLL, [3] GM-VFNS are performed at NLO precision)", source: agent, status: cross-checked, date: "2026-10-16"}
channels:
  - id: "chan:charm-production/lhc-13"
    collider: "col:lhc-13"
    initial_state: "pp"
    coverage: partial
    last_reviewed: "2026-10-17"
    headline: {observable: "obs:charm-production/lhc-13/sigma-dpm-fid", region: "12 < pT(D±) < 100 GeV, |η| < 2.5 (prompt + non-prompt)"}
    measurements:
      - id: "meas:charm-production/lhc-13/lhcb-2016-d"
        experiment: "LHCb"
        dataset: "13 TeV, 4.98 pb⁻¹ (2015)"
        ref: "inspire:1396331"
        hepdata: "hepdata:ins1396331/Table 1"
      - id: "meas:charm-production/lhc-13/alice-2023-charm"
        experiment: "ALICE"
        dataset: "13 TeV, minimum-bias, 2016–2018"
        ref: "inspire:2697877"
        hepdata: "hepdata:ins2697877/Figure 13 Right"
      - id: "meas:charm-production/lhc-13/atlas-2024-dpm"
        experiment: "ATLAS"
        dataset: "13 TeV, 137 fb⁻¹ (2016–2018)"
        ref: "inspire:2862073"
