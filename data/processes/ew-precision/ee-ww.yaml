id: "proc:ee-ww"
name: "W-pair production: e⁺e⁻ → W⁺W⁻ (→ 4f)"
family: "fam:ew-precision"
sector: SM
description: "Production of W-boson pairs in e⁺e⁻ annihilation above threshold, e⁺e⁻ → W⁺W⁻ → 4 fermions, studied at LEP 2 (√s = 161–209 GeV). The total and differential cross sections test the non-abelian gauge cancellations between the t-channel ν exchange and the s-channel γ/Z exchange, and the threshold cross section gives m_W. The LEP 2 benchmark theory is the O(α) double-pole approximation (RACOONWW, YFSWW3); the complete O(α) electroweak calculation for charged-current e⁺e⁻ → 4f is the most accurate prediction, and is needed at the precision of future e⁺e⁻ colliders."
watch:
  recids: [1219330, 529378, 529590, 676264, 682093]
  queries:
    - 't "W-pair" and t "e+ e-" and (t "electroweak corrections" or t "NNLO" or t "threshold")'
    - 't "W pair production" and (t "FCC-ee" or t "linear collider" or t "LEP") and t "cross section"'
building_blocks:
  - row: "NLO EW"
    cells:
      born:
        status: done
        refs: ["inspire:499024"]
        provenance: {uid: 6d20e613, ref: "inspire:499024", locator: "Abstract (complete matrix elements for e⁺e⁻ → 4f and 4f + γ in the electroweak Standard Model)", source: agent, status: cross-checked, date: "2026-10-16"}
      1L:
        status: done
        approximations: ["charged-current e⁺e⁻ → 4f (ν_τ τ⁺ μ⁻ ν̄_μ, u d̄ μ⁻ ν̄_μ, u d̄ s c̄); complex-mass scheme"]
        refs: ["inspire:676264", "inspire:682093"]
        provenance: {uid: abd3d87c, ref: "inspire:676264", locator: "Abstract (complete electroweak O(α) corrections for charged-current four-fermion production, complex gauge-boson masses)", source: agent, status: cross-checked, date: "2026-10-16"}
      RV:
        status: done
        refs: ["inspire:499024"]
        provenance: {uid: f8ea1c22, ref: "inspire:499024", locator: "Abstract (matrix elements for e⁺e⁻ → 4f + γ)", source: agent, status: cross-checked, date: "2026-10-16"}
      ir_scheme:
        status: done
        approximations: ["subtraction method for real photon emission"]
        refs: ["inspire:682093"]
        provenance: {uid: 36a8deb7, ref: "inspire:682093", locator: "Sec. 5.1 (results obtained using the subtraction method)", source: agent, status: cross-checked, date: "2026-10-16"}
      code:
        status: done
        approximations: ["double-pole approximation in RACOONWW and YFSWW3 (used for LEP 2); complete O(α) for charged-current 4f in Denner et al."]
        refs: ["inspire:529378", "inspire:529590", "inspire:682093"]
        provenance: {uid: ab5c5609, ref: "inspire:1219330", locator: "Sec. 5.2.1 (YFSWW and RACOONWW compared to LEP data, LPA/DPA corrections)", source: agent, status: cross-checked, date: "2026-10-16"}
channels:
  - id: "chan:ee-ww/lep2"
    collider: "col:lep2"
    initial_state: "e⁺e⁻"
    coverage: partial
    last_reviewed: "2026-10-16"
    headline: {observable: "obs:ee-ww/lep2/sigma-ww", region: "√s = 206.6 GeV, CC03 W-pair signal, SM W branching fractions assumed"}
    measurements:
      - id: "meas:ee-ww/lep2/lep-2013-combination"
        experiment: "combination"
        dataset: "LEP 2 combination (ALEPH, DELPHI, L3, OPAL), W-pair cross sections at √s = 161–207 GeV"
        ref: "inspire:1219330"
    observables:
      - id: "obs:ee-ww/lep2/sigma-ww"
        name: "σ(e⁺e⁻ → W⁺W⁻), CC03 signal, LEP combination"
        kind: total
        variable: "σ_WW at √s = 206.6 GeV (highest of the eight energies combined above 175 GeV)"
        results:
          - measurement: "meas:ee-ww/lep2/lep-2013-combination"
            total: {value_pct: 1.4, provenance: {uid: f75e31df, ref: "inspire:1219330", locator: "Table E.2, √s = 206.6 GeV: σ_WW = 17.20 ± 0.21 (stat) ± 0.11 (syst) pb, total ±0.24 pb; 0.24/17.20", source: agent, status: cross-checked, date: "2026-10-16"}}
            uncertainties:
              - category: stat
                specific: "Data statistics"
                size: {range: [1.2, 1.2], unit: "%", asymmetric: false}
                provenance: {uid: 53a61c7a, ref: "inspire:1219330", locator: "Table E.2, √s = 206.6 GeV: ±0.21 pb (stat) of 17.20 pb", source: agent, status: cross-checked, date: "2026-10-16"}
              - category: syst_combined
                specific: "Total systematic (LEP-correlated and uncorrelated components; theory on signal, background and luminosity, detector effects)"
                size: {range: [0.64, 0.64], unit: "%", asymmetric: false}
                provenance: {uid: f97fc1ec, ref: "inspire:1219330", locator: "Table E.2, √s = 206.6 GeV: ±0.11 pb (syst) of 17.20 pb; groupings in Table 5.2", source: agent, status: cross-checked, date: "2026-10-16"}
        predictions:
          - label: "Complete O(α) EW corrections to charged-current e⁺e⁻ → 4f (Denner, Dittmaier, Roth, Wieders)"
            accuracy:
              qcd: LO
              ew: NLO
              approximations: ["complete O(α) in the complex-mass scheme; QCD corrections only as a naive factor (1 + αs/π) per hadronically decaying W; ISR improvement beyond O(α)"]
            refs: ["inspire:676264", "inspire:682093"]
            provenance: {uid: 9aaaae83, ref: "inspire:682093", locator: "Abstract; Sec. 5.1 (setup: naive QCD corrections, subtraction method)", source: agent, status: cross-checked, date: "2026-10-16"}
          - label: "O(α) double-pole approximation (YFSWW3 / RACOONWW), as compared by LEP"
            headline: true
            accuracy:
              qcd: LO
              ew: NLO
              approximations: ["leading/double-pole approximation to O(α) (LPA/DPA) above 170 GeV; improved Born approximation near threshold"]
            codes: ["YFSWW3", "RACOONWW"]
            total: {value_pct: 0.4, provenance: {uid: 799acd95, ref: "inspire:1219330", locator: "Sec. 5.2.1, text after Table 5.2: LPA/DPA theoretical uncertainty decreasing from 0.7% at 170 GeV to about 0.4% above 200 GeV; 2% in the threshold region", source: agent, status: cross-checked, date: "2026-10-16"}}
            compared_to: ["meas:ee-ww/lep2/lep-2013-combination"]
            refs: ["inspire:529378", "inspire:529590", "inspire:1219330"]
            provenance: {uid: 6d76a756, ref: "inspire:1219330", locator: "Sec. 5.2.1, Fig. 5.1 and Table E.4 (YFSWW 17.145 pb, RACOONWW 17.087 pb at 206.6 GeV, mW = 80.35 GeV)", source: agent, status: cross-checked, date: "2026-10-16"}
