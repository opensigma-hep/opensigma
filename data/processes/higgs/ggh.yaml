            accuracy:
              qcd: NNLO
              ew: NLO
            total: {value_pct: 10.4, provenance: {uid: c5c89366, ref: "arXiv:1606.02266", locator: "Table 1, 8 TeV column, ggF row: 19.2 ± 2.0 pb; relative uncertainty 2.0/19.2 derived from the rounded values (quadrature sum of QCD scale, PDF and αs, symmetric as quoted)", source: agent, status: cross-checked, date: "2026-10-17"}}
