id: "proc:hh"
name: "Higgs-pair production in gluon fusion (gg → HH)"
family: "fam:higgs"
sector: SM
description: "Production of a pair of Higgs bosons, dominated by gluon fusion through top-quark loops, gg → HH + X. It probes the Higgs trilinear self-coupling. The NLO QCD cross section is known with full top-quark mass dependence; NNLO and N3LO QCD corrections are known in the large-top-mass limit and combined with the full-mass NLO result (NNLO FTapprox, N3LO+N3LL ⊗ NLO). At 13 TeV, ATLAS and CMS each set only upper limits; their combination gives a signal strength compatible with the SM at about 1σ significance. An ATLAS HL-LHC projection exists."
watch:
  recids: []
  queries:
    - 't Higgs and (t "Higgs pair" or t "Higgs boson pair" or t "di-Higgs" or t "double Higgs" or t "double-Higgs" or t HH) and (t NNLO or t N3LO or t "top-quark mass" or t "top quark mass" or t "gluon fusion" or t "gluon-fusion" or t resummation) and not t "two-Higgs" and not t 2HDM and not t resonant and not t composite'
    - 't "Higgs boson pair" and (collaboration:ATLAS or collaboration:CMS) and (t combination or t "HL-LHC" or t projected or t "13.6 TeV" or t "Run 3")'
  last_run: '2026-10-16'
building_blocks:
  - row: "NLO QCD"
    cells:
      2L:
        status: done
        amplitude: "amp:2L/gg-HH-mt"
        refs: ["inspire:1450011", "inspire:1481820"]
        provenance: {uid: a0e73049, ref: "inspire:1450011", locator: "Abstract (NLO QCD cross section and invariant mass distribution with full top-quark mass dependence; two-loop virtual amplitude with SecDec numerical integrals); inspire:1481820 Abstract (full NLO versus approximations)", source: agent, status: agent-draft, date: "2026-10-17"}
  - row: "NNLO QCD"
    cells:
      2L:
        status: done
        approximations: ["heavy-top limit m_t → ∞ (effective theory)"]
        refs: ["inspire:1235046"]
        provenance: {uid: c1de5f71, ref: "inspire:1235046", locator: "Abstract (two-loop virtual corrections to gg → HH in the heavy top quark limit)", source: agent, status: agent-draft, date: "2026-10-17"}
      RV:
        status: partial
        approximations: ["large-m_t limit, four expansion terms in 1/m_t²"]
        refs: ["inspire:1940681"]
        provenance: {uid: 57bf079e, ref: "inspire:1940681", locator: "Abstract (real-virtual and double-real contributions computed analytically in the large top quark mass limit with four expansion terms in 1/m_t²)", source: agent, status: agent-draft, date: "2026-10-17"}
      RR:
        status: partial
        approximations: ["large-m_t limit, four expansion terms in 1/m_t²; one-loop double-real with full m_t dependence in inspire:1658914"]
        refs: ["inspire:1940681", "inspire:1658914"]
        provenance: {uid: 1122ba34, ref: "inspire:1940681", locator: "Abstract (double-real contribution in the large top quark mass limit, four expansion terms in 1/m_t²); full-m_t one-loop double-real: inspire:1658914 Abstract", source: agent, status: agent-draft, date: "2026-10-17"}
      code:
        status: partial
        approximations: ["exact NLO combined with NNLO in the large-m_t approximation, reweighted for finite-m_t effects beyond NLO (NNLO FTapprox)", "full top-quark mass dependence of the NNLO double-virtual corrections not available (arXiv:2606.05300 Abstract)"]
        refs: ["inspire:1255445", "inspire:1658914"]
        provenance: {uid: 98377f18, ref: "inspire:1658914", locator: "Abstract (NNLO FTapprox: full-mass NLO plus large-m_t NNLO corrections with one-loop double-real at full m_t and reweighted real-virtual and double-virtual); large-m_t NNLO inclusive cross section: inspire:1255445 Abstract", source: agent, status: agent-draft, date: "2026-10-17"}
  - row: "N3LO QCD"
    cells:
      code:
        status: partial
        approximations: ["infinite top-quark mass limit at N3LO, combined with full-m_t NLO", "N3LO+N3LL threshold resummation matched in the infinite-m_t limit (inspire:2148956)", "fully differential N3LO in the heavy-top limit at 14 TeV (inspire:3112557)"]
        refs: ["inspire:1754176", "inspire:1773489", "inspire:2148956", "inspire:3112557"]
        provenance: {uid: a01b1fb5, ref: "inspire:1773489", locator: "Abstract (N3LO QCD in the infinite top-quark mass limit, inclusive and differential, combined with NLO full-top-mass results in several schemes); inclusive N3LO first in inspire:1754176 Abstract", source: agent, status: agent-draft, date: "2026-10-17"}
  - row: "NLO EW"
    cells:
      2L:
        status: done
        refs: ["inspire:2727392"]
        provenance: {uid: 1da49e61, ref: "inspire:2727392", locator: "Abstract (complete next-to-leading order electroweak corrections to pp → HH, gluon-gluon fusion channel, total and differential cross sections); used as a multiplicative K-factor in arXiv:2609.04868 Sec. 6.1, 7.3", source: agent, status: agent-draft, date: "2026-10-17"}
