id: "proc:h-jet"
name: "Higgs + jet and the Higgs transverse-momentum spectrum (pp → H + jet)"
family: "fam:higgs"
sector: "SM"
description: "Higgs production in association with at least one jet, dominated by gluon fusion: jet-multiplicity bins, the leading-jet pT and the Higgs pT spectrum away from pT = 0. Known at NNLO QCD in the heavy-top effective theory and at NLO QCD with the exact top-mass dependence; the small-pT region is resummed to N3LL′. The inclusive gg → H rate and the low-pT part of the spectrum are tracked in proc:ggh."
watch:
  recids:
    - 1365289
    - 1651770
    - 1671098
    - 2023464
  queries:
    - "t Higgs and (t \"jet\" or t \"jets\" or t \"transverse momentum\" or t \"high $p_T$\" or t \"boosted\") and (t NNLO or t N3LO or t \"N$^3$LO\" or t \"N3LL\" or t \"N$^3$LL\" or t \"top-quark mass\" or t \"top mass\" or t \"two-loop\" or t \"three-loop\" or t \"electroweak corrections\" or t resummation) and not t search and not t \"pair\" and not t \"dark\" and not t \"vector boson fusion\""
    - "t Higgs and (collaboration:ATLAS or collaboration:CMS) and (t \"differential\" or t \"fiducial\" or t \"transverse momentum\" or t \"boosted\") and (t \"13 TeV\" or t \"13.6 TeV\") and not t search and not t \"pair production\" and not t \"dark\""
building_blocks:
  - row: "NLO QCD"
    cells:
      2L:
        status: "done"
        approximations:
          - "with the exact top-mass dependence the Born process is loop-induced, so NLO needs two-loop H + 3 parton amplitudes"
          - "evaluated numerically"
        amplitude: "amp:2L/H-3partons-mt"
        refs:
          - "inspire:1651770"
          - "inspire:1944918"
          - "inspire:2098298"
        provenance:
          uid: 8b77bc61
          ref: "inspire:1651770"
          locator: "Abstract (two-loop integrals of the virtual contribution with full top-quark mass dependence, calculated numerically with sector decomposition); inspire:2098298, abstract (amplitudes valid for arbitrary heavy-quark masses)"
          source: "agent"
          status: "agent-draft"
          date: "2026-11-12"
      code:
        status: "done"
        approximations:
          - "heavy-top limit: inspire:495979, inspire:581705, inspire:595944"
          - "exact top-mass dependence: inspire:1651770, corrected and extended in inspire:1944918; with bottom mass in inspire:2098298"
        refs:
          - "inspire:495979"
          - "inspire:581705"
          - "inspire:595944"
          - "inspire:1651770"
          - "inspire:1944918"
          - "inspire:2098298"
        provenance:
          uid: 7f5a1106
          ref: "inspire:495979"
          locator: "Abstract (H + jet at NLO QCD in the large top-mass limit); inspire:581705, abstract (full NLO differential distributions, m_t → ∞, all partonic subprocesses); inspire:595944, abstract (analytic NLO pT and rapidity distributions, infinite-top-mass approximation); exact m_t: inspire:1651770 and inspire:1944918, abstracts"
          source: "agent"
          status: "agent-draft"
          date: "2026-11-12"
  - row: "NNLO QCD"
    cells:
      2L:
        status: "done"
        approximations:
          - "effective theory, m_t → ∞"
        amplitude: "amp:2L/H-3partons-eft"
        refs:
          - "inspire:1081564"
        provenance:
          uid: 04414d14
          ref: "inspire:1081564"
          locator: "Abstract (two-loop QCD corrections to the helicity amplitudes for H → ggg and H → q q̄ g in an effective theory with infinite top-quark mass)"
          source: "agent"
          status: "agent-draft"
          date: "2026-11-12"
      code:
        status: "done"
        approximations:
          - "effective theory, m_t → ∞ (inspire:1478598: rescaled with the full quark-mass dependence at LO)"
        refs:
          - "inspire:1365289"
          - "inspire:1370434"
          - "inspire:1311992"
          - "inspire:1478598"
        provenance:
          uid: ea39d0cb
          ref: "inspire:1370434"
          locator: "Abstract (complete H + jet through NNLO with jettiness subtraction, in agreement with the gg and qg computation based on sector-improved residue subtraction); inspire:1365289, abstract; inspire:1478598, abstract (second-order corrections with antenna subtraction results, fully differential)"
          source: "agent"
          status: "agent-draft"
          date: "2026-11-12"
  - row: "N3LO QCD"
    cells:
      2L:
        status: "done"
        approximations:
          - "effective theory, m_t → ∞"
          - "two-loop amplitudes to higher orders in ε, as needed at N3LO"
        amplitude: "amp:2L/H-3partons-eft"
        refs:
          - "inspire:2626731"
        provenance:
          uid: 925213fc
          ref: "inspire:2626731"
          locator: "Abstract (one- and two-loop helicity amplitudes for H → ggg and H → q q̄ g in the infinite-top-mass effective theory to higher orders in the dimensional regulator, as a first step towards N3LO H + jet)"
          source: "agent"
          status: "agent-draft"
          date: "2026-11-12"
      3L:
        status: "partial"
        approximations:
          - "master integrals only: all integral topologies for the three-loop Hggg and Hgq q̄ amplitudes; the amplitudes themselves are not given"
          - "leading colour"
          - "effective theory, m_t → ∞"
        refs:
          - "inspire:2842844"
        provenance:
          uid: e59a68ad
          ref: "inspire:2842844"
          locator: "Abstract (all integral topologies relevant to the three-loop Hggg and Hgq q̄ amplitudes evaluated in the leading-colour approximation and heavy-top limit; canonical differential equations)"
          source: "agent"
          status: "agent-draft"
          date: "2026-11-12"
      code:
        status: "missing"
        provenance:
          uid: 7ced8b6a
          ref: "inspire:2626731"
          locator: "Abstract (N3LO calculations for H + jet described as a goal; the two-loop amplitudes at higher orders in ε are 'the first step towards this goal')"
          source: "agent"
          status: "agent-draft"
          date: "2026-11-12"
  - row: "NLO EW"
    cells:
      2L:
        status: "partial"
        approximations:
          - "gg → gH channel only (quark-initiated channels not included)"
        amplitude: "amp:2L/gg-Hg-ew"
        refs:
          - "inspire:2954727"
        provenance:
          uid: 4eeb6b18
          ref: "inspire:2954727"
          locator: "Abstract (complete NLO electroweak corrections to Higgs production in the gg → gH channel; master integrals by differential equations with optimised masters)"
          source: "agent"
          status: "agent-draft"
          date: "2026-11-12"
