id: "proc:vbf-h"
name: "Vector-boson-fusion Higgs production (qq → qqH)"
family: "fam:higgs"
sector: SM
description: "Production of the SM Higgs boson through t- and u-channel W/Z exchange with two forward tagging jets, qq → qqH + X: the second-largest Higgs production cross section at the LHC. Known at N3LO QCD (and NNLO fully differentially) in the structure-function approach, i.e. neglecting colour exchange between the two hadronic systems, with NLO electroweak corrections."
watch:
  recids: []
  queries:
    - 't Higgs and (t "vector-boson fusion" or t "vector boson fusion" or t "weak boson fusion" or t "weak-boson fusion") and (t N3LO or t NNLO or t "electroweak" or t "QCD corrections" or t "cross section" or t "cross-section" or t "differential" or t "fiducial") and not t search and not t "pair" and not t "dark"'
    - 'refersto:recid:1467221 and t Higgs and (t "vector-boson fusion" or t "vector boson fusion" or t "weak boson fusion") and not t search and not t "pair" and not t "dark"'
    - 't Higgs and (collaboration:ATLAS or collaboration:CMS) and (t "13 TeV" or t "13.6 TeV") and (t "vector-boson fusion" or t "vector boson fusion" or t VBF or t "production modes") and not t search and not t "pair" and not t "dark"'
  last_run: '2026-10-16'
building_blocks:
  - row: "NLO QCD"
    cells:
      1L:
        status: done
        refs: ["inspire:621007"]
        provenance: {uid: 00108b74, ref: "inspire:621007", locator: "Abstract (NLO QCD calculation for weak-boson fusion, as a flexible parton Monte Carlo program)", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "NNLO QCD"
    cells:
      1L:
        status: done
        approximations: ["one-loop helicity amplitudes (factorisable and non-factorisable) through O(ε²), input for the exact non-factorisable two-loop finite remainder"]
        amplitude: "amp:1L/qQ-qQH-vbf-eps"
        refs: ["inspire:3209301"]
        provenance: {uid: c9fcd62d, ref: "inspire:3209301", locator: "Abstract; Sec. 1 (first step towards exact non-factorisable virtual corrections at NNLO) and Sec. 8 Conclusion (contributions up to O(ε²); O(ε) terms needed for the non-factorisable two-loop finite remainder)", source: agent, status: cross-checked, date: "2026-10-22"}
      2L:
        status: partial
        approximations: ["non-factorisable two-loop amplitude known only in the eikonal expansion: leading power (inspire:1741440; fully analytic in inspire:2657734) and next-to-leading power in p⊥,H/√s (inspire:2661566)", "exact non-factorisable two-loop five-point amplitude with two massive propagators still missing"]
        refs: ["inspire:1741440", "inspire:2657734", "inspire:2661566", "inspire:2659737"]
        provenance: {uid: b4bee07b, ref: "inspire:2659737", locator: "Abstract and Sec. I (two-loop qQ → q'Q'+H finite part so far only in the eikonal approximation; going beyond it requires two-loop five-point amplitudes with two massive propagators, beyond the state of the art); inspire:2657734 Abstract (fully analytic leading-power result); inspire:2661566 Abstract and Sec. 7 (next-to-eikonal correction, O(20)% change of the non-factorisable estimate)", source: agent, status: cross-checked, date: "2026-10-22"}
      RV:
        status: done
        approximations: ["factorisable part in the structure-function approach (inspire:1375305)", "non-factorisable real-virtual computed in inspire:2659737, using one-loop qQ → q'Q'Hg amplitudes from the NLO QCD computation of H+j production in WBF"]
        refs: ["inspire:1375305", "inspire:2659737"]
        provenance: {uid: ccecd901, ref: "inspire:2659737", locator: "Abstract (two-loop contribution combined with real-virtual and double-real non-factorisable corrections) and Sec. I (one-loop amplitudes extracted from the NLO H+j WBF computation, Ref. [18])", source: agent, status: cross-checked, date: "2026-10-22"}
      RR:
        status: done
        approximations: ["factorisable part in the structure-function approach (inspire:1375305)", "non-factorisable double-real computed in inspire:2659737"]
        refs: ["inspire:1375305", "inspire:2659737"]
        provenance: {uid: 2cc0c6d2, ref: "inspire:2659737", locator: "Abstract and Sec. II (non-factorisable double-real emission, Eqs. (1)–(5))", source: agent, status: cross-checked, date: "2026-10-22"}
      ir_scheme:
        status: done
        approximations: ["non-factorisable part: abelian, soft-only singularities; subtraction borrowed from the non-factorisable single-top computation"]
        refs: ["inspire:2659737"]
        provenance: {uid: 64589fdc, ref: "inspire:2659737", locator: "Sec. I and Sec. II (subtraction scheme borrowed almost verbatim from non-factorisable corrections to single-top production, Ref. [17]; only soft singularities)", source: agent, status: cross-checked, date: "2026-10-22"}
      code:
        status: done
        approximations: ["structure-function approach: no colour exchange between the two hadronic systems"]
        refs: ["inspire:849724", "inspire:1375305"]
        provenance: {uid: 9a11dc72, ref: "inspire:849724", locator: "Abstract (total cross sections at NNLO via the structure function approach, factorization of QCD corrections between the two quark lines); inspire:1375305 Abstract (fully differential NNLO in the same limit)", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "N3LO QCD"
    cells:
      code:
        status: done
        approximations: ["structure-function approach: no colour exchange between the two hadronic systems"]
        refs: ["inspire:1467221"]
        provenance: {uid: 27c92a13, ref: "inspire:1467221", locator: "Abstract (inclusive VBF Higgs production at N3LO in the limit with no colour exchange between the hadronic systems)", source: agent, status: cross-checked, date: "2026-10-16"}
      3L:
        status: partial
        approximations: ["non-factorisable O(β0 αs³) contribution only (running of αs), leading eikonal approximation"]
        refs: ["inspire:2696696"]
        provenance: {uid: cfadd441, ref: "inspire:2696696", locator: "Abstract and Sec. 5 (three-loop non-factorisable O(β0 αs³) contribution; renormalisation-scale dependence reduced from O(20)% to below O(5)%); Sec. 4 (leading eikonal two-loop amplitude, Eq. (8), next-to-eikonal not included)", source: agent, status: cross-checked, date: "2026-10-22"}
  - row: "NLO EW"
    cells:
      1L:
        status: done
        refs: ["inspire:754793"]
        provenance: {uid: 293cbee0, ref: "inspire:754793", locator: "Abstract (NLO strong and electroweak corrections to Higgs + 2 jets via weak interactions; EW corrections reduce the cross sections by 5%)", source: agent, status: cross-checked, date: "2026-10-16"}
channels:
  - id: "chan:vbf-h/lhc-13"
    collider: "col:lhc-13"
    initial_state: "pp"
    coverage: partial
    last_reviewed: "2026-10-22"
    headline: {observable: "obs:vbf-h/lhc-13/sigma-vbf", region: "m_H = 125 GeV, inclusive over production kinematics (ATLAS: VBF, |y_H| < 2.5, absolute σ; CMS: signal strength μ_VBF)"}
    measurements:
      - id: "meas:vbf-h/lhc-13/atlas-2022-comb"
        experiment: "ATLAS"
        dataset: "13 TeV, 139 fb⁻¹ (Run 2), combination of Higgs decay-channel analyses"
        ref: "inspire:2104706"
        hepdata: "hepdata:ins2104706/Figure 2a"
      - id: "meas:vbf-h/lhc-13/cms-2022-comb"
        experiment: "CMS"
        dataset: "13 TeV, 138 fb⁻¹ (Run 2), combination of Higgs decay-channel analyses"
        ref: "inspire:2104672"
        hepdata: "hepdata:ins2104672/Production mode strength modifiers"
      - id: "meas:vbf-h/lhc-13/atlas-2023-ww-fid"
        experiment: "ATLAS"
        dataset: "13 TeV, 139 fb⁻¹ (2015–2018), VBF H → WW* → eνμν"
        ref: "inspire:2649598"
    observables:
      - id: "obs:vbf-h/lhc-13/sigma-fid-ww"
        name: "Fiducial σ(VBF H → WW* → eνμν)"
        kind: fiducial
        variable: "σ_fid, particle level, VBF phase space with eμ final state (fiducial definition in Table 2 of arXiv:2304.03053)"
        results:
          - measurement: "meas:vbf-h/lhc-13/atlas-2023-ww-fid"
            total: {value_pct: 23.8, provenance: {uid: c9886df9, ref: "inspire:2649598", locator: "Sec. 8.1, Eq. (5): σ_fid = 1.68 ± 0.40 fb = 1.68 ± 0.33 (stat) ± 0.23 (syst) fb; 0.40/1.68 (Table 4 quotes 23% total)", source: agent, status: cross-checked, date: "2026-10-22"}}
            uncertainties:
              - category: stat
                specific: "Data statistics"
                size: {range: [19.6, 19.6], unit: "%", asymmetric: false}
                provenance: {uid: cffbea86, ref: "inspire:2649598", locator: "Sec. 8.1, Eq. (5): ± 0.33 (stat) of 1.68 fb (Table 4: 20%)", source: agent, status: cross-checked, date: "2026-10-22"}
              - category: syst_combined
                specific: "Total systematic uncertainty"
                size: {range: [13.7, 13.7], unit: "%", asymmetric: false}
                provenance: {uid: 80a76d44, ref: "inspire:2649598", locator: "Sec. 8.1, Eq. (5): ± 0.23 (syst) of 1.68 fb (Table 4: total systematics 13%)", source: agent, status: cross-checked, date: "2026-10-22"}
              - category: background
                specific: "tt̄ modelling (largest background-modelling source)"
                size: {range: [6, 6], unit: "%", asymmetric: false}
                provenance: {uid: 73ff67b4, ref: "inspire:2649598", locator: "Table 4, σ_fid column, 'tt̄ modeling' row: 6%", source: agent, status: cross-checked, date: "2026-10-22"}
              - category: energy_scale
                specific: "Jets, pile-up and E_T^miss"
                size: {range: [5, 5], unit: "%", asymmetric: false}
                provenance: {uid: 73d8072e, ref: "inspire:2649598", locator: "Table 4, σ_fid column, 'Jets & Pile-up & E_T^miss' row: 5%", source: agent, status: cross-checked, date: "2026-10-22"}
              - category: lumi
                specific: "Integrated luminosity"
                size: {range: [1.5, 1.5], unit: "%", asymmetric: false}
                provenance: {uid: 7b9759fe, ref: "inspire:2649598", locator: "Table 4, σ_fid column, 'Luminosity' row: 1.5%", source: agent, status: cross-checked, date: "2026-10-22"}
        predictions:
          - label: "NLO QCD+EW + approx. NNLO QCD normalisation, NLO+PS (Powheg+Pythia 8)"
            accuracy:
              qcd: NLO
              ew: NLO
              shower_matched: true
              approximations: ["fiducial shape at NLO QCD matched to the Pythia 8 shower (dipole recoil)", "normalised to the inclusive NLO QCD+EW cross section with approximate NNLO QCD correction"]
            codes: ["POWHEG-BOX", "Pythia 8"]
            total: {value_pct: 1.9, provenance: {uid: e5934054, ref: "inspire:2649598", locator: "Sec. 8.1: integrated fiducial cross section predicted by Powheg+Pythia 8 is 2.07 ± 0.04 fb (scale variations, PDF and αs); 0.04/2.07", source: agent, status: cross-checked, date: "2026-10-22"}}
            compared_to: ["meas:vbf-h/lhc-13/atlas-2023-ww-fid"]
            refs: ["inspire:2649598"]
            provenance: {uid: fb7825b2, ref: "inspire:2649598", locator: "Sec. 3.1 and Table 1 (Powheg+Pythia 8: NLO QCD & EW + approx. NNLO QCD, NNPDF3.0NLO, AZNLO); Fig. 9 (comparison with σ_fid)", source: agent, status: cross-checked, date: "2026-10-22"}
          - label: "NLO+PS QCD (MG5_aMC@NLO + Herwig 7)"
            accuracy: {qcd: NLO, shower_matched: true, approximations: ["LO EW", "CKKW scheme for ME–PS overlap removal", "Higgs decay via MadSpin"]}
            codes: ["MG5_aMC@NLO", "Herwig 7"]
            compared_to: ["meas:vbf-h/lhc-13/atlas-2023-ww-fid"]
            refs: ["inspire:2649598"]
            provenance: {uid: 053e5c11, ref: "inspire:2649598", locator: "Sec. 3.1 and Table 1 (MG5+Herwig 7: NLO QCD, LO EW, NNPDF30NLO); Sec. 8.1 (4–5% above Powheg+Pythia 8) and Fig. 9", source: agent, status: cross-checked, date: "2026-10-22"}
          - label: "NLO QCD+EW fixed order, parton level (VBFNLO @ NLO)"
            accuracy: {qcd: NLO, ew: NLO, approximations: ["parton level, no shower", "missing τ-lepton decays corrected multiplicatively from VBFNLO @ LO+Pythia 8"]}
            codes: ["VBFNLO"]
            compared_to: ["meas:vbf-h/lhc-13/atlas-2023-ww-fid"]
            refs: ["inspire:2649598"]
            provenance: {uid: 4106f99e, ref: "inspire:2649598", locator: "Sec. 3.1 (VBFNLO 2.7.1 at NLO in QCD and EW; k-factors 0.81 QCD, 0.99 EW in the fiducial phase space); Sec. 8.1 and Fig. 9", source: agent, status: cross-checked, date: "2026-10-22"}
      - id: "obs:vbf-h/lhc-13/sigma-fid-bb"
        name: "Fiducial σ(pp → H(→ bb̄) jj), VBF cuts with two b jets"
        kind: fiducial
        variable: "σ_fid with ≥ 2 b jets (pT > 65 GeV, |y| < 2.5) and WBF cuts on the two leading light jets (pT > 25 GeV, |y| < 4.5, |Δy| > 4.5, m_jj > 600 GeV, y1·y2 < 0); anti-kT R = 0.4"
        predictions:
          - label: "NNLO QCD production × NNLO QCD H → bb̄ decay (massive b quarks in the decay), narrow-width approximation"
            accuracy:
              qcd: NNLO
              approximations: ["narrow-width approximation, production and decay factorised", "Br(H → bb̄) fixed to 0.5824", "b quarks massless in production; only b quarks from the decay are flavour-tagged", "decay scale fixed at μ = m_H (not varied)"]
            total: {value_pct: 2.0, provenance: {uid: '1670e555', ref: "arXiv:2407.09363", locator: "Sec. III, Eq. (8): σ^NNLO = 44.6 +0.9/−0.6 fb (μR = μF varied by 2 around μ0); larger side as % of the central value", source: agent, status: cross-checked, date: "2026-10-22"}}
            uncertainties:
              - category: MHOU
                specific: "μR = μF variation in production"
                method: "μR = μF = 2μ0 and μ0/2 with μ0² = (m_H/2)·sqrt(m_H²/4 + pT,H²); decay scale fixed"
                size: {range: [1.3, 2.0], unit: "%", asymmetric: true}
                provenance: {uid: 097eee62, ref: "arXiv:2407.09363", locator: "Sec. III, Eqs. (7)–(8); text after Eq. (8): scale uncertainties ~2% at NNLO do not capture missing higher orders (NNLO is 10% below NLO)", source: agent, status: cross-checked, date: "2026-10-22"}
            refs: ["inspire:2807339"]
            provenance: {uid: 71b2c30b, ref: "arXiv:2407.09363", locator: "Sec. II (Eqs. (1)–(5), combination of NNLO production and decay) and Sec. III (13 TeV, NNPDF31_nnlo_as_0118, selection following the ATLAS analysis, Ref. [7]); fiducial σ reduced by about 40% from LO to NNLO", source: agent, status: cross-checked, date: "2026-10-22"}
      - id: "obs:vbf-h/lhc-13/sigma-vbf"
        name: "σ(VBF) in the Higgs decay-channel combination (ATLAS: σ(VBF); CMS: μ_VBF)"
        kind: total
        variable: "σ(qq → qqH) at m_H ≈ 125 GeV; ATLAS in |y_H| < 2.5 assuming SM branching fractions; CMS as signal strength relative to the SM"
        results:
          - measurement: "meas:vbf-h/lhc-13/atlas-2022-comb"
            total: {value_pct: 12.2, provenance: {uid: 3e8db970, ref: "hepdata:ins2104706/Figure 2a", locator: "Figure 2a, bin 2 (VBF): 3.8562 pb, 'Total uncertainty' +0.47095/−0.43284 pb; larger side as % of the central value", source: agent, status: cross-checked, date: "2026-10-16"}}
            uncertainties:
              - category: syst_combined
                specific: "Systematic uncertainty (all sources combined)"
                size: {range: [8.5, 9.6], unit: "%", asymmetric: true}
                full_table: "hepdata:ins2104706/Figure 2a"
                provenance: {uid: d56758ac, ref: "hepdata:ins2104706/Figure 2a", locator: "Figure 2a, bin 2, error 'Syst. uncertainty': +0.37054/−0.32654 pb of 3.8562 pb", source: agent, status: cross-checked, date: "2026-10-16"}
          - measurement: "meas:vbf-h/lhc-13/cms-2022-comb"
            total: {value_pct: 15.0, provenance: {uid: 49d3952d, ref: "hepdata:ins2104672/Production mode strength modifiers", locator: "Production mode strength modifiers, μ_VBF = 0.80 ± 0.12 (stat+syst), also Fig. 2 of arXiv:2207.00043", source: agent, status: cross-checked, date: "2026-10-16"}}
            uncertainties:
              - category: stat
                specific: "Data statistics"
                size: {range: [11.3, 12.5], unit: "%", asymmetric: true}
                full_table: "hepdata:ins2104672/Production mode strength modifiers"
                provenance: {uid: c1dcffad, ref: "hepdata:ins2104672/Production mode strength modifiers", locator: "Production mode strength modifiers, μ_VBF: +0.09/−0.10 (stat) of 0.80", source: agent, status: cross-checked, date: "2026-10-16"}
              - category: syst_combined
                specific: "Systematic uncertainty (all sources combined)"
                size: {range: [8.8, 10.0], unit: "%", asymmetric: true}
                full_table: "hepdata:ins2104672/Production mode strength modifiers"
                provenance: {uid: 6be3f626, ref: "hepdata:ins2104672/Production mode strength modifiers", locator: "Production mode strength modifiers, μ_VBF: +0.08/−0.07 (syst) of 0.80", source: agent, status: cross-checked, date: "2026-10-16"}
        predictions:
          - label: "N3LO QCD (proVBFH), structure-function approach, m_H = 125.09 GeV"
            accuracy:
              qcd: N3LO
              approximations: ["no colour exchange between the two hadronic systems", "electroweak corrections not included in this prediction"]
            codes: ["proVBFH"]
            total: {value_pct: 0.13, provenance: {uid: bb6b7514, ref: "arXiv:1606.00840", locator: "Table I, N3LO, 13 TeV: 3.928 pb +0.005/−0.001 pb (scale variation, larger side 0.13%); PDF uncertainty (about 2% at 13 TeV, PDF4LHC15) not included", source: agent, status: cross-checked, date: "2026-10-16"}}
            uncertainties:
              - category: MHOU
                specific: "μR, μF variation of both hadronic sectors"
                method: "seven-point variation of μR, μF by a factor two around the squared momentum of the vector boson, 0.5 < μR/μF < 2"
                size: {range: [0.03, 0.13], unit: "%", asymmetric: true}
                provenance: {uid: 0cf08188, ref: "arXiv:1606.00840", locator: "Table I (N3LO, 13 TeV: +0.005/−0.001 pb of 3.928 pb) and text on the seven-point scale variation", source: agent, status: cross-checked, date: "2026-10-16"}
              - category: PDF
                specific: "PDF4LHC15 prescription, quoted separately and not included in the total"
                pdf_set: "PDF4LHC15_nnlo_mc"
                size: {range: [2.0, 2.0], unit: "%", asymmetric: false}
                provenance: {uid: a268c273, ref: "arXiv:1606.00840", locator: "Text after Table I: typical PDF uncertainties of about 2% at 13 TeV", source: agent, status: cross-checked, date: "2026-10-16"}
            refs: ["inspire:1467221"]
            provenance: {uid: 5a5eadb4, ref: "arXiv:1606.00840", locator: "Table I and Sec. on phenomenology (M_H = 125.09 GeV, PDF4LHC15_nnlo_mc, αs(M_Z) = 0.118, central scale the squared vector-boson momentum)", source: agent, status: cross-checked, date: "2026-10-16"}
            headline: true
          - label: "NNLO QCD (DIS approximation) + NLO EW (LHC Higgs Working Group, YR4), m_H = 125 GeV"
            accuracy:
              qcd: NNLO
              ew: NLO
              approximations: ["DIS (structure-function) approximation: t- and u-channel only", "photon-induced contribution added linearly", "s-channel contribution not included"]
            codes: ["HAWK"]
            total: {value_pct: 2.1, provenance: {uid: 14e5f33e, ref: "arXiv:1610.07922", locator: "Table 25 (Sec. I.5.1.c), 13 TeV: 3781.7(1) fb, ∆scale +0.43/−0.33%, ∆PDF⊕αs ±2.1%; derived here as the larger scale side and PDF⊕αs added in quadrature", source: agent, status: cross-checked, date: "2026-10-16"}}
            uncertainties:
              - category: MHOU
                specific: "μR = μF variation around M_W"
                method: "μR = μF varied in M_W/2 < μ < 2 M_W"
                size: {range: [0.33, 0.43], unit: "%", asymmetric: true}
                provenance: {uid: 35feba0f, ref: "arXiv:1610.07922", locator: "Table 25, 13 TeV row (+0.43/−0.33%); scale variation described in Sec. I.5.1", source: agent, status: cross-checked, date: "2026-10-16"}
              - category: PDF
                specific: "PDF uncertainty"
                pdf_set: "PDF4LHC15_nnlo_100"
                size: {range: [2.1, 2.1], unit: "%", asymmetric: false}
                provenance: {uid: a95fb22f, ref: "arXiv:1610.07922", locator: "Table 25, 13 TeV row (∆PDF/∆αs/∆PDF⊕αs = ±2.1/±0.5/±2.1%)", source: agent, status: cross-checked, date: "2026-10-16"}
              - category: alphas
                specific: "αs uncertainty"
                size: {range: [0.5, 0.5], unit: "%", asymmetric: false}
                provenance: {uid: 247ac96d, ref: "arXiv:1610.07922", locator: "Table 25, 13 TeV row (∆PDF/∆αs/∆PDF⊕αs = ±2.1/±0.5/±2.1%)", source: agent, status: cross-checked, date: "2026-10-16"}
            compared_to: ["meas:vbf-h/lhc-13/atlas-2022-comb", "meas:vbf-h/lhc-13/cms-2022-comb"]
            refs: ["arXiv:1610.07922"]
            provenance: {uid: 847f6fbf, ref: "arXiv:1610.07922", locator: "Sec. I.5.1.c, eq. (I.5.6) and Table 25; cited by both experiments as a source of the SM prediction", source: agent, status: cross-checked, date: "2026-10-16"}
