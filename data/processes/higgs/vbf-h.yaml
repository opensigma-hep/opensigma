      - id: "obs:vbf-h/lhc-8/mu-vbf"
        name: "Signal strength μ_VBF (ATLAS + CMS Run-1 combination)"
        kind: total
        variable: "μ_VBF = σ(VBF)/σ_SM at m_H = 125.09 GeV, assuming SM Higgs branching fractions; 7 and 8 TeV data fitted with one signal strength per production process"
        results:
          - measurement: "meas:vbf-h/lhc-8/atlas-cms-2016-comb"
            total: {value_pct: 21.0, provenance: {uid: fdcdafd4, ref: "hepdata:ins1468068/Table 9", locator: "Table 9, quadrature sum of all errors (bin 2)", source: hepdata, status: machine-verified, date: "2026-10-17"}}
            uncertainties: []
        predictions:
          - label: "NLO QCD+EW + approximate NNLO QCD (LHC Higgs Cross Section WG, YR3), m_H = 125.09 GeV, 8 TeV"
            accuracy:
              qcd: NNLO
              ew: NLO
              approximations: ["order quoted as NLO(QCD+EW) + approximate NNLO(QCD)"]
            total: {value_pct: 2.5, provenance: {uid: 37b7192f, ref: "arXiv:1606.02266", locator: "Table 1, 8 TeV column, VBF row: 1.58 ± 0.04 pb; relative uncertainty 0.04/1.58 derived from the rounded values (quadrature sum of QCD scale, PDF and αs, symmetric as quoted)", source: agent, status: cross-checked, date: "2026-10-17"}}
