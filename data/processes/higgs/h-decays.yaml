id: "proc:h-decays"
name: "Higgs boson decays (H → γγ, ZZ*, WW*, b b̄, τ⁺τ⁻, μ⁺μ⁻, Zγ)"
family: "fam:higgs"
sector: "SM"
description: "Partial widths and branching fractions of the SM Higgs boson. A decay has no collider initial state of its own, so each channel here is the collider at which σ × B is measured (initial state pp), and each decay mode is one observable: the branching fraction or decay signal strength μ^f = B^f/B^f_SM extracted from a global fit with the production cross sections fixed to the SM. Predictions are the LHC Higgs WG branching ratios (HDECAY and Prophecy4f) with their theory (THU) and parametric (quark masses, αs) uncertainties. The building-block matrix lists per-order ingredients decay by decay; each cell names the decay it refers to."
watch:
  recids:
    - 2104706
    - 2104672
    - 2666787
  queries:
    - "t Higgs and (t \"branching\" or t \"decay width\" or t \"partial width\" or t \"decay rate\" or t \"decays\") and (t \"QCD\" or t \"electroweak\" or t \"N3LO\" or t \"N$^3$LO\" or t \"N4LO\" or t \"two-loop\" or t \"three-loop\" or t \"four-loop\" or t \"corrections\") and not t search and not t \"pair\" and not t \"dark\" and not t \"invisible\" and not t MSSM"
    - "t Higgs and (collaboration:ATLAS or collaboration:CMS) and (t \"dimuon\" or t \"muons\" or t \"Z boson and a photon\" or t \"Z gamma\" or t \"branching\" or t \"couplings\" or t \"combination\" or t \"combined measurement\") and (t \"13 TeV\" or t \"13.6 TeV\" or t evidence or t observation or t \"ten years\") and not t \"pair production\" and not t \"dark\" and not t \"invisible\""
building_blocks:
  - row: "NLO QCD"
    cells:
      2L:
        status: "done"
        approximations:
          - "loop-induced decays H → γγ and H → Zγ: NLO QCD is a two-loop correction to the heavy-quark loop"
        refs:
          - "inspire:1366044"
          - "inspire:1366043"
          - "inspire:755422"
        provenance:
          uid: 408da6c5
          ref: "inspire:1366044"
          locator: "Abstract (analytic two-loop QCD corrections to the decay width H → Zγ; polylogarithms up to Li₄ and Li₂,₂); inspire:1366043, abstract (analytic QCD correction to the heavy-quark loop, confirming earlier numerical results); H → γγ: inspire:755422, abstract (complete two-loop QCD and EW corrections)"
          source: "agent"
          status: "agent-draft"
          date: "2026-11-12"
  - row: "NNLO QCD"
    cells:
      3L:
        status: "done"
        approximations:
          - "H → γγ only (loop-induced: NNLO QCD is a three-loop correction)"
        refs:
          - "inspire:1208737"
        provenance:
          uid: '06744022'
          ref: "inspire:1208737"
          locator: "Abstract (three-loop singlet QCD corrections to H → γγ, non-singlet improved; Γ(H → γγ) completely known at O(G_F α² αs², G_F α³))"
          source: "agent"
          status: "agent-draft"
          date: "2026-11-12"
      code:
        status: "done"
        approximations:
          - "H → b b̄ only: fully differential decay rate at NNLO"
        refs:
          - "inspire:939519"
          - "inspire:1341625"
        provenance:
          uid: afb53e72
          ref: "inspire:939519"
          locator: "Abstract (first fully differential H → b b̄ decay at NNLO in QCD); inspire:1341625, abstract (fully differential NNLO decay rate with a general subtraction scheme)"
          source: "agent"
          status: "agent-draft"
          date: "2026-11-12"
  - row: "N3LO QCD"
    cells:
      3L:
        status: "done"
        approximations:
          - "H → b b̄ form factor, massless quarks"
        refs:
          - "inspire:1308939"
        provenance:
          uid: cae107d9
          ref: "inspire:1308939"
          locator: "Abstract (three-loop QCD corrections to the H b b̄ Yukawa vertex function for vanishing quark masses; ingredient for the fully differential third-order decay rate)"
          source: "agent"
          status: "agent-draft"
          date: "2026-11-12"
      code:
        status: "done"
        approximations:
          - "H → b b̄ differential: only diagrams with a direct Higgs–bottom coupling, O(αs³ y_b²) (inspire:1730411)"
          - "inclusive H → q q̄ width known one order higher, O(αs⁴) = N4LO, for massless quarks (inspire:697094)"
          - "H → gg (decay to hadrons) in the heavy-top limit known to N3LO (inspire:715182) and N4LO (inspire:1608630)"
          - "H → γγ: N3LO from the four-loop form factor in the large-m_t expansion (inspire:1860985)"
        refs:
          - "inspire:1730411"
          - "inspire:697094"
          - "inspire:715182"
          - "inspire:1608630"
          - "inspire:1860985"
        provenance:
          uid: ab146ddb
          ref: "inspire:1730411"
          locator: "Abstract (fully differential H → b b̄ at N3LO, O(αs³ y_b²), Projection-to-Born with N-jettiness slicing); inspire:697094, abstract (O(αs⁴) corrections to the Higgs decay rate into quarks from the five-loop massless scalar correlator); inspire:1608630, abstract (Higgs decay to hadrons at N4LO, heavy top and massless light flavours); inspire:715182, abstract (O(αs⁵) correction to Γ(H → gg), M_H < 2M_t); inspire:1860985, abstract (four-loop QCD corrections to the Higgs–photon form factor in the large-m_t expansion, N3LO for the two-photon width)"
          source: "agent"
          status: "agent-draft"
          date: "2026-11-12"
  - row: "NLO EW"
    cells:
      1L:
        status: "done"
        approximations:
          - "H → WW/ZZ → 4 fermions (Prophecy4f): off-shell gauge bosons, complex-mass scheme"
        refs:
          - "inspire:713692"
          - "inspire:732075"
        provenance:
          uid: 2e95ca8a
          ref: "inspire:713692"
          locator: "Abstract (complete O(α) electroweak corrections to H → WW/ZZ → 4 leptons, complex-mass scheme, no on-shell approximation); inspire:732075, abstract (NLO QCD and EW corrections for semileptonic and hadronic four-fermion final states)"
          source: "agent"
          status: "agent-draft"
          date: "2026-11-12"
      2L:
        status: "done"
        approximations:
          - "loop-induced decays H → γγ and H → Zγ: NLO EW is a two-loop correction"
          - "H → γγ evaluated numerically (inspire:755422, techniques in inspire:797190)"
        refs:
          - "inspire:755422"
          - "inspire:797190"
          - "inspire:2783609"
          - "inspire:2778337"
        provenance:
          uid: e36bf95e
          ref: "inspire:755422"
          locator: "Abstract (complete two-loop corrections to H → γγ, QCD and electroweak, numerical evaluation, all kinematic regions with complex masses); inspire:2783609, abstract (NLO electroweak correction to H → Zγ, on-shell scheme); inspire:2778337, abstract (NLO EW corrections to H → Zγ)"
          source: "agent"
          status: "agent-draft"
          date: "2026-11-12"
      code:
        status: "done"
        approximations:
          - "H → Zγ: NLO EW not included in HDECAY (LO only)"
        refs:
          - "arXiv:1610.07922"
          - "arXiv:1107.5909"
          - "inspire:442662"
          - "inspire:713692"
          - "inspire:732075"
        provenance:
          uid: b408c65a
          ref: "arXiv:1610.07922"
          locator: "Sec. I.3.1.a (HDECAY and Prophecy4f used for all partial widths; complete NLO EW corrections implemented in HDECAY for the decays into fermions); arXiv:1107.5909, Sec. II (Prophecy4f: complete NLO QCD and EW corrections to H → 4f; H → Zγ in HDECAY at LO only)"
          source: "agent"
          status: "agent-draft"
          date: "2026-11-12"
  - row: "NNLO QCD×EW"
    cells:
      3L:
        status: "partial"
        approximations:
          - "H → b b̄ only"
          - "optical theorem with asymptotic expansions in mass ratios"
        refs:
          - "inspire:1392467"
        provenance:
          uid: 16900fe2
          ref: "inspire:1392467"
          locator: "Abstract (Γ(H → b b̄) to order α αs from the imaginary part of three-loop Higgs-propagator corrections, asymptotic expansions in mass ratios; same magnitude as the O(αs³) QCD term, opposite sign)"
          source: "agent"
          status: "agent-draft"
          date: "2026-11-12"
