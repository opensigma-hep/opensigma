id: "proc:vh"
name: "Higgs-strahlung (WH and ZH production)"
family: "fam:higgs"
sector: SM
description: "Production of the SM Higgs boson in association with a W or Z boson, qq̄ → V* → VH (plus the loop-induced gg → ZH): the Tevatron's main light-Higgs search channel (H → bb̄). Known at NNLO QCD with NLO electroweak corrections."
watch:
  recids: []
  queries:
    - 't Higgs and (t "associated production" or t "Higgs-strahlung" or t Higgsstrahlung or t WH or t ZH or t VH) and (t NNLO or t N3LO or t "electroweak" or t "QCD corrections" or t "cross section" or t "differential" or t "template" or t "fiducial") and not t search and not t "pair" and not t "dark" and not t top'
    - 'refersto:recid:944447 and t Higgs and (t "associated production" or t WH or t ZH or t VH or t "Higgs-strahlung")'
    - 't Higgs and (collaboration:ATLAS or collaboration:CMS) and (t "13 TeV" or t "13.6 TeV") and (t WH or t ZH or t VH or t "associated production" or t "vector boson" or t "W or Z" or t "W boson" or t "Z boson") and not t search and not t "pair" and not t "dark" and (t "cross section" or t "cross-section" or t "cross sections" or t "template" or t "differential" or t "fiducial")'
  last_run: '2026-10-16'
building_blocks:
  - row: "NNLO QCD"
    cells:
      2L:
        status: done
        approximations: ["Drell–Yan-like corrections plus heavy-quark-loop mediated contributions (gg → HZ), computed separately", "top-Yukawa-induced contributions in inspire:944447"]
        refs: ["inspire:623567", "inspire:944447"]
        provenance: {uid: 850a0510, ref: "inspire:623567", locator: "Abstract (two-loop corrections to the Drell–Yan process q q̄ → V*, and for Z final states the heavy-quark loop mediated processes, in particular gg → HZ)", source: agent, status: cross-checked, date: "2026-10-16"}
      code:
        status: done
        refs: ["inspire:917260", "inspire:623567"]
        provenance: {uid: 6f19bee8, ref: "inspire:917260", locator: "Abstract (fully exclusive NNLO QCD calculation for WH with finite-width effects, W and H decays; subtraction formalism)", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "NLO EW"
    cells:
      1L:
        status: done
        refs: ["inspire:621983"]
        provenance: {uid: 4c13f1f1, ref: "inspire:621983", locator: "Abstract (electroweak O(α) corrections to pp̄/pp → WH/ZH + X)", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "N3LO QCD"
    cells:
      3L:
        status: partial
        approximations: ["gg → ZH channel only", "large-m_t limit, first three 1/m_t terms"]
        amplitude: "amp:3L/gg-ZH-htl"
        refs: ["inspire:3088088"]
        provenance: {uid: 5f6282c5, ref: "inspire:3088088", locator: "Abstract (three-loop virtual corrections to gg → ZH in the large-m_t limit; analytic results for the first three terms of the 1/m_t expansion)", source: agent, status: cross-checked, date: "2026-10-18"}
      RV:
        status: partial
        approximations: ["W+H only: obtained from W+H+jet at NNLO (O(αs³) above the qT cut) in NNLOJET, amplitudes from OpenLoops 2"]
        refs: ["inspire:3175068"]
        provenance: {uid: 66c97283, ref: "inspire:3175068", locator: "arXiv:2606.31286, Methodology (above-cut contribution from NNLO pp → W+H + 1 jet in NNLOJET with antenna subtraction, OpenLoops2 amplitudes)", source: agent, status: agent-draft, date: "2026-10-22"}
      RRR:
        status: partial
        approximations: ["W+H only: obtained from W+H+jet at NNLO (O(αs³) above the qT cut) in NNLOJET"]
        refs: ["inspire:3175068"]
        provenance: {uid: ce0d4d58, ref: "inspire:3175068", locator: "arXiv:2606.31286, Methodology (above-cut pp → W+H + 1 jet at NNLO; double-real dominates the 3M core-hour runtime)", source: agent, status: agent-draft, date: "2026-10-22"}
      ir_scheme:
        status: partial
        approximations: ["W+H only: qT slicing with the N3LO expansion of the RadISH resummation formula below the cut, qT_cut = 5 GeV, linear power corrections added for symmetric cuts"]
        refs: ["inspire:3175068"]
        provenance: {uid: e54969d3, ref: "inspire:3175068", locator: "arXiv:2606.31286, Methodology, Eq. (1) (qT slicing; below-cut from RadISH at N3LO) and Validation section (qT_cut = 5 GeV, slicing error from ±1 GeV variation)", source: agent, status: agent-draft, date: "2026-10-22"}
      code:
        status: partial
        approximations: ["inclusive WH and ZH at N3LO (n3loxs, inspire:2151031)", "fully differential only for pp → W+(→ e+ν)H in the boosted regime (inspire:3175068)", "top-Yukawa terms only at O(yt αs²); ZH fully differential and gg → ZH at higher order missing"]
        refs: ["inspire:2151031", "inspire:3175068"]
        provenance: {uid: c52eb99c, ref: "inspire:3175068", locator: "arXiv:2606.31286, Introduction (inclusive N3LO known, Ref. [13] = arXiv:2209.06138; differential limited to NNLO before this work) and Conclusions (first fully differential N3LO for pp → W+(→ e+ν)H; ZH would also need gg → ZH); inspire:2151031 Abstract (inclusive VH at N3LO, public code n3loxs)", source: agent, status: agent-draft, date: "2026-10-22"}
