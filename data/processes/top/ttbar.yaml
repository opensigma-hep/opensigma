id: "proc:ttbar"
name: "Top-quark pair production (tt̄)"
family: "fam:top"
sector: SM
description: "Hadroproduction of a top-antitop pair, pp/pp̄ → tt̄ + X, dominated by gluon fusion at the LHC and by qq̄ annihilation at the Tevatron. Its inclusive cross section is a benchmark for NNLO+NNLL QCD, an input to gluon-PDF, top-mass (pole and MS-bar) and αs determinations, and a leading background in Higgs and BSM searches."
watch:
  recids: [2971071, 1711626, 1256082, 1225282, 2088291]
  queries:
    - 't "top quark pair" and (collaboration:ATLAS or collaboration:CMS) and t "cross section"'
    - 't "top-quark pair" and (t N3LO or t "third order" or t "NNLO" or t "two-loop") and t "production"'
    - 't "top" and t "pair" and t "electroweak" and (t "NLO" or t "QCD-EW" or t "mixed")'
building_blocks:
  - row: "NLO QCD"
    cells:
      1L:
        status: done
        refs: ["inspire:251743", "inspire:264718"]
        provenance: {uid: 909f8bab, ref: "inspire:251743", locator: "Abstract (full O(αs³) radiative corrections to the total cross section for heavy-quark pair production); inspire:264718 abstract (O(αs) corrections to gg → QQ̄, cross section and differential distributions)", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "NNLO QCD"
    cells:
      2L:
        status: done
        amplitude: "amp:2L/gg-ttbar"
        refs: ["inspire:781013", "inspire:1273586"]
        provenance: {uid: 0a7ef316, ref: "inspire:1273586", locator: "Abstract (two-loop virtual amplitudes in gluon fusion; qq̄ annihilation case given on the same grid); inspire:781013 abstract (qq̄ → tt̄ two-loop, full mass dependence)", source: agent, status: cross-checked, date: "2026-10-16"}
      RV:
        status: done
        refs: ["inspire:1112110", "inspire:1193346", "inspire:1225282"]
        provenance: {uid: '49015317', ref: "inspire:1225282", locator: "Abstract (completes the set of NNLO QCD corrections to the total cross section; gg channel); inspire:1112110 (qq̄), inspire:1193346 (qg) abstracts", source: agent, status: cross-checked, date: "2026-10-16"}
      RR:
        status: done
        refs: ["inspire:1112110", "inspire:1120738", "inspire:1193346", "inspire:1225282"]
        provenance: {uid: 127cdcd9, ref: "inspire:1225282", locator: "Abstract (completes the set of NNLO QCD corrections to the total cross section); inspire:1112110 (qq̄), inspire:1120738 (all-fermionic channels), inspire:1193346 (qg) abstracts", source: agent, status: cross-checked, date: "2026-10-16"}
      ir_scheme:
        status: done
        approximations: ["qT subtraction formalism (independent NNLO calculation, inclusive cross section)"]
        refs: ["inspire:1713542"]
        provenance: {uid: ac1cfef4, ref: "inspire:1713542", locator: "Abstract (NNLO QCD corrections to inclusive tt̄ production computed with the qT subtraction formalism)", source: agent, status: cross-checked, date: "2026-10-16"}
      code:
        status: done
        refs: ["inspire:1082926", "inspire:1402357", "inspire:1713542"]
        provenance: {uid: 5f57cc1f, ref: "inspire:1082926", locator: "Abstract (Top++: total cross section at exact NNLO, with NNLL soft-gluon resummation); inspire:1402357 abstract (fully differential NNLO Monte Carlo); inspire:1713542 abstract (qT-subtraction calculation compared to Top++)", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "NLO EW"
    cells:
      1L:
        status: done
        refs: ["inspire:689348", "inspire:1468062"]
        provenance: {uid: b2550d2f, ref: "inspire:689348", locator: "Abstract (complete EW corrections to QCD-induced tt̄ production in qq̄ annihilation); inspire:1468062 abstract (NLO QCD+EW at O(αsα) and O(αs²α), incl. photon-initiated channels)", source: agent, status: cross-checked, date: "2026-10-16"}
      code:
        status: done
        refs: ["inspire:1599076"]
        provenance: {uid: 3446a1ee, ref: "inspire:1599076", locator: "Abstract (differential tt̄ distributions at the LHC at NNLO QCD including EW corrections)", source: agent, status: cross-checked, date: "2026-10-16"}
