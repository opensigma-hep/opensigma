            uses_amplitudes: ["amp:2L/qqbar-ttbar", "amp:2L/gg-ttbar"]
            total: {value_pct: 4.4, provenance: {uid: f138fdd6, ref: "inspire:2971071", locator: "Sec. 1: σ = 834 ± 21 (PDF) +21 −30 (scale) pb, total uncertainty +3.5/−4.4 %", source: agent, status: cross-checked, date: "2026-10-16"}}
