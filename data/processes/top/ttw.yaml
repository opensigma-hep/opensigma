              resummation: [{accuracy: "NNLL", variable: "soft-gluon threshold"}]
              approximations: ["full NLO QCD and EW plus NNLL soft-gluon corrections (NLO+NNLL)"]
            total: {value_pct: 26.2, provenance: {uid: 3d3d9a8c, ref: "inspire:2136024", locator: "Table 3, σ(tt̄W) NLO+NNLL = 592 +155 −97 (theo) fb; larger side 155/592", source: agent, status: cross-checked, date: "2026-10-17"}}
