            compared_to: ["meas:ttw/lhc-13/cms-2023-multilepton"]
            refs: ["inspire:2136024", "inspire:1774757"]
            provenance: {uid: f2ec3959, ref: "inspire:2136024", locator: "Sec. 3 and Table 3 (σ_tt̄W = 592 +155 −97 (theo) fb at NLO QCD and EW with NNLL QCD corrections; Ref. [16] = Kulesza et al., Eur. Phys. J. C 80 (2020) 428; uncertainty from ME scale variations and PDF choice)", source: agent, status: cross-checked, date: "2026-10-17"}
      - id: "obs:ttw/lhc-13/ac-lep"
        name: "Leptonic charge asymmetry A_c^ℓ in tt̄W, three-lepton events"
        kind: asymmetry
        variable: "A_c^ℓ = [N(Δy^ℓ > 0) − N(Δy^ℓ < 0)] / [N(Δy^ℓ > 0) + N(Δy^ℓ < 0)], Δy^ℓ = |y(ℓ+)| − |y(ℓ−)| of the leptons from the t and t̄ decays"
        results:
