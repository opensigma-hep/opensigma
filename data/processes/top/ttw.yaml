            total: {value_pct: 94.7, provenance: {uid: 53f756f4, ref: "inspire:2970691", locator: "Abstract and Summary: A_c^ℓ = −0.19 +0.16 −0.18; larger side 0.18/0.19", source: agent, status: agent-draft, date: "2026-10-22"}}
