                provenance: {uid: 0fe42179, ref: "inspire:2970691", locator: "Sec. 8: +0.05 −0.06 (syst) of 0.19", source: agent, status: agent-draft, date: "2026-10-22"}
        predictions:
          - label: "NLO QCD + PS (MadGraph5_aMC@NLO FxFx + Pythia 8, QCD and EW tt̄W production), CMS 2025 comparison"
            accuracy:
              qcd: NLO
              shower_matched: true
