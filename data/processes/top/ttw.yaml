            codes: ["MadGraph5_aMC@NLO", "Pythia8"]
            total: {value_pct: 7.1, provenance: {uid: 2c73a4c6, ref: "inspire:2970691", locator: "Sec. 8 and Abstract: expectation −0.085 ± 0.006 from NLO simulations; 0.006/0.085", source: agent, status: cross-checked, date: "2026-10-22"}}
            compared_to: ["meas:ttw/lhc-13/cms-2025-diff-ac"]
            refs: ["inspire:2970691"]
            provenance: {uid: 7a4e55b3, ref: "inspire:2970691", locator: "Sec. 3 (nominal tt̄W signal from MG5_aMC@NLO v2.6.5 with αs³α and αsα³ terms, NLO for tt̄W with and without an additional parton, FxFx, Pythia 8.240) and Sec. 8", source: agent, status: cross-checked, date: "2026-10-22"}
