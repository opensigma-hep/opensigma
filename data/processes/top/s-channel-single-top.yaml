id: "proc:s-channel-single-top"
name: "s-channel single-top production"
family: "fam:top"
sector: SM
description: "Electroweak production of a single top quark or antiquark through an s-channel timelike W (q q̄′ → t b̄, q̄ q′ → t̄ b), the smallest of the three single-top modes at hadron colliders. Observed at the Tevatron by the CDF and D0 combination; at the LHC only evidence-level measurements exist (ATLAS 8 and 13 TeV) because of the overwhelming tt̄ and W+jets backgrounds. Known to NNLO QCD with a narrow-width, factorised approximation, with soft-gluon resummation giving NNLL and approximate N3LO results."
watch:
  recids: []
  queries:
    - 't "s-channel" and t "single top"'
    - 't "s channel" and t "single top"'
  last_run: '2026-10-16'
building_blocks:
  - row: "NLO QCD"
    cells:
      code:
        status: done
        refs: ["inspire:1300820"]
        provenance: {uid: 1d91b2c6, ref: "inspire:2153660", locator: "Sec. 3 (s-channel cross-section calculated at NLO in QCD with HatHor 2.1); inspire:1300820 abstract (HatHor extended to single top-quark production, NLO QCD)", source: agent, status: cross-checked, date: "2026-10-17"}
  - row: "NNLO QCD"
    cells:
      code:
        status: partial
        approximations: ["fully differential NNLO with semileptonic decay in the narrow-width approximation, neglecting the colour correlation between the light and heavy quark lines"]
        refs: ["inspire:1681745"]
        provenance: {uid: 3ace8ea3, ref: "inspire:1681745", locator: "Abstract (fully differential NNLO calculation of s-channel single top (anti)quark production with semileptonic decay, neglecting colour correlation between light and heavy quark lines, narrow width approximation)", source: agent, status: cross-checked, date: "2026-10-17"}
  - row: "N3LO QCD"
    cells:
      code:
        status: partial
        approximations: ["approximate N3LO from third-order soft-gluon corrections added to the NNLO result; final-state b-quarks treated as massless"]
        refs: ["inspire:2894376"]
        provenance: {uid: eb75693f, ref: "inspire:2894376", locator: "Abstract (approximate N3LO from the expansion of the resummed cross section to third order; massless b-quarks)", source: agent, status: cross-checked, date: "2026-10-17"}
channels:
  - id: "chan:s-channel-single-top/tevatron"
    collider: "col:tevatron-1960"
    initial_state: "pp̄"
    coverage: partial
    last_reviewed: "2026-10-16"
    headline: {observable: "obs:s-channel-single-top/tevatron/sigma-s", region: "inclusive σ(s-channel), mt = 172.5 GeV"}
    measurements:
      - id: "meas:s-channel-single-top/tevatron/cdf-d0-2014"
        experiment: "combination"
        dataset: "1.96 TeV, up to 9.7 fb⁻¹ per experiment (CDF + D0 combination)"
        ref: "inspire:1282028"
        hepdata: "hepdata:ins1282028/Table 1"
    observables:
      - id: "obs:s-channel-single-top/tevatron/sigma-s"
        name: "Inclusive σ(s-channel)"
        kind: total
        variable: "σ_s at mt = 172.5 GeV"
        results:
          - measurement: "meas:s-channel-single-top/tevatron/cdf-d0-2014"
            total:
              value_pct: 20.0
              provenance: {uid: efcd3119, ref: "hepdata:ins1282028/Table 1", locator: "Table 1, quadrature sum of all errors (min over bins)", source: hepdata, status: machine-verified, date: "2026-10-17"}
            uncertainties: []
        predictions:
          - label: "NLO + NNLL soft-gluon resummation, CDF + D0 comparison"
            accuracy:
              qcd: NLO
              resummation: [{accuracy: "NNLL", variable: "soft and collinear gluon (threshold)"}]
              approximations: ["NLO QCD with NNLL resummation of soft and collinear gluon corrections, expanded through NNLO (inspire:843998)"]
            total: {value_pct: 5.7, provenance: {uid: '715e8746', ref: "inspire:1282028", locator: "Results section: σ_s^SM = 1.05 ± 0.06 pb (mt = 172.5 GeV), quoted from Kidonakis, Phys. Rev. D 81, 054028 (Ref. [31] of the paper)", source: agent, status: cross-checked, date: "2026-10-17"}}
            compared_to: ["meas:s-channel-single-top/tevatron/cdf-d0-2014"]
            refs: ["inspire:1282028", "inspire:843998"]
            provenance: {uid: 4c674339, ref: "inspire:1282028", locator: "Results section and Fig. 3 (σ_s^SM = 1.05 ± 0.06 pb, Ref. [31]); inspire:843998 abstract (NNLL resummation for s-channel single top at the Tevatron and LHC)", source: agent, status: cross-checked, date: "2026-10-17"}
            headline: true
