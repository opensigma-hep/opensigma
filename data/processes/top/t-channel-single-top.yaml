            total: {value_pct: 1.6, provenance: {uid: 6083ef9f, ref: "inspire:2764820", locator: "Sec. 3.1: σ(tq) = 134.2 ± 2.2 pb (relative uncertainty 1.6%), scale, PDF and αs uncertainties combined", source: agent, status: cross-checked, date: "2026-10-16"}}
