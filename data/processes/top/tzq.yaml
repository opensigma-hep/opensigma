    measurements:
      - id: "meas:tzq/lhc-13/cms-2022-trilepton"
        experiment: "CMS"
        dataset: "13 TeV, 138 fb⁻¹, three leptons (electrons or muons)"
        ref: "inspire:1961177"
        hepdata: "hepdata:ins1961177/parton_abs_ZPt"
      - id: "meas:tzq/lhc-13/atlas-2020-trilepton"
        experiment: "ATLAS"
        dataset: "13 TeV, 139 fb⁻¹ (2015–2018), three leptons and two or three jets"
        ref: "inspire:1781293"
      - id: "meas:tzq/lhc-13/cms-2024-multilepton"
        experiment: "CMS"
        dataset: "13 TeV, 138 fb⁻¹ (2016–2018), ≥ 3ℓ; tZq measured simultaneously with tt̄Z + tWZ"
