id: "proc:tzq"
name: "Single top + Z (tZq)"
family: "fam:top"
sector: SM
description: "Electroweak production of a single top quark (or antiquark) in association with a Z boson and a light quark, pp → tZq, measured in the trilepton final state tℓ⁺ℓ⁻q. Sensitive to the tZ and WWZ couplings and to the top-quark polarisation; irreducible background to FCNC searches and to tt̄Z. Observed by CMS and ATLAS at 13 TeV, with first differential measurements by CMS. Theory: NLO QCD and NLO QCD+EW (on-shell and fully off-shell tℓ⁺ℓ⁻j), with a sizeable four- versus five-flavour-scheme uncertainty; approximate NNLO from soft-gluon corrections exists, no two-loop amplitude."
watch:
  recids: [1961177, 1781293, 1801855, 2122428]
  queries:
    - '(collaboration:ATLAS or collaboration:CMS) and (t "tZq" or ((t "single top quark" or t "single top-quark" or t "single-top-quark" or t "top quark") and t "Z boson" and t "association")) and not t "flavour-changing" and not t "flavor-changing" and not t "pair"'
    - '(t "tZj" or t "tZq" or t "tqZ") and (t NLO or t NNLO or t "two-loop" or t "off-shell" or t "soft-gluon" or t electroweak)'
building_blocks:
  - row: "NLO QCD"
    cells:
      code:
        status: done
        refs: ["inspire:1219814", "inspire:1801855", "inspire:2122428"]
        provenance: {uid: 3d66159f, ref: "inspire:1219814", locator: "Abstract (single top + Z at NLO including the decays of the top quark and the Z boson); inspire:1801855 abstract (tZj and tℓ⁺ℓ⁻j at NLO QCD+EW in the 5FS, all production channels, with a 4FS-5FS uncertainty); inspire:2122428 abstract (NLO tZj with complete off-shell effects and spin correlations)", source: agent, status: agent-draft, date: "2026-11-12"}
  - row: "NNLO QCD"
    cells:
      2L:
        status: missing
        provenance: {uid: 184770ee, ref: "inspire:1801855", locator: "Introduction (a calculation at NNLO QCD accuracy is at the moment unfeasible); an INSPIRE title search on 2026-11-12 for two-loop / NNLO tZq (tZj, tqZ) amplitudes returned no record", source: agent, status: agent-draft, date: "2026-11-12"}
      code:
        status: partial
        approximations: ["approximate NNLO: second-order soft-gluon corrections added to the exact NLO result, total cross section and top-quark rapidity distribution only"]
        refs: ["inspire:2166834"]
        provenance: {uid: fac83255, ref: "inspire:2166834", locator: "Abstract and text above Table 1 (aNNLO = NLO + second-order soft-gluon corrections; total cross sections at LHC energies and top-quark rapidity distributions)", source: agent, status: agent-draft, date: "2026-11-12"}
  - row: "NLO EW"
    cells:
      code:
        status: done
        refs: ["inspire:1801855", "inspire:2122428"]
        provenance: {uid: d33179de, ref: "inspire:1801855", locator: "Abstract (tZj with the Z boson undecayed and the complete final state tℓ⁺ℓ⁻j at NLO QCD+EW accuracy); inspire:2122428 abstract (off-shell tZj combining QCD and electroweak radiative corrections)", source: agent, status: agent-draft, date: "2026-11-12"}
channels:
