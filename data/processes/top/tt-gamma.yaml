id: "proc:tt-gamma"
name: "tt̄γ associated production"
family: "fam:top"
sector: SM
description: "Production of a top-antitop pair in association with an isolated photon, pp → tt̄γ. Probes the top-quark electric charge and the top-photon coupling (electroweak dipole operators). Measured as fiducial cross sections, since photons radiated from the top-quark decay products cannot be separated from those radiated in production; ATLAS also isolates the production component. Theory: NLO QCD including full off-shell effects in the dilepton channel, complete NLO (QCD+EW), and approximate NNLO from soft-gluon corrections; approximate two-loop amplitudes and the leading-colour two-loop integrals exist, a full NNLO calculation does not."
watch:
  recids: [2768921, 2013377, 1876579, 3033999, 2606517]
  queries:
    - '(collaboration:ATLAS or collaboration:CMS) and t top and (t photon or t photons) and (t "cross section" or t "cross sections" or t "cross-section" or t "cross-sections" or t asymmetry) and not t Higgs and not t "flavor changing" and not t "flavour-changing"'
    - '(fulltext "ttγ" or t "top-quark pair production with isolated photons" or t "top quark pair production in association with a photon") and (t NNLO or t "two-loop" or t "off-shell" or t "soft-gluon" or t NLO or t resummation)'
building_blocks:
  - row: "NLO QCD"
    cells:
      code:
        status: done
        refs: ["inspire:889007", "inspire:1664327"]
        provenance: {uid: '969e8770', ref: "inspire:889007", locator: "Abstract (NLO QCD corrections to tt̄γ at the Tevatron and the LHC with top-quark decays in the narrow-width approximation, including photon radiation off the decay products); inspire:1664327 abstract (first full NLO QCD computation for e⁺ν_e μ⁻ν̄_μ b b̄ γ with all resonant and non-resonant diagrams, interferences and off-shell effects)", source: agent, status: agent-draft, date: "2026-11-12"}
  - row: "NNLO QCD"
    cells:
      1L:
        status: done
        refs: ["inspire:2921544"]
        provenance: {uid: 0a2a4151, ref: "inspire:2921544", locator: "Abstract (analytic one-loop QCD helicity amplitudes for tt̄γ and tt̄j through O(ε²), required for the two-loop hard functions of the NNLO computation)", source: agent, status: agent-draft, date: "2026-11-12"}
      2L:
        status: partial
        amplitude: "amp:2L/qqbar-gg-ttbar-gamma-he"
        approximations: ["IR poles exact; finite remainders only in the high-energy boosted limit (mass factorisation)", "two-loop integrals complete in the leading-colour approximation, finite remainder not yet assembled from them"]
        refs: ["inspire:3033999", "inspire:3221697"]
        provenance: {uid: ae37319e, ref: "inspire:3033999", locator: "Abstract (two-loop IR poles with full top-mass dependence, finite remainders approximated in the high-energy boosted limit; a step toward NNLO predictions); inspire:3221697 abstract (two-loop integrals for on-shell tt̄γ in the leading-colour approximation, which will enable the analytic extraction of the two-loop finite remainder)", source: agent, status: agent-draft, date: "2026-11-12"}
      code:
        status: partial
        approximations: ["approximate NNLO: second-order soft-gluon corrections added to the complete NLO result, no full NNLO calculation"]
        refs: ["inspire:2606517"]
        provenance: {uid: 41f3bec0, ref: "inspire:2606517", locator: "Abstract (approximate NNLO cross section with second-order soft-gluon corrections added to the complete NLO result); inspire:3033999 Introduction (full NNLO QCD corrections are the current frontier)", source: agent, status: agent-draft, date: "2026-11-12"}
  - row: "NLO EW"
    cells:
      code:
        status: done
        refs: ["inspire:1867201", "inspire:2765813"]
        provenance: {uid: da0914fb, ref: "inspire:1867201", locator: "Abstract (first Complete-NLO predictions for tt̄γ with at least one isolated photon, automated in MadGraph5_aMC@NLO); inspire:2765813 abstract (complete NLO including top-quark decays in the narrow-width approximation, dilepton channel)", source: agent, status: agent-draft, date: "2026-11-12"}
