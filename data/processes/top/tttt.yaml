id: "proc:tttt"
name: "Four-top-quark production (tt̄tt̄)"
family: "fam:top"
sector: SM
description: "Production of two top-antitop pairs, pp → tt̄tt̄. One of the rarest Standard Model processes observed at the LHC (cross section of order 10 fb at 13 TeV), sensitive to the top Yukawa coupling, the Higgs width, four-fermion operators and top-philic new physics. Observed by ATLAS and CMS in 2023 in same-sign dilepton and multilepton final states. Theory: complete NLO (QCD and EW, with large and partly cancelling subleading EW terms) matched to threshold resummation at NLL′; NNLL resummation is preliminary, NNLO QCD is out of reach (2 → 4 with four massive coloured particles)."
watch:
  recids: [2661880, 2648095, 2611719, 1634855]
  queries:
    - '(t "four top" or t "four-top" or t "four top quark" or t "four-top-quark" or t "four top quarks" or t "tttt") and (collaboration:ATLAS or collaboration:CMS) and (t "cross section" or t "cross-section" or t observation or t evidence or t measurement or t production)'
    - '(t "four top" or t "four-top" or t "four top quarks") and (t NLO or t NNLO or t NNLL or t resummation or t "two-loop" or t "off-shell" or t "electroweak corrections")'
building_blocks:
  - row: "NLO QCD"
    cells:
      code:
        status: done
        refs: ["inspire:1118265", "inspire:1634855", "inspire:1955008", "inspire:2749469"]
        provenance: {uid: aabe8508, ref: "inspire:1118265", locator: "Abstract (NLO QCD corrections to pp → tt̄tt̄ + X, integrated and differential); inspire:1634855 abstract (complete NLO in MadGraph5_aMC@NLO); inspire:1955008 abstract (POWHEG BOX generator, NLO QCD at O(αs⁵) with LO EW production channels); inspire:2749469 abstract (NLO QCD in production and decays, narrow-width approximation, 4ℓ channel)", source: agent, status: agent-draft, date: "2026-11-12"}
  - row: "NNLO QCD"
    cells:
      2L:
        status: missing
        provenance: {uid: 79b09f41, ref: "inspire:2611719", locator: "Introduction (the calculation of next-to-next-to-leading order QCD corrections remains out of reach); an INSPIRE title search on 2026-11-12 for two-loop / NNLO four-top amplitudes returned no record", source: agent, status: agent-draft, date: "2026-11-12"}
      code:
        status: missing
        provenance: {uid: fb8be7ef, ref: "inspire:2611719", locator: "Introduction (NNLO QCD corrections out of reach; higher orders are estimated through threshold resummation instead)", source: agent, status: agent-draft, date: "2026-11-12"}
  - row: "NLO EW"
    cells:
      code:
        status: done
        refs: ["inspire:1634855"]
        provenance: {uid: 191f05f3, ref: "inspire:1634855", locator: "Abstract (complete-NLO predictions: all non-vanishing O(αs^i α^j) contributions with i + j = 4, 5 for tt̄tt̄ evaluated without any approximation)", source: agent, status: agent-draft, date: "2026-11-12"}
