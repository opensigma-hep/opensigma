            total:
              value_pct: 6.6
              provenance: {uid: 9716fce6, ref: "hepdata:ins2744513/Table 13", locator: "Table 13, quadrature sum of all errors (bin 4, combination of 2ℓ, 3ℓ, 4ℓ)", source: hepdata, status: machine-verified, date: "2026-10-17"}
            uncertainties:
