            codes: ["MadGraph5_aMC@NLO"]
            total: {value_pct: 2.9, provenance: {uid: ca91f664, ref: "inspire:2836638", locator: "Table 2, row MSHT20 NNLO pdf, 13 TeV: 998 +21 −26 (scale) +20 −13 (pdf) fb; scale and pdf added in quadrature, larger side sqrt(26² + 13²)/998", source: agent, status: cross-checked, date: "2026-10-17"}}
            uncertainties:
              - category: MHOU
