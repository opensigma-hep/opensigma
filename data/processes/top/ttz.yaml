                size: {range: [2.1, 2.6], unit: "%", asymmetric: true}
                provenance: {uid: 05c8a381, ref: "inspire:2836638", locator: "Table 2, row MSHT20 NNLO pdf, 13 TeV: +21 −26 fb (scale) of 998 fb", source: agent, status: cross-checked, date: "2026-10-17"}
