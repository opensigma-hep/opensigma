id: "proc:ttz"
name: "tt̄Z associated production"
family: "fam:top"
sector: SM
description: "Production of a top-antitop pair in association with a Z boson, pp → tt̄Z. Directly probes the top-quark neutral-current (tt̄Z) couplings and is an irreducible background to tt̄H, four-top and many BSM searches. Complete NLO QCD and EW corrections are available, with soft-gluon resummation (NNLL) and approximate NNLO/N3LO soft-gluon corrections on top; no exact two-loop amplitude exists yet. Measured at the percent-to-ten-percent level at 13 TeV (3ℓ and 4ℓ final states, extended to 2ℓ by ATLAS)."
watch:
  recids: []
  queries:
    - 't "ttZ" or t "t\\bar{t}Z" or t "t\\overline{t}Z"'
    - '(t "association with a Z boson" or t "associated with a Z boson") and t "top" and (t "pair" or t "cross section" or t "cross sections")'
  last_run: '2026-10-16'
building_blocks:
  - row: "NLO QCD"
    cells:
      code:
        status: done
        refs: ["inspire:783373", "inspire:944180", "inspire:1359461"]
        provenance: {uid: db9e37cf, ref: "inspire:783373", locator: "Abstract (full NLO QCD corrections to pp → tt̄Z); inspire:944180 abstract (NLO with HELAC-Oneloop and POWHEG-Box subtraction); inspire:1359461 abstract (MadGraph5_aMC@NLO, QCD+EW)", source: agent, status: cross-checked, date: "2026-10-17"}
  - row: "NNLO QCD"
    cells:
      2L:
        status: missing
        provenance: {uid: ec96fcb0, ref: "inspire:2744513", locator: "Introduction (most accurate prediction is at full NLO including EW corrections, supplemented by NNLL soft-gluon resummation; no NNLO calculation cited)", source: agent, status: cross-checked, date: "2026-10-17"}
      code:
        status: partial
        approximations: ["approximate NNLO and N3LO from soft-gluon corrections added to the exact NLO result, no exact two-loop amplitude"]
        refs: ["inspire:2836638"]
        provenance: {uid: 2c956a08, ref: "inspire:2836638", locator: "Abstract (aNNLO and aN3LO cross sections adding second- and third-order soft-gluon corrections to the exact NLO QCD result, plus NLO EW)", source: agent, status: cross-checked, date: "2026-10-17"}
  - row: "NLO EW"
    cells:
      code:
        status: done
        refs: ["inspire:1359461"]
        provenance: {uid: f2f9289b, ref: "inspire:1359461", locator: "Abstract (O(αS²α²) NLO contribution with all QCD, QED and weak effects in MadGraph5_aMC@NLO, combined with O(αS³α) and the lowest-order terms)", source: agent, status: cross-checked, date: "2026-10-17"}
channels:
  - id: "chan:ttz/lhc-13"
    collider: "col:lhc-13"
    initial_state: "pp"
    coverage: partial
    last_reviewed: "2026-10-16"
    headline: {observable: "obs:ttz/lhc-13/sigma-tot", region: "inclusive σ(tt̄Z), on-shell Z (70 < m_ff < 110 GeV), mt = 172.5 GeV"}
    measurements:
      - id: "meas:ttz/lhc-13/atlas-2024-multilepton"
        experiment: "ATLAS"
        dataset: "13 TeV, 140 fb⁻¹ (2015–2018), 2ℓ + 3ℓ + 4ℓ combination"
        ref: "inspire:2744513"
        hepdata: "hepdata:ins2744513/Table 13"
      - id: "meas:ttz/lhc-13/cms-2019-multilepton"
        experiment: "CMS"
        dataset: "13 TeV, 77.5 fb⁻¹ (2016–2017), 3ℓ + 4ℓ"
        ref: "inspire:1746445"
    observables:
      - id: "obs:ttz/lhc-13/sigma-tot"
        name: "Inclusive σ(tt̄Z)"
        kind: total
        variable: "σ_tt̄Z, on-shell Z (70 < m_ff < 110 GeV), mt = 172.5 GeV"
        results:
