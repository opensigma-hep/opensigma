id: "proc:ee-event-shapes"
name: "e⁺e⁻ → hadrons event shapes (thrust, C-parameter, jet masses, broadenings)"
family: "fam:ee-hadronic"
sector: SM
description: "Normalised distributions of the standard three-jet-like event-shape variables in e⁺e⁻ → γ*/Z → hadrons: thrust, heavy-jet mass, wide and total jet broadening, C-parameter and the Durham y₃. Measured at LEP1/LEP2 (and SLC, PETRA) and used for precise αs extractions; predictions combine NNLO fixed order (EERAD3 and an independent code) with resummation of two-jet-region logarithms (NLLA to N3LL′ in SCET) and fitted or modelled hadronisation corrections. This draft headlines thrust."
watch:
  recids: []
  queries:
    - 't thrust and (t "e+e-" or t "e+ e-" or t "e$^+$e$^-$" or t annihilation or t ALEPH or t LEP)'
    - 't event and t shape and (t "e+e-" or t "e$^+$e$^-$" or t annihilation or t LEP or t alpha or t "strong coupling")'
    - 't "event shapes" and (t resummation or t N3LL or t NNLL or t NNLO or t "strong coupling" or t alpha)'
    - 't "C-parameter" and (t resummation or t N3LL or t NNLL or t "strong coupling" or t annihilation)'
    - 't ALEPH and t archived and (t shape or t jet or t thrust or t correlator)'
  last_run: '2026-10-16'
building_blocks:
  - row: "NLO QCD"
    cells:
      1L:
        status: done
        refs: ["inspire:154571"]
        provenance: {uid: ae8058a7, ref: "arXiv:0711.4711", locator: "Sec. 1 and Table 1 (NLO: one-loop γ*→qq̄g plus tree-level γ*→qq̄gg, γ*→qq̄qq̄; NLO parton-level generators [7-9], first Ellis-Ross-Terrano)", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "NNLO QCD"
    cells:
      2L:
        status: done
        amplitude: "amp:2L/qqbar-Vg"
        refs: ["arXiv:hep-ph/0112081", "arXiv:hep-ph/0206067"]
        provenance: {uid: 4983c933, ref: "arXiv:0711.4711", locator: "Sec. 4 (two-loop γ*→qq̄g matrix elements of [13], IBP reduction, master integrals in 1d/2d harmonic polylogarithms)", source: agent, status: cross-checked, date: "2026-10-16"}
      RV:
        status: done
        refs: ["arXiv:hep-ph/9609474", "arXiv:hep-ph/9610370", "arXiv:hep-ph/9706297", "arXiv:hep-ph/9708239"]
        provenance: {uid: 947891f3, ref: "arXiv:0711.4711", locator: "Sec. 4 and ref. [14] (one-loop γ*→4 partons, originally derived for NLO four-jet production)", source: agent, status: cross-checked, date: "2026-10-16"}
      RR:
        status: done
        refs: ["arXiv:0711.4711"]
        provenance: {uid: 0a99c6a6, ref: "arXiv:0711.4711", locator: "Sec. 1 and Sec. 4 (tree-level γ*→5 partons [15], taken over from an NLO four-jet event generator [35])", source: agent, status: cross-checked, date: "2026-10-16"}
      ir_scheme:
        status: done
        approximations: ["antenna subtraction extended to NNLO"]
        refs: ["arXiv:hep-ph/0505111", "arXiv:0710.0346"]
        provenance: {uid: 4e3fa899, ref: "arXiv:0711.4711", locator: "Sec. 4 (NNLO antenna subtraction formalism [16, 17, 42]); Erratum note on corrected large-angle soft subtraction", source: agent, status: cross-checked, date: "2026-10-16"}
      code:
        status: done
        refs: ["arXiv:0711.4711", "arXiv:0807.3241", "arXiv:0904.1077"]
        provenance: {uid: 026a57fd, ref: "arXiv:0711.4711", locator: "Sec. 1 (parton-level program EERAD3 for generic IR-safe three-jet observables); independent implementation: arXiv:0807.3241 abstract, arXiv:0904.1077 abstract", source: agent, status: cross-checked, date: "2026-10-16"}
