id: "proc:ee-jet-rates"
name: "e⁺e⁻ → hadrons jet rates and Durham y₂₃"
family: "fam:ee-hadronic"
sector: SM
description: "Jet multiplicity rates (jet cross sections normalised to σ_had) as a function of the resolution parameter y_cut, and the Durham two-to-three-jet transition variable y₂₃, in e⁺e⁻ → hadrons. The three-jet rate is known at NNLO (O(αs³)), the two-jet rate at N3LO and, matched to NNLL resummation, used for αs fits to LEP and PETRA data. This draft covers the Durham algorithm at LEP1 (Z peak), headlining the y₂₃ distribution."
watch:
  recids: []
  queries:
    - '(t "jet rate" or t "jet rates") and (t "e+e-" or t "e+ e-" or t "e$^+$e$^-$" or t annihilation or t LEP or t ALEPH)'
    - 't Durham and (t "e+e-" or t "e$^+$e$^-$" or t annihilation or t LEP) and (t NNLL or t N3LO or t resummation or t "strong coupling" or t alpha)'
    - 't "event shapes" and (t "jet rate" or t Durham or t y23 or t "three-jet")'
    - 't ALEPH and t archived and (t jet or t rate)'
  last_run: '2026-10-16'
building_blocks:
  - row: "NNLO QCD"
    cells:
      2L:
        status: done
        amplitude: "amp:2L/qqbar-Vg"
        refs: ["arXiv:0802.0813"]
        provenance: {uid: c5872e13, ref: "arXiv:0802.0813", locator: "p. 4 (contributions of the two-loop virtual and virtual-radiation graphs to the three- and four-jet rates)", source: agent, status: cross-checked, date: "2026-10-16"}
      ir_scheme:
        status: done
        approximations: ["antenna subtraction extended to NNLO"]
        refs: ["arXiv:0802.0813"]
        provenance: {uid: feb15228, ref: "arXiv:0802.0813", locator: "p. 3 (antenna subtraction method [25, 37] extended to NNLO [38], implemented for e+e- → 3 jets in EERAD3)", source: agent, status: cross-checked, date: "2026-10-16"}
      code:
        status: done
        refs: ["arXiv:0802.0813", "arXiv:0904.1077"]
        provenance: {uid: 433d0769, ref: "arXiv:0802.0813", locator: "p. 3 (parton-level program EERAD3, matrix elements with up to five external partons, jet rates for any IR-safe algorithm); independent NNLO jet rates: arXiv:0904.1077 abstract (Durham, Geneva, Jade-E0, Cambridge)", source: agent, status: cross-checked, date: "2026-10-16"}
