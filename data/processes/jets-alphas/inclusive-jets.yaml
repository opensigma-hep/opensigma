          - label: "NLO+NLL (joint threshold and jet-radius resummation)"
            accuracy:
              qcd: NLO
              resummation: [{accuracy: "NLL", variable: "threshold and jet radius (joint)"}]
            codes: ["NLL-Jet", "MEKS"]
            compared_to: ["meas:inclusive-jets/lhc-13/cms-2021"]
            refs: ["inspire:1649956", "inspire:1972986"]
            provenance: {uid: 58168b4d, ref: "inspire:1972986", locator: "Sec. 4.1, Eq. (3) (NLO+NLL k-factor from the NLL-Jet calculation of Liu, Moch, Ringer)", source: agent, status: cross-checked, date: "2026-10-16"}
          - label: "NNLO QCD + small-R NNLL resummation (Stripper), μ = pT, NNPDF3.1 NNLO"
            accuracy:
              qcd: NNLO
              resummation: [{accuracy: "NNLL", variable: "small jet radius (ln R)"}]
              approximations: ["small-R resummation matched to NNLO; threshold resummation not included", "scale uncertainty from 15-point (μR, μF, μJ) variation by factors of 2; calculated for R = 0.1–1.2 in the CMS R-dependence phase space (84 GeV < pT < 1588 GeV, |y| < 2)"]
            codes: ["Stripper"]
            uses_amplitudes: ["amp:2L/2to2-partons", "amp:1L/2to3-partons", "amp:1L/2to2-partons"]
            refs: ["inspire:2905639", "inspire:3149757"]
            provenance: {uid: e0cf0fbc, ref: "inspire:2905639", locator: "Abstract and Sec. 3 (first NNLL small-R resummation matched to NNLO via the Stripper fragmentation formalism; μR = μF = μJ = pT; NNPDF3.1 NNLO; 13 TeV LHC); Conclusions (threshold resummation not yet included). Follow-up: inspire:3149757 Secs. 2–3 (same NNLO+NNLL setup, scale choices pT and ĤT)", source: agent, status: cross-checked, date: "2026-10-17"}
          - label: "NLO QCD (NLOJET++/APPLGRID) ⊗ NP ⊗ EW, CT14 NLO"
            accuracy:
