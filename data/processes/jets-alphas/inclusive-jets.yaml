id: "proc:inclusive-jets"
name: "Inclusive jet production (pp/pp̄ → jet + X)"
family: "fam:jets-alphas"
sector: SM
description: "Single-inclusive jet production, pp/pp̄ → jet + X, counting every jet in the event, double-differential in jet pT and rapidity. Probes the high-x gluon PDF and αs at the highest scales; known at NNLO QCD (leading and full colour) with NLO weak corrections and non-perturbative corrections applied multiplicatively."
watch:
  recids: []
  queries:
    - 't "inclusive jet" and (collaboration:ATLAS or collaboration:CMS) and t "TeV" and t "cross" and not t search'
    - 't "single jet inclusive" or (t "inclusive jet" and (t NNLO or t resummation or t "next-to-next"))'
    - 't "strong coupling" and t "inclusive jet"'
    - 't "jet" and t "13.6 TeV" and t "cross" and (collaboration:ATLAS or collaboration:CMS) and not t search and not t "tagging"'
  last_run: '2026-10-16'
building_blocks:
  - row: "NLO QCD"
    cells:
      1L:
        status: done
        amplitude: "amp:1L/2to2-partons"
        refs: ["inspire:218454", "inspire:336137", "inspire:332376"]
        provenance: {uid: 28bb2843, ref: "inspire:218454", locator: "Abstract (matrix elements squared for all 2→2 and 2→3 parton subprocesses at O(αs³))", source: agent, status: cross-checked, date: "2026-10-16"}
      code:
        status: done
        refs: ["inspire:623857", "inspire:727193", "inspire:1972986"]
        provenance: {uid: fb90af42, ref: "inspire:1972986", locator: "Sec. 4.1 (fixed-order predictions at NLO and NNLO from NLOJet++ and NNLOJET, NLO implemented in fastNLO)", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "NNLO QCD"
    cells:
      2L:
        status: done
        amplitude: "amp:2L/2to2-partons"
        refs: ["inspire:553143", "inspire:552493", "inspire:535309", "inspire:536445"]
        provenance: {uid: 26c549aa, ref: "inspire:1495841", locator: "p. 1 (NNLO needs tree-level [18], one-loop [19–21] and two-loop [22–24] parton-level amplitudes)", source: agent, status: cross-checked, date: "2026-10-16"}
      RV:
        status: done
        amplitude: "amp:1L/2to3-partons"
        refs: ["inspire:352808", "inspire:377332", "inspire:373656"]
        provenance: {uid: adb18877, ref: "inspire:1495841", locator: "p. 1 (NNLO needs tree-level [18], one-loop [19–21] and two-loop [22–24] parton-level amplitudes)", source: agent, status: cross-checked, date: "2026-10-16"}
      RR:
        status: done
        approximations: ["original NNLOJET calculation at leading colour (Nc², NcNF, NF²) in all channels; full colour: inspire:1747058, inspire:2070536"]
        refs: ["inspire:1495841", "inspire:1747058", "inspire:2070536"]
        provenance: {uid: 8ff1a787, ref: "inspire:1495841", locator: "p. 1 (double-real subprocesses gg→gggg, gg→qq̄gg, gg→qq̄qq̄; leading-colour contributions in all channels)", source: agent, status: cross-checked, date: "2026-10-16"}
      ir_scheme:
        status: done
        approximations: ["antenna subtraction (NNLOJET)", "sector-improved residue subtraction (independent exact-colour calculation, inspire:1747058)"]
        refs: ["inspire:1495841", "inspire:1747058"]
        provenance: {uid: 8a62f46f, ref: "inspire:1495841", locator: "p. 1 (antenna subtraction implemented in the parton-level event generator NNLOJET)", source: agent, status: cross-checked, date: "2026-10-16"}
      code:
        status: done
        refs: ["inspire:2906156", "inspire:1495841", "inspire:2070536", "inspire:1747058"]
        provenance: {uid: 83f180af, ref: "inspire:2906156", locator: "Abstract (open-source NNLOJET code for jet cross sections at NNLO QCD in hadron-hadron collisions)", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "NLO EW"
    cells:
      1L:
        status: partial
        approximations: ["tree-level O(αsα, α²) and weak loop O(αs²α) corrections only"]
        refs: ["inspire:1188853"]
        provenance: {uid: 07d894ba, ref: "inspire:1188853", locator: "Abstract (most important electroweak corrections to dijet production: tree-level O(αsα, α²) and weak loops O(αs²α))", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "N3LO QCD"
    cells:
      3L:
        status: done
        amplitude: "amp:3L/2to2-partons"
        refs: ["inspire:1897402", "inspire:2107829", "inspire:1995045"]
        provenance: {uid: 65784f9a, ref: "inspire:2107829", locator: "Introduction (concludes the analytical calculation of all four-parton scattering amplitudes in three-loop QCD: qq' → qq̄' and crossed channels, gg → gg, qq̄ → gg and crossed channels, in full-colour massless QCD)", source: agent, status: agent-draft, date: "2026-10-18"}
      RV:
        status: done
        amplitude: "amp:2L/2to3-partons"
        approximations: ["full colour, all partonic channels (ggggg, qq̄ggg, four quarks + gluon, identical and different flavours)"]
        refs: ["inspire:2723232", "inspire:2723256", "inspire:2728739"]
        provenance: {uid: 5ce4725b, ref: "inspire:2723232", locator: "Abstract and Introduction (all two-loop helicity amplitudes for five partons in all relevant flavour configurations, retaining all colour structures; five gluons, two quarks + three gluons, four quarks + one gluon)", source: agent, status: agent-draft, date: "2026-10-18"}
