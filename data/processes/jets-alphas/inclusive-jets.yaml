                provenance: {uid: 8205f519, ref: "inspire:1634970", locator: "Sec. 9.1 (scale uncertainty rising from 10% at pT ≈ 100 GeV in the central bin to about 50% at highest pT in the most forward bin)", source: agent, status: cross-checked, date: "2026-10-16"}
