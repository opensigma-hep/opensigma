        predictions:
          - label: "NNLO QCD full colour (NNLOJET), μ = mjj, ⊗ NP ⊗ NLO EW"
            accuracy:
              qcd: NNLO
              ew: NLO
              approximations: ["NNLO with full colour information", "NP corrections applied; EW (tree and one-loop weak) corrections applied multiplicatively, no uncertainty estimated"]
            codes: ["NNLOJET", "pineAPPL", "APPLGRID"]
            uses_amplitudes: ["amp:2L/2to2-partons", "amp:1L/2to3-partons", "amp:1L/2to2-partons"]
            compared_to: ["meas:dijets/lhc-13/atlas-2025"]
            refs: ["inspire:3095511", "inspire:2070536"]
            provenance: {uid: 9522999f, ref: "inspire:3095511", locator: "Sec. 7 (NNLO with full colour from NNLOJET, μR = μF = mjj, CT18/MSHT2020/NNPDF3.1/NNPDF4.0/ATLASpdf21; NP corrections; EW corrections of Eq. (1))", source: agent, status: cross-checked, date: "2026-10-16"}
            headline: true
          - label: "NNLO QCD leading colour (NNLOJET/APPLfast), μ = mjj, ⊗ NP ⊗ EW"
            accuracy:
              qcd: NNLO
              ew: NLO
              approximations: ["leading-colour and leading-flavour-number approximation at NNLO", "NP and EW (weak) corrections applied multiplicatively"]
            codes: ["NNLOJET", "fastNLO", "APPLfast"]
            uses_amplitudes: ["amp:2L/2to2-partons", "amp:1L/2to3-partons", "amp:1L/2to2-partons"]
