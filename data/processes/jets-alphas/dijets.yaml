id: "proc:dijets"
name: "Inclusive dijet production (pp/pp̄ → jj + X)"
family: "fam:jets-alphas"
sector: SM
description: "Inclusive dijet production, pp/pp̄ → jj + X, measured as a function of the dijet invariant mass mjj and a rapidity variable (|y|max, y* or the boost y_b). Sensitive to the gluon PDF and αs over a wide range of scales; known at NNLO QCD (leading and full colour) with NLO weak and non-perturbative corrections applied multiplicatively."
watch:
  recids: [3095511, 2741343, 1601511, 1736275, 2070536]
  queries:
    - 't "dijet" and t "cross section" and (collaboration:ATLAS or collaboration:CMS) and t "13 TeV" and not t "search"'
    - 't "dijet" and (t NNLO or t "next-to-next-to-leading") and t "jet production"'
    - 't "strong coupling" and t dijet'
building_blocks:
  - row: "NLO QCD"
    cells:
      1L:
        status: done
        amplitude: "amp:1L/2to2-partons"
        refs: ["inspire:218454", "inspire:336137", "inspire:372282"]
        provenance: {uid: 3e8a177f, ref: "inspire:336137", locator: "Abstract (two-jet inclusive cross section at order αs³ including the one-loop perturbative corrections)", source: agent, status: cross-checked, date: "2026-10-16"}
      code:
        status: done
        refs: ["inspire:623857", "inspire:372282"]
        provenance: {uid: d07676ab, ref: "inspire:3095511", locator: "Sec. 7 (previous ATLAS dijet publication relied on NLO leading-colour predictions from NLOJet++)", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "NNLO QCD"
    cells:
      2L:
        status: done
        amplitude: "amp:2L/2to2-partons"
        refs: ["inspire:553143", "inspire:552493", "inspire:535309", "inspire:536445"]
        provenance: {uid: 857c020c, ref: "inspire:1495841", locator: "p. 1 (NNLO jet production needs tree-level, one-loop and two-loop parton-level amplitudes; same amplitude set as single-jet inclusive)", source: agent, status: cross-checked, date: "2026-10-16"}
      RV:
        status: done
        amplitude: "amp:1L/2to3-partons"
        refs: ["inspire:352808", "inspire:377332", "inspire:373656"]
        provenance: {uid: 1b4f8db9, ref: "inspire:1495841", locator: "p. 1 (NNLO jet production needs tree-level, one-loop and two-loop parton-level amplitudes; same amplitude set as single-jet inclusive)", source: agent, status: cross-checked, date: "2026-10-16"}
      RR:
        status: done
        approximations: ["original NNLOJET dijet calculation at leading colour in all partonic channels; full colour: inspire:2070536"]
        refs: ["inspire:1601511", "inspire:2070536"]
        provenance: {uid: c8a918da, ref: "inspire:1601511", locator: "Abstract (dijet production at leading colour in all partonic channels at NNLO)", source: agent, status: cross-checked, date: "2026-10-16"}
      ir_scheme:
        status: done
        approximations: ["antenna subtraction (NNLOJET)"]
        refs: ["inspire:1601511"]
        provenance: {uid: 3d48c4bf, ref: "inspire:1601511", locator: "p. 2 (NNLOJET framework employing the antenna subtraction method)", source: agent, status: cross-checked, date: "2026-10-16"}
      code:
        status: done
        refs: ["inspire:2906156", "inspire:1601511", "inspire:1736275", "inspire:2070536"]
        provenance: {uid: 18c536e5, ref: "inspire:2906156", locator: "Abstract (open-source NNLOJET code for jet cross sections at NNLO QCD in hadron-hadron collisions)", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "NLO EW"
    cells:
      1L:
        status: partial
        approximations: ["tree-level O(αsα, α²) and weak loop O(αs²α) corrections only"]
        refs: ["inspire:1188853"]
        provenance: {uid: 3045750c, ref: "inspire:1188853", locator: "Abstract (most important electroweak corrections to dijet production at the LHC and the Tevatron: tree-level O(αsα, α²) and weak loops O(αs²α))", source: agent, status: cross-checked, date: "2026-10-16"}
channels:
  - id: "chan:dijets/lhc-13"
    collider: "col:lhc-13"
    initial_state: "pp"
    coverage: partial
    last_reviewed: "2026-10-16"
    headline: {observable: "obs:dijets/lhc-13/d2sigma-mjj-y", region: "anti-kT R = 0.4, y* < 0.5 (ATLAS) / |y|max < 0.5 (CMS), mjj ≈ 1–2 TeV (CMS bin 1029–1187 GeV)"}
    measurements:
      - id: "meas:dijets/lhc-13/atlas-2025"
        experiment: "ATLAS"
        dataset: "13 TeV, 140 fb⁻¹ (2015–2018), anti-kt R = 0.4"
        ref: "inspire:3095511"
      - id: "meas:dijets/lhc-13/cms-2023"
        experiment: "CMS"
        dataset: "13 TeV, up to 36.3 fb⁻¹ (2016), anti-kT R = 0.4"
        ref: "inspire:2741343"
        hepdata: "hepdata:ins2741343/CrossSection_2D_Mass_AK4"
