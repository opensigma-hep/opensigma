id: "proc:zz"
name: "ZZ pair production (leptonic)"
family: "fam:vector-bosons"
sector: SM
description: "Production of a Z-boson pair, pp → ZZ → 4ℓ (and 2ℓ2ν), from qq̄ annihilation and loop-induced gluon fusion. Cleanest diboson final state, probing neutral triple gauge couplings, and the continuum background to Higgs → ZZ* → 4ℓ and to off-shell Higgs studies. Known at NNLO QCD with NLO EW and NLO QCD for the gluon-fusion channel."
watch:
  recids: []
  queries:
    - (t ZZ or t "Z boson pair" or t "four-lepton" or t "four leptons") and (collaboration:ATLAS or collaboration:CMS) and t "cross" and not t Higgs and tc article
    - (t ZZ or t "Z boson pair" or t "Z-boson pair") and (t NNLO or t N3LO or t "electroweak corrections" or t resummation or t "gluon fusion" or t NLO) and not t Higgs and tc article
  last_run: '2026-10-16'
building_blocks:
  - row: "NLO QCD"
    cells:
      1L:
        status: done
        refs: ["inspire:467827"]
        provenance: {uid: 867ddb34, ref: "inspire:467827", locator: "Abstract (one-loop QCD helicity amplitudes for q q̄ → W+W−, ZZ, W±Z including leptonic decays)", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "NNLO QCD"
    cells:
      2L:
        status: done
        amplitude: "amp:2L/qqbar-VV"
        refs: ["inspire:1353132"]
        provenance: {uid: 07b4e471, ref: "inspire:1353132", locator: "Abstract (two-loop massless QCD helicity amplitudes for q q̄' → V1 V2 → 4 leptons, arbitrary vector-boson virtualities)", source: agent, status: cross-checked, date: "2026-10-16"}
      code:
        status: done
        refs: ["inspire:1295500", "inspire:1384273"]
        provenance: {uid: 49d6997f, ref: "inspire:1384273", locator: "Abstract (complete NNLO QCD corrections to four-charged-lepton production in the ZZ signal region, fiducial cross sections and distributions); inclusive: inspire:1295500 abstract", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "N3LO QCD"
    cells:
      code:
        status: partial
        approximations: ["only the gluon-fusion channel gg → ZZ at NLO QCD, massless-quark loops (the loop-induced part of N3LO)"]
        refs: ["inspire:1394395"]
        provenance: {uid: 5dedb8ca, ref: "inspire:1394395", locator: "Abstract (NLO QCD corrections to gg → ZZ, a distinct and potentially dominant part of the N3LO QCD contributions to Z-pair production; five light quark loops in the massless approximation)", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "NLO EW"
    cells:
      1L:
        status: done
        refs: ["inspire:1418197", "inspire:1498315"]
        provenance: {uid: a7ba6132, ref: "inspire:1498315", locator: "Abstract (NLO EW corrections to ZZ production with leptonic decays into μ+μ−e+e− or μ+μ−μ+μ−, complete LO and NLO matrix elements, off-shell effects in the complex-mass scheme); first complete μ+μ−e+e− calculation: inspire:1418197 abstract", source: agent, status: cross-checked, date: "2026-10-16"}
