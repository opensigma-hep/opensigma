id: proc:w-gamma
name: Wγ production (pp → W±γ → ℓνγ)
family: fam:vector-bosons
sector: SM
description: 'Production of a W boson with an isolated prompt photon, pp → W±γ → ℓνγ + X, from q q̄′ annihilation with the photon radiated off the quarks, the W (WWγ triple gauge coupling) or the decay lepton. The radiation amplitude zero of the Born amplitude makes QCD corrections unusually large: NLO more than doubles the LO rate and NNLO adds a further 19–26%. Known at NNLO QCD and NLO EW, with NNLO+PS generators; no complete N3LO ingredient set exists yet.'
watch:
  recids:
    - 1357993
    - 1861752
    - 1978840
  queries:
    - (t "W gamma" or t "Wγ" or t "W\gamma" or t "W^\pm\gamma" or t "W boson and a photon") and (collaboration:ATLAS or collaboration:CMS) and not t resonance and not t "two jets" and tc article
    - (t "W gamma" or t "Wγ" or t "W\gamma" or t "γW") and (t NNLO or t N3LO or t "electroweak corrections" or t "two-loop" or t "three-loop" or t resummation or t "parton shower") and tc article
