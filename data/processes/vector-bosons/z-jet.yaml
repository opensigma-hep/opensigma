id: "proc:z-jet"
name: "Z/γ* + jets (Z → ℓℓ)"
family: "fam:vector-bosons"
sector: SM
description: "Production of a Z/γ* decaying to a charged-lepton pair in association with one or more hard jets, pp/pp̄ → Z/γ*(→ ℓℓ) + ≥ n jets + X, from qq̄ → Zg, qg → Zq and crossings. A stringent test of perturbative QCD with high-multiplicity merged generators, the control process for Z(→νν̄) + jets backgrounds in dark-matter and new-physics searches, and sensitive to the gluon PDF through the Z pT and jet pT spectra. The ≥ 1-jet inclusive rate is known at NNLO QCD, and NLO EW corrections are available."
watch:
  recids: [1424546]
  queries:
    - 't "Z+jet" or t "Z+jets" or t "Z + jet" or t "Z + jets" or t "Z boson in association with jets" or t "Z boson in association with a jet" or t "Z boson plus jet"'
  last_run: '2026-10-16'
building_blocks:
  - row: "NLO QCD"
    cells:
      1L:
        status: done
        refs: ["inspire:266596"]
        provenance: {uid: f5d53989, ref: "inspire:266596", locator: "Abstract (full computation of dσ/dqT² for W, Z and virtual γ production to second order in QCD at high and moderate qT, i.e. Z + jet at O(αs²))", source: agent, status: cross-checked, date: "2026-10-17"}
      RR:
        status: done
        refs: ["inspire:266596"]
        provenance: {uid: e9652622, ref: "inspire:266596", locator: "Abstract (second-order QCD computation including the qg, gg and singlet qq̄ + qq channels, analytic constituent cross sections dσ/dqT² dy)", source: agent, status: cross-checked, date: "2026-10-17"}
      ir_scheme:
        status: done
        approximations: ["crossing of all-final-state NLO results with universal crossing functions"]
        refs: ["inspire:33945"]
        provenance: {uid: 8c242ca8, ref: "inspire:33945", locator: "Abstract (NLO jet cross sections from a 'crossing' of all-final-state calculations; applied to jets in association with a vector boson including all decay correlations)", source: agent, status: cross-checked, date: "2026-10-17"}
      code:
        status: done
        refs: ["inspire:33945", "inspire:851571"]
        provenance: {uid: 3efe9a13, ref: "inspire:851571", locator: "Abstract (BlackHat + Sherpa NLO QCD predictions for Z, γ* + 1, 2, 3 jets with Z/γ* → e+e−, Tevatron; with ref inspire:33945 for the early Z + jet NLO code including decay correlations)", source: agent, status: cross-checked, date: "2026-10-17"}
  - row: "NNLO QCD"
    cells:
      2L:
        status: done
        amplitude: "amp:2L/qqbar-Vg"
        refs: ["inspire:587998"]
        provenance: {uid: f907bbae, ref: "inspire:587998", locator: "Abstract via amp:2L/qqbar-Vg (two-loop QCD helicity amplitudes for γ* → qq̄g, crossed to qq̄ → Z g for Z + jet)", source: agent, status: cross-checked, date: "2026-10-17"}
      RV:
        status: done
        refs: ["inspire:446755"]
        provenance: {uid: dff6a993, ref: "inspire:446755", locator: "Abstract (one-loop helicity amplitudes for e+e− → four partons, also those for W, Z or Drell-Yan production in association with two jets at hadron colliders)", source: agent, status: cross-checked, date: "2026-10-17"}
      ir_scheme:
        status: done
        approximations: ["N-jettiness subtraction"]
        refs: ["inspire:1358633", "inspire:1408300"]
        provenance: {uid: 515b4970, ref: "inspire:1408300", locator: "Abstract (first complete NNLO calculation of Z + jet, using the N-jettiness subtraction scheme to regulate real-emission infrared divergences; scheme introduced in the W + jet paper inspire:1358633)", source: agent, status: cross-checked, date: "2026-10-17"}
      code:
        status: done
        approximations: ["fixed-order parton level, with leptonic Z decay and fiducial cuts; two independent calculations (N-jettiness and a second NNLO calculation, inspire:1382345)"]
        refs: ["inspire:1408300", "inspire:1382345", "inspire:1424546"]
        provenance: {uid: 68d17bf4, ref: "inspire:1382345", locator: "Abstract (cross section and differential distributions for Z + jet to NNLO QCD, including the leptonic decay of the Z boson; NNLO increases NLO by about 1%)", source: agent, status: cross-checked, date: "2026-10-17"}
  - row: "NLO EW"
    cells:
      1L:
        status: done
        refs: ["inspire:891490"]
        provenance: {uid: ed43615c, ref: "inspire:891490", locator: "Abstract (first NLO EW calculation for Z + jet hadroproduction including leptonic Z decays, complex-mass scheme, all off-shell effects and the γ* contribution; LHC and Tevatron)", source: agent, status: cross-checked, date: "2026-10-17"}
      code:
        status: done
        refs: ["inspire:1406942"]
        provenance: {uid: 988c1e7d, ref: "inspire:1406942", locator: "Abstract (automated NLO QCD+EW for off-shell V + up to two jets at 13 TeV with OpenLoops, Munich and Sherpa, including multijet merging)", source: agent, status: cross-checked, date: "2026-10-17"}
  - row: "NNLO QCD×EW"
    cells:
      code:
        status: partial
        approximations: ["parton-level combination of NNLO QCD and NLO EW with two-loop Sudakov logarithms, for use via reweighting of Monte Carlo samples"]
        refs: ["inspire:1599401"]
        provenance: {uid: fd0f62be, ref: "inspire:1599401", locator: "Abstract (combination of state-of-the-art calculations for all V + jets processes: NNLO QCD and NLO EW corrections supplemented by Sudakov logarithms at two loops, parton level)", source: agent, status: cross-checked, date: "2026-10-17"}
      2L:
        status: partial
        approximations: ["bosonic corrections only (closed fermion loops neglected)", "boosted-Z region, numerical grid in (pT,Z, yZ)"]
        amplitude: "amp:2L/qqbar-Zg-qcdew-bosonic"
        refs: ["inspire:2739971"]
        provenance: {uid: e7b996a7, ref: "inspire:2739971", locator: "Abstract (bosonic contribution to the two-loop mixed QCD-electroweak amplitudes for Z + jet, evaluated numerically on a grid in rapidity and transverse momentum of the Z)", source: agent, status: cross-checked, date: "2026-10-18"}
  - row: "N3LO QCD"
    cells:
      3L:
        status: partial
        approximations: ["planar (leading-colour) contributions only"]
        amplitude: "amp:3L/qqbar-Vg-planar"
        refs: ["inspire:2683225"]
        provenance: {uid: 94fd4ca7, ref: "inspire:2683225", locator: "Abstract (planar three-loop QCD helicity amplitudes for V + q q̄ + g, V = Z, W±, γ*; finite remainders in multiple polylogarithms)", source: agent, status: cross-checked, date: "2026-10-18"}
