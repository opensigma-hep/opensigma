id: "proc:ww"
name: "W⁺W⁻ pair production (leptonic)"
family: "fam:vector-bosons"
sector: SM
description: "Production of a W⁺W⁻ pair, pp → W⁺W⁻ → ℓνℓ′ν′ + X, from qq̄ annihilation and (loop-induced, including Higgs-mediated) gluon fusion. Probes the triple gauge couplings, is an irreducible background to H → WW* and the cleanest test of NNLO QCD plus NLO EW predictions for massive diboson production."
watch:
  recids: [1734263, 1814328, 1311991, 1353132, 1457600, 1636973, 2796231]
  queries:
    - 't "W+W-" and (collaboration:ATLAS or collaboration:CMS) and t "cross section" and not t "jets" and not t Higgs'
    - 't "W+W-" and (t NNLO or t N3LO or t "electroweak corrections" or t resummation or t "gluon fusion") and not t "two jets"'
building_blocks:
  - row: "NLO QCD"
    cells:
      1L:
        status: done
        refs: ["inspire:467827"]
        provenance: {uid: 88ee4bf9, ref: "inspire:467827", locator: "Abstract (one-loop QCD helicity amplitudes for q q̄ → W+W−, ZZ, W±Z including leptonic decays)", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "NNLO QCD"
    cells:
      2L:
        status: done
        amplitude: "amp:2L/qqbar-VV"
        refs: ["inspire:1353132"]
        provenance: {uid: '90562084', ref: "inspire:1353132", locator: "Abstract (two-loop massless QCD helicity amplitudes for q q̄' → V1 V2 → 4 leptons, arbitrary vector-boson virtualities)", source: agent, status: cross-checked, date: "2026-10-16"}
      code:
        status: done
        refs: ["inspire:1311991", "inspire:1636973"]
        provenance: {uid: '770736e3', ref: "inspire:1311991", locator: "Abstract (first QCD calculation up to NNLO for on-shell W+W− production); off-shell, all leptonic channels: inspire:1636973 (MATRIX) abstract", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "NLO EW"
    cells:
      1L:
        status: done
        refs: ["inspire:1457600"]
        provenance: {uid: c9e14bbb, ref: "inspire:1457600", locator: "Abstract (first NLO EW calculation for pp → W+W− → 4 leptons with full off-shell effects, complex-mass scheme)", source: agent, status: cross-checked, date: "2026-10-16"}
channels:
  - id: "chan:ww/lhc-13"
    collider: "col:lhc-13"
    initial_state: "pp"
    coverage: partial
    last_reviewed: "2026-10-16"
    headline: {observable: "obs:ww/lhc-13/sigma-tot", region: "Total inclusive pp → W⁺W⁻, 13 TeV (extrapolated to the full phase space)"}
    measurements:
      - id: "meas:ww/lhc-13/cms-2020-tot"
        experiment: "CMS"
        dataset: "13 TeV, 35.9 fb⁻¹ (2016)"
        ref: "inspire:1814328"
        hepdata: "hepdata:ins1814328/Table 5"
      - id: "meas:ww/lhc-13/atlas-2019-fid"
        experiment: "ATLAS"
        dataset: "13 TeV, 36.1 fb⁻¹ (2015–2016), eμ"
        ref: "inspire:1734263"
        hepdata: "hepdata:ins1734263/Table 1"
    observables:
      - id: "obs:ww/lhc-13/sigma-tot"
        name: "Total σ(pp → W⁺W⁻)"
        kind: total
        variable: "σ_tot, all W decay modes (extrapolated from dilepton final states)"
        results:
          - measurement: "meas:ww/lhc-13/cms-2020-tot"
            total: {value_pct: 5.8, provenance: {uid: fa20c75a, ref: "hepdata:ins1814328/Table 5", locator: "Table 5, quadrature sum of all errors (bin 7)", source: hepdata, status: machine-verified, date: "2026-10-16"}}
            uncertainties:
              - category: stat
                specific: "Data statistics"
                size: {range: [1.2, 1.2], unit: "%", asymmetric: false}
                provenance: {uid: 7fdbd09e, ref: "inspire:1814328", locator: "Results section, sequential-cut analysis: σ_tot = 117.6 ± 1.4 (stat) ± 5.5 (syst) ± 1.9 (thy) ± 3.2 (lum) pb; stat of 117.6 pb", source: agent, status: cross-checked, date: "2026-10-16"}
              - category: syst_combined
                specific: "Experimental systematics excluding luminosity (combined)"
                size: {range: [4.7, 4.7], unit: "%", asymmetric: false}
                provenance: {uid: b8c8f4ac, ref: "inspire:1814328", locator: "Results section, sequential-cut analysis: ± 5.5 (syst) of 117.6 pb", source: agent, status: cross-checked, date: "2026-10-16"}
              - category: acceptance_extrapolation
                specific: "Theory modelling (acceptance extrapolation)"
                size: {range: [1.6, 1.6], unit: "%", asymmetric: false}
                provenance: {uid: 7efdb37a, ref: "inspire:1814328", locator: "Results section, sequential-cut analysis: ± 1.9 (thy) of 117.6 pb", source: agent, status: cross-checked, date: "2026-10-16"}
              - category: lumi
                specific: "Integrated luminosity"
                size: {range: [2.7, 2.7], unit: "%", asymmetric: false}
                provenance: {uid: d737e476, ref: "inspire:1814328", locator: "Results section, sequential-cut analysis: ± 3.2 (lum) of 117.6 pb", source: agent, status: cross-checked, date: "2026-10-16"}
        predictions:
          - label: "NNLO QCD qq̄ + NLO gg→WW + NLO EW (CMS)"
            accuracy:
              qcd: NNLO
              ew: NLO
              approximations: ["qq̄ at NNLO QCD, gg → WW at LO scaled by the NLO/LO factor 1.4", "NLO EW as a −1.2% correction to the qq̄ channel"]
            uses_amplitudes: ["amp:2L/qqbar-VV"]
            total: {value_pct: 3.0, provenance: {uid: 8685ea69, ref: "inspire:1814328", locator: "Introduction, theory paragraph: σ_tot^NNLO = 118.8 ± 3.6 pb (scale, PDF and αS uncertainties; PDF + αS = 2.0 pb)", source: agent, status: cross-checked, date: "2026-10-16"}}
            compared_to: ["meas:ww/lhc-13/cms-2020-tot"]
            refs: ["inspire:1814328", "inspire:1311991"]
            provenance: {uid: 21b30ab3, ref: "inspire:1814328", locator: "Introduction, theory paragraph (σ_tot^NNLO = 118.8 ± 3.6 pb), qq̄ NNLO calculation of Gehrmann et al. (their ref. [8])", source: agent, status: cross-checked, date: "2026-10-16"}
            headline: true
      - id: "obs:ww/lhc-13/sigma-fid-0jet"
        name: "Fiducial σ(pp → W⁺W⁻ → eμνν), jet veto 35 GeV"
        kind: fiducial
