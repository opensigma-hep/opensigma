id: "proc:wz"
name: "W±Z pair production (leptonic)"
family: "fam:vector-bosons"
sector: SM
description: "Production of a W±Z pair, pp → W±Z → ℓνℓ′ℓ′ + X, from qq̄′ annihilation. Probes the WWZ triple gauge coupling and quark/antiquark PDFs through its charge asymmetry, and is a background to many multi-lepton searches. Known at NNLO QCD plus NLO EW for off-shell final states."
watch:
  recids: []
  queries:
    - (t WZ or t "W Z" or t "W±Z") and (collaboration:ATLAS or collaboration:CMS) and t "cross" and not t Higgs and not t "two jets" and tc article
    - (t WZ or t "W Z" or t "W±Z" or t "W boson and a Z") and (t NNLO or t N3LO or t "electroweak corrections" or t resummation or t "gluon fusion") and not t "two jets" and tc article
  last_run: '2026-10-16'
building_blocks:
  - row: "NLO QCD"
    cells:
      1L:
        status: done
        refs: ["inspire:467827"]
        provenance: {uid: 9188601d, ref: "inspire:467827", locator: "Abstract (one-loop QCD helicity amplitudes for q q̄ → W+W−, ZZ, W±Z including leptonic decays)", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "NNLO QCD"
    cells:
      2L:
        status: done
        amplitude: "amp:2L/qqbar-VV"
        refs: ["inspire:1353132"]
        provenance: {uid: 50a9ed03, ref: "inspire:1353132", locator: "Abstract (two-loop massless QCD helicity amplitudes for q q̄' → V1 V2 → 4 leptons, arbitrary vector-boson virtualities)", source: agent, status: cross-checked, date: "2026-10-16"}
      code:
        status: done
        refs: ["inspire:1452811"]
        provenance: {uid: 09f88225, ref: "inspire:1452811", locator: "Abstract (first NNLO QCD computation for W±Z; inclusive on-shell and off-shell rates with the Z mass window)", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "NLO EW"
    cells:
      1L:
        status: done
        refs: ["inspire:1618343"]
        provenance: {uid: 4fe01735, ref: "inspire:1618343", locator: "Abstract (first NLO EW computation for the four-lepton final states μ+μ−e+νe, μ+μ−e−ν̄e, μ+μ−μ+νμ, μ+μ−μ−ν̄μ)", source: agent, status: cross-checked, date: "2026-10-16"}
