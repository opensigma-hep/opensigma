id: proc:vbf-z
name: Electroweak Zjj production (VBF Z)
family: fam:vector-bosons
sector: SM
description: Purely electroweak production of a Z boson with two jets, pp → Zjj → ℓ⁺ℓ⁻jj at O(α⁴), dominated by vector-boson fusion (WW → Z) with two forward tagging jets and little hadronic activity between them. The signal is extracted statistically from the much larger strong (O(αs²α²)) Zjj production, whose modelling dominates the measurement uncertainty. A proving ground for VBF Higgs and vector-boson-scattering techniques and a probe of the WWZ coupling. Known at NLO QCD (matched to parton showers in the VBF approximation; complete O(αsα⁴) since 2022) and NLO EW; no NNLO QCD calculation exists.
watch:
  recids:
    - 1803608
    - 2068177
    - 630522
  queries:
    - t electroweak and (t "Z boson" or t "Z-boson" or t Zjj) and (t "two jets" or t dijets or t Zjj) and (collaboration:ATLAS or collaboration:CMS) and not t photon and not t "W boson" and tc article
    - (t "Zjj" or t "Z + 2 jet" or t "V + 2 jet" or t "electroweak Z") and (t "vector-boson fusion" or t "vector boson fusion" or t electroweak) and (t NLO or t NNLO or t "electroweak corrections" or t "parton shower") and not t Higgs and tc article
building_blocks:
  - row: NLO QCD
    cells:
      1L:
        status: done
        approximations:
          - 'inspire:630522: VBF approximation (vector-boson-fusion topologies only)'
          - 'inspire:2068177: complete O(αs α⁴), i.e. NLO QCD corrections to the EW mode with cross-talk between quark lines, t-, u- and s-channel contributions and EW–QCD interference'
        refs:
          - inspire:630522
          - inspire:2068177
        provenance:
          uid: '40765448'
          ref: inspire:630522
          locator: Abstract (NLO QCD corrections to the electroweak production of ℓνjj and ℓ⁺ℓ⁻jj within typical vector-boson-fusion cuts; corrections of about 10%, remaining scale uncertainties below 2%); inspire:2068177 Sec. 2 (first complete O(αs α⁴) computation beyond the VBF approximation)
          source: agent
          status: agent-draft
          date: '2026-11-12'
      code:
        status: done
        refs:
          - inspire:1122033
          - inspire:630522
          - inspire:2068177
        provenance:
          uid: 1f18b4c9
          ref: inspire:1122033
          locator: Abstract (electroweak Zjj production in the POWHEG framework, NLO QCD matched to parton showers, leptonic decays with photonic and non-resonant contributions); inspire:630522 Abstract (fully flexible NLO parton-level Monte Carlo); inspire:2068177 Sec. 4 (Sherpa+OpenLoops)
          source: agent
          status: agent-draft
          date: '2026-11-12'
  - row: NLO EW
    cells:
      1L:
        status: done
        refs:
          - inspire:2068177
        provenance:
          uid: c4bc3a2c
          ref: inspire:2068177
          locator: Sec. 2 (the O(α⁵) contribution, EW corrections to the EW mode, considered for the first time)
          source: agent
          status: agent-draft
          date: '2026-11-12'
      code:
        status: done
        approximations:
          - predictions given for VBF-dominated phase space of invisible-Higgs searches, as reweighting factors for Monte Carlo samples
        refs:
          - inspire:2068177
        provenance:
          uid: 6d309e01
          ref: inspire:2068177
          locator: Abstract (NLO QCD and EW predictions for V + 2 jet production, QCD and EW production modes and their interference) and Sec. 4 (all predictions obtained in the Sherpa+OpenLoops framework)
          source: agent
          status: agent-draft
          date: '2026-11-12'
  - row: NNLO QCD
    cells:
      code:
        status: missing
        refs:
