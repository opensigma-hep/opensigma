id: "proc:dy-nc"
name: "Neutral-current Drell–Yan (Z/γ* → ℓℓ)"
family: "fam:vector-bosons"
sector: SM
description: "Production of a charged-lepton pair through an s-channel photon or Z boson, pp/pp̄ → Z/γ* → ℓ+ℓ− + X (ℓ = e, μ). The standard candle of hadron colliders: luminosity and PDF benchmark, input to m_W, sin²θ_eff and αs determinations, and the first hadron-collider process known at N3LO QCD."
watch:
  recids: [1768911, 1753680, 2816048, 2818125, 2044884, 2112612, 1869719, 2861949]
  queries:
    - 't "Drell-Yan" and (collaboration:ATLAS or collaboration:CMS or collaboration:LHCb)'
    - 't "Z boson" and t "13 TeV" and (collaboration:ATLAS or collaboration:CMS) and (t "cross section" or t "transverse momentum" or t "angular")'
    - 't "Drell-Yan" and (t N3LO or t "third order" or t N3LL or t N4LL)'
    - 't "Drell-Yan" and t "mixed" and (t "QCD-electroweak" or t "QCD-EW" or t "strong-electroweak")'
building_blocks:
  - row: "NLO QCD"
    cells:
      1L:
        status: done
        amplitude: "amp:1L/qqbar-V"
        refs: ["inspire:140456"]
        provenance: {uid: 7932967f, ref: "inspire:140456", locator: "Abstract", source: agent, status: agent-draft, date: "2026-10-16"}
  - row: "NNLO QCD"
    cells:
      2L:
        status: done
        amplitude: "amp:2L/qqbar-V"
        refs: ["inspire:24603", "inspire:686721"]
        provenance: {uid: 528f4e52, ref: "inspire:686721", locator: "Abstract", source: agent, status: agent-draft, date: "2026-10-16"}
      RV:
        status: done
        refs: ["inspire:300492"]
        provenance: {uid: 3bdfa20f, ref: "inspire:300492", locator: "Abstract (complete O(αs²) correction, all qq̄, qg, gg, qq subprocesses)", source: agent, status: agent-draft, date: "2026-10-16"}
      RR:
        status: done
        refs: ["inspire:300492"]
        provenance: {uid: 0b0c4756, ref: "inspire:300492", locator: "Abstract (complete O(αs²) correction, all qq̄, qg, gg, qq subprocesses)", source: agent, status: agent-draft, date: "2026-10-16"}
      ir_scheme:
        status: done
        approximations: ["qT subtraction"]
        refs: ["inspire:815316"]
        provenance: {uid: 43fc8a35, ref: "inspire:815316", locator: "Abstract (fully exclusive NNLO with a recently proposed version of the subtraction formalism)", source: agent, status: agent-draft, date: "2026-10-16"}
      code:
        status: done
        refs: ["inspire:725573", "inspire:815316"]
        provenance: {uid: 24a7a80b, ref: "inspire:725573", locator: "Abstract (fully differential O(αs²) W/Z production with spin correlations, finite width, γ-Z interference, arbitrary lepton cuts; implemented in a numerical program)", source: agent, status: agent-draft, date: "2026-10-16"}
  - row: "N3LO QCD"
    cells:
      3L:
        status: done
        amplitude: "amp:3L/qqbar-V"
        refs: ["inspire:813829", "inspire:852545"]
        provenance: {uid: 0b429106, ref: "inspire:852545", locator: "Abstract", source: agent, status: agent-draft, date: "2026-10-16"}
      RV:
        status: done
        approximations: ["obtained from DY+jet at NNLO (O(αs³)) computed with NNLOJET"]
        amplitude: "amp:2L/qqbar-Vg"
        refs: ["inspire:2044884", "inspire:587998"]
        provenance: {uid: bfe42da9, ref: "inspire:2044884", locator: "Methodology, Eq. (1) and text below (DY+jet at NNLO, O(αs³), from NNLOJET)", source: agent, status: agent-draft, date: "2026-10-16"}
      RRR:
        status: done
        approximations: ["obtained from DY+jet at NNLO (O(αs³)) computed with NNLOJET"]
        refs: ["inspire:2044884"]
        provenance: {uid: 4be6c495, ref: "inspire:2044884", locator: "Methodology, Eq. (1) and text below (DY+jet at NNLO, O(αs³), from NNLOJET)", source: agent, status: agent-draft, date: "2026-10-16"}
      ir_scheme:
        status: done
        approximations: ["qT slicing (subtraction) extended to N3LO; slicing error quoted separately"]
        refs: ["inspire:1888733", "inspire:2044884"]
        provenance: {uid: '72049802', ref: "inspire:1888733", locator: "Abstract (qT-subtraction method extended to N3LO for qq̄-initiated Born processes)", source: agent, status: agent-draft, date: "2026-10-16"}
      code:
        status: done
        refs: ["inspire:2044884", "inspire:1850545", "inspire:2112612", "inspire:1973502"]
        provenance: {uid: bb505395, ref: "inspire:1973502", locator: "Abstract (complete inclusive N3LO NC Drell-Yan incl. γ and Z exchange); fiducial: inspire:2044884 (NNLOJET+RadISH), inspire:1850545 (DYTurbo), inspire:2112612 (CuTe-MCFM) abstracts", source: agent, status: agent-draft, date: "2026-10-16"}
  - row: "NLO EW"
    cells:
      1L:
        status: done
        amplitude: "amp:1L/qqbar-ll-ew"
        refs: ["inspire:562246", "inspire:836737"]
        provenance: {uid: 77daa8e4, ref: "inspire:562246", locator: "Abstract", source: agent, status: agent-draft, date: "2026-10-16"}
      code:
        status: done
        refs: ["inspire:1182519"]
        provenance: {uid: 39a7a572, ref: "inspire:1182519", locator: "Abstract (NNLO QCD combined with NLO EW in FEWZ, complex-mass scheme)", source: agent, status: agent-draft, date: "2026-10-16"}
  - row: "NNLO QCD×EW"
    cells:
      2L:
        status: done
        amplitude: "amp:2L/qqbar-ll-qcdew"
        refs: ["inspire:1836186", "inspire:2001831"]
        provenance: {uid: 58fb0afb, ref: "inspire:2001831", locator: "Abstract", source: agent, status: agent-draft, date: "2026-10-16"}
      RV:
        status: done
        refs: ["inspire:1869719"]
        provenance: {uid: 5a9ed8a7, ref: "inspire:1869719", locator: "Sec. II (tree-level and one-loop amplitudes for double-real, real-virtual contributions computed with OpenLoops and Recola)", source: agent, status: agent-draft, date: "2026-10-16"}
      RR:
        status: done
        refs: ["inspire:1869719"]
        provenance: {uid: 05e2c7f2, ref: "inspire:1869719", locator: "Sec. II (tree-level and one-loop amplitudes for double-real, real-virtual contributions computed with OpenLoops and Recola)", source: agent, status: agent-draft, date: "2026-10-16"}
      ir_scheme:
        status: done
        approximations: ["qT subtraction with massive final-state leptons (inspire:1869719)", "nested soft-collinear subtraction, massless leptons (inspire:2056855)"]
        refs: ["inspire:1869719", "inspire:2056855"]
        provenance: {uid: '51804342', ref: "inspire:1869719", locator: "Abstract (qT subtraction formalism valid with charged massive final-state particles)", source: agent, status: agent-draft, date: "2026-10-16"}
      code:
        status: done
        refs: ["inspire:1869719"]
        provenance: {uid: '5e196285', ref: "inspire:1869719", locator: "Sec. II (phase-space generation and integration within the Matrix framework)", source: agent, status: agent-draft, date: "2026-10-16"}
