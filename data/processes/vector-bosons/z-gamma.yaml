id: proc:z-gamma
name: Zγ production (pp → Zγ → ℓ⁺ℓ⁻γ, νν̄γ)
family: fam:vector-bosons
sector: SM
description: Production of a Z boson with an isolated prompt photon, measured in the ℓ⁺ℓ⁻γ and νν̄γ final states. There is no ZZγ or Zγγ vertex in the SM, so the photon comes from the quark line or, for ℓ⁺ℓ⁻γ, the decay leptons; the νν̄γ channel at high ET(γ) is the most sensitive probe of anomalous neutral triple gauge couplings and the main background to mono-photon searches. Known at NNLO QCD (with NNLO+PS and N3LL pT resummation) and NLO EW; NNLO corrections are 8–18% depending on the cuts.
watch:
  recids:
    - 1357993
    - 1255671
    - 1764342
  queries:
    - (t "Z gamma" or t "Zγ" or t "Z\gamma" or t "\ell^+\ell^-\gamma" or t "\nu\bar{\nu}\gamma" or t "Z boson and a photon") and (collaboration:ATLAS or collaboration:CMS) and (t "cross" or t production) and not t Higgs and not t resonance and not t "two jets" and tc article
    - (t "Z gamma" or t "Zγ" or t "Z\gamma") and (t NNLO or t N3LO or t "electroweak corrections" or t "two-loop" or t "three-loop" or t resummation or t "parton shower" or t "gluon fusion") and not t Higgs and tc article
