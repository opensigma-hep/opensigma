id: "proc:w-jet"
name: "W + jets (W → ℓν)"
family: "fam:vector-bosons"
sector: SM
description: "Production of a charged lepton and a neutrino through a W boson in association with one or more hard jets, pp/pp̄ → W(→ ℓν) + ≥ n jets + X, from qq̄′ → Wg, qg → Wq′ and crossings. The dominant source of events with one lepton, missing energy and jets: a key background to top, Higgs and new-physics searches, a benchmark for multi-leg merged generators and for the W pT and jet-multiplicity modelling used in the W-mass measurement. The ≥ 1-jet inclusive rate is known at NNLO QCD, and NLO EW corrections are available."
watch:
  recids: [1610623]
  queries:
    - '(t "W+jet" or t "W+jets" or t "W + jet" or t "W + jets" or t "W boson in association with jets" or t "W boson in association with a jet" or t "W boson plus jet" or t "W-boson plus jet" or t "W-boson production in association with a jet") and not t "tagging"'
  last_run: '2026-10-16'
building_blocks:
  - row: "NLO QCD"
    cells:
      1L:
        status: done
        refs: ["inspire:266596"]
        provenance: {uid: 604fbfce, ref: "inspire:266596", locator: "Abstract (full computation of dσ/dqT² for W, Z and virtual γ production to second order in QCD at high and moderate qT, i.e. W + jet at O(αs²))", source: agent, status: cross-checked, date: "2026-10-17"}
      RR:
        status: done
        refs: ["inspire:266596"]
        provenance: {uid: f784f29f, ref: "inspire:266596", locator: "Abstract (second-order QCD computation including the qg, gg and singlet qq̄ + qq channels, analytic constituent cross sections dσ/dqT² dy)", source: agent, status: cross-checked, date: "2026-10-17"}
      ir_scheme:
        status: done
        approximations: ["crossing of all-final-state NLO results with universal crossing functions"]
        refs: ["inspire:33945"]
        provenance: {uid: 5203ada0, ref: "inspire:33945", locator: "Abstract (NLO jet cross sections from a 'crossing' of all-final-state calculations; applied to jets in association with a vector boson including all decay correlations)", source: agent, status: cross-checked, date: "2026-10-17"}
      code:
        status: done
        refs: ["inspire:33945", "inspire:822565"]
        provenance: {uid: b363d3db, ref: "inspire:822565", locator: "Abstract (NLO QCD corrections to W + jet with leptonic W decays recalculated and implemented in a flexible Monte Carlo code, Tevatron and LHC; with inspire:33945 for the early NLO calculation including decay correlations)", source: agent, status: cross-checked, date: "2026-10-17"}
  - row: "NNLO QCD"
    cells:
      2L:
        status: done
        amplitude: "amp:2L/qqbar-Vg-eps2-axial"
        refs: ["inspire:587998", "inspire:2669874"]
        provenance: {uid: d7cb0b02, ref: "inspire:2669874", locator: "Abstract and Sec. 6.2–6.3 (two-loop QCD helicity amplitudes for V = Z, W±, γ* + jet with vector and axial-vector couplings, analytically continued to qq̄ → Vg and qg → Vq; Sec. 7: V gqq̄ cross-checked against earlier results up to weight 4); decay-region γ* → qq̄g amplitudes first in inspire:587998", source: agent, status: cross-checked, date: "2026-10-22"}
      RV:
        status: done
        refs: ["inspire:446755"]
        provenance: {uid: c9abf1bf, ref: "inspire:446755", locator: "Abstract (one-loop helicity amplitudes for e+e− → four partons, also those for W, Z or Drell-Yan production in association with two jets at hadron colliders)", source: agent, status: cross-checked, date: "2026-10-17"}
      ir_scheme:
        status: done
        approximations: ["N-jettiness subtraction"]
        refs: ["inspire:1358633"]
        provenance: {uid: 2096d3a7, ref: "inspire:1358633", locator: "Abstract (complete NNLO calculation of W + jet using a new subtraction method built on the N-jettiness event-shape variable, valid for an arbitrary number of jets)", source: agent, status: cross-checked, date: "2026-10-17"}
      code:
        status: done
        approximations: ["fixed-order parton level, with fiducial cuts and leptonic W decay; inclusive and exclusive one-jet bins, 8 and 13 TeV"]
        refs: ["inspire:1358633", "inspire:1423065"]
        provenance: {uid: 55b56713, ref: "inspire:1423065", locator: "Abstract (fiducial cross sections and differential distributions for W + jet at NNLO for 8 and 13 TeV, inclusive and exclusive one-jet bins, general and boosted selections)", source: agent, status: cross-checked, date: "2026-10-17"}
  - row: "NLO EW"
    cells:
      1L:
        status: done
        refs: ["inspire:822565"]
        provenance: {uid: 7669281f, ref: "inspire:822565", locator: "Abstract (first NLO EW calculation for W + jet hadroproduction including leptonic W decays, complex-mass scheme, all off-shell effects; Tevatron and LHC)", source: agent, status: cross-checked, date: "2026-10-17"}
      code:
        status: done
        refs: ["inspire:1406942"]
        provenance: {uid: a8213231, ref: "inspire:1406942", locator: "Abstract (automated NLO QCD+EW for off-shell V + up to two jets at 13 TeV with OpenLoops, Munich and Sherpa, including multijet merging)", source: agent, status: cross-checked, date: "2026-10-17"}
  - row: "NNLO QCD×EW"
    cells:
      code:
        status: partial
        approximations: ["parton-level combination of NNLO QCD and NLO EW with two-loop Sudakov logarithms, for use via reweighting of Monte Carlo samples"]
        refs: ["inspire:1599401"]
        provenance: {uid: 6c37dfcd, ref: "inspire:1599401", locator: "Abstract (combination of state-of-the-art calculations for all V + jets processes: NNLO QCD and NLO EW corrections supplemented by Sudakov logarithms at two loops, parton level)", source: agent, status: cross-checked, date: "2026-10-17"}
  - row: "N3LO QCD"
    cells:
      2L:
        status: done
        approximations: ["two-loop amplitudes to O(ε²) and one-loop to O(ε⁴) in massless QCD, as needed by the three-loop finite remainder"]
        amplitude: "amp:2L/qqbar-Vg-eps2-axial"
        refs: ["inspire:2669874"]
        provenance: {uid: 3baacff2, ref: "inspire:2669874", locator: "Abstract and Sec. 7 (two-loop QCD amplitudes for V = Z, W±, γ* + jet, qq̄ → Vg, qg → Vq, gg → Vg incl. axial-vector singlet; renormalised helicity coefficients to O(ε⁴) at one loop and O(ε²) at two loops in the ancillary files, 'an essential ingredient for the N3LO V+jet amplitudes')", source: agent, status: cross-checked, date: "2026-10-22"}
      3L:
        status: partial
        approximations: ["planar (leading-colour) contributions only"]
        amplitude: "amp:3L/qqbar-Vg-planar"
        refs: ["inspire:2683225"]
        provenance: {uid: 40fefa13, ref: "inspire:2683225", locator: "Abstract (planar three-loop QCD helicity amplitudes for V + q q̄ + g with V = Z, W±, γ*, relevant to vector-boson-plus-jet production)", source: agent, status: cross-checked, date: "2026-10-18"}
channels:
  - id: "chan:w-jet/lhc-13"
    collider: "col:lhc-13"
    initial_state: "pp"
    coverage: partial
    last_reviewed: "2026-10-22"
    headline: {observable: "obs:w-jet/lhc-13/sigma-ge1j", region: "Fiducial σ(W(→ μν) + ≥ 1 jet), jets anti-kt R = 0.4, pT > 30 GeV, |y| < 2.4; pT(μ) > 25 GeV, |η(μ)| < 2.4, mT > 50 GeV"}
    measurements:
      - id: "meas:w-jet/lhc-13/cms-2017-ge1j"
        experiment: "CMS"
        dataset: "13 TeV, 2.2 fb⁻¹ (2015), muon channel"
        ref: "inspire:1610623"
        hepdata: "hepdata:ins1610623/Table 2"
      - id: "meas:w-jet/lhc-13/atlas-2025-highpt"
        experiment: "ATLAS"
        dataset: "13 TeV, 140 fb⁻¹ (2015–2018), e and μ channels combined"
        ref: "inspire:2860146"
        hepdata: "hepdata:ins2860146/Figure 04"
    observables:
      - id: "obs:w-jet/lhc-13/sigma-ge1j"
        name: "Fiducial σ(W + ≥ 1 jet)"
        kind: fiducial
        variable: "σ(W(→ μν) + ≥ 1 jet), stable-particle level"
        results:
          - measurement: "meas:w-jet/lhc-13/cms-2017-ge1j"
            total: {value_pct: 2.7, provenance: {uid: 0bceba2d, ref: "hepdata:ins1610623/Table 2", locator: "Table 2, quadrature sum of all errors (bin 1, N_jets ≥ 1: 1072 pb)", source: hepdata, status: machine-verified, date: "2026-10-17"}}
            uncertainties: []
        predictions:
          - label: "NNLO QCD W + ≥ 1 jet (N-jettiness subtraction), NNPDF3.0 NNLO"
            accuracy:
              qcd: NNLO
              approximations: ["fixed order O(αs³): NNLO for the ≥ 1-jet rate", "non-perturbative correction from LO MG5_aMC + Pythia 8 with and without MPI and hadronisation, mostly 0.93–1.10", "muon final-state radiation effect estimated below 1%"]
            codes: ["N-jettiness NNLO W + jet"]
            uses_amplitudes: ["amp:2L/qqbar-Vg"]
            compared_to: ["meas:w-jet/lhc-13/cms-2017-ge1j"]
            refs: ["inspire:1358633", "inspire:1423065", "inspire:1610623"]
            provenance: {uid: c6cd239b, ref: "inspire:1610623", locator: "Sec. 3 (Njetti NNLO for W + 1-jet, refs [9, 31], compared for events with one or more jets; NNPDF 3.0 NNLO; non-perturbative correction 0.93–1.10; FSR < 1%)", source: agent, status: cross-checked, date: "2026-10-17"}
            headline: true
          - label: "MG5_aMC@NLO + Pythia 8, FxFx merging (NLO up to 2 jets, LO for 3 and 4)"
            accuracy:
              qcd: NLO
              shower_matched: true
              approximations: ["NLO for W + 0, 1, 2 jets and LO for 3, 4 jets, FxFx merging scale 30 GeV", "NNPDF 3.0 NLO for the matrix elements"]
            codes: ["MadGraph5_aMC@NLO 2.2.2", "Pythia 8"]
            compared_to: ["meas:w-jet/lhc-13/cms-2017-ge1j"]
            refs: ["inspire:1610623"]
            provenance: {uid: b4538404, ref: "inspire:1610623", locator: "Sec. 3, description of the NLO MG5_aMC FxFx prediction (NLO accuracy for N = 0, 1, 2 and LO for N = 3, 4)", source: agent, status: cross-checked, date: "2026-10-17"}
      - id: "obs:w-jet/lhc-13/sigma-highpt"
        name: "Fiducial σ(W + jets), leading jet pT > 500 GeV"
        kind: fiducial
        variable: "σ(W(→ ℓν) + ≥ 1 jet) with pT(j1) > 500 GeV (ATLAS inclusive region), particle level: exactly one dressed lepton pT > 30 GeV, |η| < 2.5; anti-kt R = 0.4 jets pT > 30 GeV, |y| < 2.5, ΔR(ℓ, jet) > 0.4; inclusive in jet flavour"
        results:
          - measurement: "meas:w-jet/lhc-13/atlas-2025-highpt"
            total: {value_pct: 3.3, provenance: {uid: fb0208e0, ref: "inspire:2860146", locator: "Table 4, 'Total uncertainty', Inclusive column (σfid = 778 ± 3 (stat.) ± 25 (syst.+stat.) fb, Table 5)", source: agent, status: cross-checked, date: "2026-10-22"}}
            uncertainties:
              - {category: background, specific: "Background modelling", size: {range: [2.0, 2.0], unit: "%", asymmetric: false}, provenance: {uid: 71248fa6, ref: "inspire:2860146", locator: "Table 4, 'Background modelling', Inclusive column", source: agent, status: cross-checked, date: "2026-10-22"}}
              - {category: energy_scale, specific: "JES/JER", size: {range: [1.3, 1.3], unit: "%", asymmetric: false}, provenance: {uid: 3c919a4f, ref: "inspire:2860146", locator: "Table 4, 'JES/JER', Inclusive column", source: agent, status: cross-checked, date: "2026-10-22"}}
              - {category: efficiency, specific: "b-tagging", size: {range: [1.2, 1.2], unit: "%", asymmetric: false}, provenance: {uid: 8ede6a7f, ref: "inspire:2860146", locator: "Table 4, 'b-tagging', Inclusive column", source: agent, status: cross-checked, date: "2026-10-22"}}
              - {category: efficiency, specific: "Lepton", size: {range: [0.8, 0.8], unit: "%", asymmetric: false}, provenance: {uid: 2841793c, ref: "inspire:2860146", locator: "Table 4, 'Lepton', Inclusive column", source: agent, status: cross-checked, date: "2026-10-22"}}
              - {category: lumi, specific: "Luminosity", size: {range: [0.8, 0.8], unit: "%", asymmetric: false}, provenance: {uid: 9963f7a8, ref: "inspire:2860146", locator: "Table 4, 'Luminosity', Inclusive column", source: agent, status: cross-checked, date: "2026-10-22"}}
              - {category: stat, specific: "Data statistical", size: {range: [0.4, 0.4], unit: "%", asymmetric: false}, provenance: {uid: f9f53d56, ref: "inspire:2860146", locator: "Table 4, 'Data statistical', Inclusive column", source: agent, status: cross-checked, date: "2026-10-22"}}
              - {category: unfolding_model, specific: "Unfolding", size: {range: [0.34, 0.34], unit: "%", asymmetric: false}, provenance: {uid: 4bf4d138, ref: "inspire:2860146", locator: "Table 4, 'Unfolding', Inclusive column", source: agent, status: cross-checked, date: "2026-10-22"}}
              - {category: pileup, specific: "Pile-up", size: {range: [0.19, 0.19], unit: "%", asymmetric: false}, provenance: {uid: 5b56588b, ref: "inspire:2860146", locator: "Table 4, 'Pile-up', Inclusive column", source: agent, status: cross-checked, date: "2026-10-22"}}
        predictions:
          - label: "NNLO QCD W + 1 jet (MCFM, N-jettiness), NNPDF3.0nnlo"
            accuracy:
              qcd: NNLO
              approximations: ["fixed order O(αs³): NNLO for the W + ≥ 1 jet rate, N-jettiness slicing with τcut = 10⁻⁴", "μ = (m²ℓν + Σ pT²(jets))^½, scales varied coherently by a factor two; no PDF uncertainty", "non-perturbative effects negligible; an EW-corrected variant (MCFM QCD+EW, 680 fb) applies the Sherpa EWvirt/QCD ratio bin by bin"]
            codes: ["MCFM"]
            uncertainties:
              - category: MHOU
                specific: "scale variation, inclusive region (σ = 765 fb)"
                method: "coherent variation of μR and μF by a factor of two, avoiding asymmetric variations"
                size: {range: [3.4, 3.4], unit: "%", asymmetric: false}
                provenance: {uid: b5b69d9f, ref: "inspire:2860146", locator: "Table 5, Inclusive block, MCFM: 765 ± 26 (scale) fb; method Sec. 9", source: agent, status: cross-checked, date: "2026-10-22"}
            compared_to: ["meas:w-jet/lhc-13/atlas-2025-highpt"]
            refs: ["inspire:1358633", "inspire:2860146"]
            provenance: {uid: 1cd213b0, ref: "inspire:2860146", locator: "Sec. 9 (MCFM W + 1-jet NNLO, refs [23, 98, 99], N-jettiness τcut, scale and PDF choices, EW extrapolation from Sherpa) and Table 5", source: agent, status: agent-draft, date: "2026-10-22"}
            headline: true
          - label: "Sherpa 2.2.11 MEPS@NLO with NLO virtual EW corrections (multiplicative)"
            accuracy:
              qcd: NLO
              ew: NLO
              shower_matched: true
              approximations: ["NLO QCD and NLO EWvirt matrix elements for up to two jets, LO up to five, MEPS@NLO", "NLO EW: virtual corrections only, multiplicative scheme; reduce the inclusive σ by 10–12%", "NNPDF3.0nnlo"]
            codes: ["Sherpa 2.2.11", "Comix", "OpenLoops"]
            uncertainties:
              - category: EW_missing
                specific: "envelope of additive, multiplicative and exponentiated EW combination schemes, inclusive region"
                size: {range: [4.4, 4.4], unit: "%", asymmetric: false}
                provenance: {uid: c9f78db2, ref: "inspire:2860146", locator: "Table 5, Inclusive block, Sherpa 2.2.11 QCD+EW: 733 ± 32 (EW virt) fb", source: agent, status: cross-checked, date: "2026-10-22"}
              - category: MHOU
                specific: "QCD-only Sherpa 2.2.11 scale variation, inclusive region (σ = 823 fb)"
                method: "7-point variation of μR and μF in matrix element and parton shower by factors 0.5 and 2"
                size: {range: [25.5, 43.7], unit: "%", asymmetric: true, regions: [{where: "inclusive region, σ = 823 +360/−210 fb", value: "+43.7/−25.5"}]}
                provenance: {uid: 8c526dcf, ref: "inspire:2860146", locator: "Table 5, Inclusive block, Sherpa 2.2.11: +360 −210 (scale) fb; method Sec. 3", source: agent, status: cross-checked, date: "2026-10-22"}
            compared_to: ["meas:w-jet/lhc-13/atlas-2025-highpt"]
            refs: ["inspire:2860146"]
            provenance: {uid: 0e951b40, ref: "inspire:2860146", locator: "Sec. 3 (Sherpa 2.2.11 configuration and EWvirt schemes); Sec. 9 and Table 5", source: agent, status: cross-checked, date: "2026-10-22"}
          - label: "MG5_aMC@NLO + Pythia 8, FxFx (NLO up to 3 jets)"
            accuracy:
              qcd: NLO
              shower_matched: true
              approximations: ["NLO matrix elements for up to three additional jets, FxFx merging", "NNPDF3.1luxQED, Pythia 8.240 A14 tune"]
            codes: ["MadGraph5_aMC@NLO 2.6.5", "Pythia 8.240"]
            uncertainties:
              - category: MHOU
                specific: "scale variation, inclusive region (σ = 851 fb)"
                method: "variations of the renormalisation and factorisation scales"
                size: {range: [10.6, 15.3], unit: "%", asymmetric: true, regions: [{where: "inclusive region, σ = 851 +90/−130 fb", value: "+10.6/−15.3"}]}
                provenance: {uid: 20624f47, ref: "inspire:2860146", locator: "Table 5, Inclusive block, MadGraph5_aMC@NLO+Pythia8: +90 −130 (scale) fb", source: agent, status: cross-checked, date: "2026-10-22"}
              - category: PDF
                specific: "PDF eigenvector variations, inclusive region"
                pdf_set: "NNPDF3.1luxQED"
                size: {range: [0.7, 0.7], unit: "%", asymmetric: false}
                provenance: {uid: c584a18a, ref: "inspire:2860146", locator: "Table 5, Inclusive block, MadGraph5_aMC@NLO+Pythia8: ±6 (PDF) fb on 851 fb", source: agent, status: cross-checked, date: "2026-10-22"}
            compared_to: ["meas:w-jet/lhc-13/atlas-2025-highpt"]
            refs: ["inspire:2860146"]
            provenance: {uid: b74e5543, ref: "inspire:2860146", locator: "Sec. 3 (MG5_aMC@NLO FxFx sample) and Table 5", source: agent, status: cross-checked, date: "2026-10-22"}
  - id: "chan:w-jet/tevatron-1960"
    collider: "col:tevatron-1960"
    initial_state: "pp̄"
    coverage: partial
    last_reviewed: "2026-10-16"
    headline: {observable: "obs:w-jet/tevatron-1960/sigma-ge1j", region: "σ(W(→ eν) + ≥ 1 jet; ET(jet) > 25 GeV), jetclu cone R = 0.4, |η(jet)| < 2.0; ET(e) > 20 GeV, |η(e)| < 1.1, ET(ν) > 30 GeV, mT > 20 GeV"}
