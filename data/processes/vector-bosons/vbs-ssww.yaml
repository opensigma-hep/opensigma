            codes: ["Sherpa", "Powheg Box"]
            total: {value_pct: 16.2, provenance: {uid: 7f525ddc, ref: "inspire:2729396", locator: "Table 6, EW σ_fid: Sherpa ⊗ NLO EW 2.10 ± 0.03 (PDF) +0.34 −0.23 (scale) fb; larger scale side as percentage of the central value", source: agent, status: cross-checked, date: "2026-10-17"}}
