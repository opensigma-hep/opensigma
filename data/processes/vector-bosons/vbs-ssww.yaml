            codes: ["MadGraph5_aMC@NLO"]
            total: {value_pct: 14.0, provenance: {uid: 795ee7ce, ref: "hepdata:ins1794169/Table 5", locator: "Table 5, column 3, quadrature sum of all errors (bin 1)", source: hepdata, status: machine-verified, date: "2026-10-17"}}
            compared_to: ["meas:vbs-ssww/lhc-13/cms-2020-fid-ew"]
            refs: ["inspire:1794169", "inspire:1496632", "inspire:1613898"]
            provenance: {uid: 9bf216f3, ref: "inspire:1794169", locator: "Sec. 3 (simulation, NLO QCD and EW corrections applied to the LO cross sections, refs [35, 36]) and Table 5: 3.31 ± 0.47 fb, uncertainty includes MC statistics, PDF and scale", source: agent, status: cross-checked, date: "2026-10-17"}
