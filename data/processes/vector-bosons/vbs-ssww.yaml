id: "proc:vbs-ssww"
name: "Same-sign W±W± + 2 jets (EW production, VBS)"
family: "fam:vector-bosons"
sector: SM
description: "Electroweak production of a same-sign W±W± pair in association with two forward jets, pp → W±W±jj → ℓ±νℓ±ν jj at O(α⁶), the cleanest vector-boson-scattering channel: no gluon-initiated or s-channel diboson topology at leading order, a small QCD-induced irreducible background at O(αs²α⁴) and a small interference at O(αsα⁵). Probes quartic gauge couplings and the unitarisation of longitudinal WW scattering. NLO QCD and NLO EW corrections (the latter large and negative, about −15%) are known for the full off-shell process."
watch:
  recids: [2692517, 2799239]
  queries:
    - 't "same-sign" and t "W" and (t "pair" or t "pairs" or t "boson scattering") and (collaboration:ATLAS or collaboration:CMS)'
    - '(t "W+W+" or t "like-sign" or t "same-sign") and t "W" and (t NLO or t NNLO or t "electroweak corrections" or t "parton shower") and (t "scattering" or t "jj" or t "jets")'
  last_run: '2026-10-16'
building_blocks:
  - row: "NLO QCD"
    cells:
      1L:
        status: done
        approximations: ["EW-induced W+W+jj in the weak-boson-fusion approximation", "QCD-induced W+W+jj computed separately"]
        refs: ["inspire:824865", "inspire:863789"]
        provenance: {uid: 896fbb73, ref: "inspire:824865", locator: "Abstract (NLO QCD for e+ νe μ+ νμ jj via weak boson fusion); second ref inspire:863789 abstract (NLO QCD to the QCD-mediated part of pp → W+W+jj)", source: agent, status: cross-checked, date: "2026-10-17"}
      code:
        status: done
        refs: ["inspire:922009"]
        provenance: {uid: f2589420, ref: "inspire:922009", locator: "Abstract (NLO QCD W+W+jj via vector-boson fusion matched to parton showers in the POWHEGBOX, complementing the QCD-induced code)", source: agent, status: cross-checked, date: "2026-10-17"}
  - row: "NLO EW"
    cells:
      1L:
        status: done
        approximations: ["EW-induced process pp → μ+ νμ e+ νe jj"]
        refs: ["inspire:1496632"]
        provenance: {uid: b3490f73, ref: "inspire:1496632", locator: "Abstract (first full NLO EW corrections to off-shell vector-boson scattering, complete matrix elements, fully differential)", source: agent, status: cross-checked, date: "2026-10-17"}
      code:
        status: done
        refs: ["inspire:1613898", "inspire:2692517"]
        provenance: {uid: ba4bae2e, ref: "inspire:1613898", locator: "Abstract (full NLO QCD and EW corrections to VBS and its irreducible background, complete amplitudes at all orders); second ref inspire:2692517 abstract (independent full NLO calculation in Bonsay, whole tower of NLO contributions)", source: agent, status: cross-checked, date: "2026-10-17"}
channels:
  - id: "chan:vbs-ssww/lhc-13"
    collider: "col:lhc-13"
    initial_state: "pp"
    coverage: partial
    last_reviewed: "2026-10-22"
    headline: {observable: "obs:vbs-ssww/lhc-13/sigma-fid-ew", region: "Fiducial EW W±W±jj → ℓ±νℓ±ν jj (two same-sign e/μ, ≥ 2 jets, mjj > 500 GeV, VBS cuts as in each experiment)"}
    measurements:
      - id: "meas:vbs-ssww/lhc-13/atlas-2024-fid-ew"
        experiment: "ATLAS"
        dataset: "13 TeV, 139 fb⁻¹ (2015–2018)"
        ref: "inspire:2729396"
      - id: "meas:vbs-ssww/lhc-13/cms-2020-fid-ew"
        experiment: "CMS"
        dataset: "13 TeV, 137 fb⁻¹ (2016–2018)"
        ref: "inspire:1794169"
        hepdata: "hepdata:ins1794169/Table 5"
      - id: "meas:vbs-ssww/lhc-13/atlas-2025-pol"
        experiment: "ATLAS"
        dataset: "13 TeV, 140 fb⁻¹ (2015–2018), polarised EW W±W±jj"
        ref: "inspire:2900453"
    observables:
      - id: "obs:vbs-ssww/lhc-13/sigma-fid-ew"
        name: "Fiducial σ(EW W±W±jj)"
        kind: fiducial
        variable: "σ_fid, EW-induced W±W±jj (O(α⁶), interference with QCD-induced counted as signal in CMS); ATLAS fiducial region: pT(ℓ) > 27 GeV, mjj > 500 GeV, Δyjj > 2; CMS: pT(ℓ) > 20 GeV, mjj > 500 GeV, |Δηjj| > 2.5"
