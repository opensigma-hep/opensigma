id: "proc:dy-cc"
name: "Charged-current Drell–Yan (W → ℓν)"
family: "fam:vector-bosons"
sector: SM
description: "Production of a charged lepton and a neutrino through an s-channel W boson, pp/pp̄ → W± → ℓ±ν + X (ℓ = e, μ). Largest single-boson rate at hadron colliders: benchmark for quark-flavour and charge-asymmetry PDF constraints, and the process behind the W-mass and W-width measurements. Known at N3LO QCD."
watch:
  recids: []
  queries:
    - (t "W boson" or t "W-boson" or t "W bosons" or t "W and Z" or t "W±") and (collaboration:ATLAS or collaboration:CMS or collaboration:LHCb) and (t "cross section" or t "cross sections" or t "transverse momentum" or t "charge asymmetry" or t "differential") and not t Higgs and not t top and not t "mass" and not t jets and not t "same-sign" and not t "pair" and not t WWZ and not t charm and not t search and tc article
    - (t "W" and t "Drell-Yan" and (t N3LO or t "third order" or t N3LL or t N4LL)) or (t "W" and t "mixed" and (t "QCD-electroweak" or t "QCD-EW" or t "strong-electroweak") and not t "pair")
  last_run: '2026-10-16'
building_blocks:
  - row: "NLO QCD"
    cells:
      1L:
        status: done
        amplitude: "amp:1L/qqbar-V"
        refs: ["inspire:140456"]
        provenance: {uid: 20db96ab, ref: "inspire:140456", locator: "Abstract (radiative corrections to the lowest-order qq̄ annihilation diagram up to O(αs); same qq̄ → V* form factor as neutral current)", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "NNLO QCD"
    cells:
      2L:
        status: done
        amplitude: "amp:2L/qqbar-V"
        refs: ["inspire:686721"]
        provenance: {uid: b7607803, ref: "inspire:686721", locator: "Abstract (two-loop massless quark form factor γ*→qq̄; same vector-current form factor for W)", source: agent, status: cross-checked, date: "2026-10-16"}
      RV:
        status: done
        refs: ["inspire:300492"]
        provenance: {uid: 3558d968, ref: "inspire:300492", locator: "Abstract (complete O(αs²) correction to the Drell-Yan K-factor, all qq̄, qg, gg and qq subprocesses)", source: agent, status: cross-checked, date: "2026-10-16"}
      RR:
        status: done
        refs: ["inspire:300492"]
        provenance: {uid: 7acc9a5a, ref: "inspire:300492", locator: "Abstract (complete O(αs²) correction to the Drell-Yan K-factor, all qq̄, qg, gg and qq subprocesses)", source: agent, status: cross-checked, date: "2026-10-16"}
      ir_scheme:
        status: done
        approximations: ["qT subtraction"]
        refs: ["inspire:815316"]
        provenance: {uid: 99a1e12c, ref: "inspire:815316", locator: "Abstract (fully exclusive NNLO calculation for W and Z production with a recently proposed version of the subtraction formalism)", source: agent, status: cross-checked, date: "2026-10-16"}
      code:
        status: done
        refs: ["inspire:712998", "inspire:815316"]
        provenance: {uid: d1b02679, ref: "inspire:712998", locator: "Abstract (O(αs²) corrections to the fully differential pp → W X → ℓν X cross section, retaining spin correlations)", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "N3LO QCD"
    cells:
      3L:
        status: done
        amplitude: "amp:3L/qqbar-V"
        refs: ["inspire:1808912"]
        provenance: {uid: aebbff98, ref: "inspire:1808912", locator: "Abstract (partonic coefficient functions of a virtual W± boson at N3LO)", source: agent, status: cross-checked, date: "2026-10-16"}
      code:
        status: partial
        approximations: ["fiducial N3LO via qT-resummation matched to W+jet at NNLO, shown for 5.02 TeV; public release announced as upcoming (CuTe-MCFM)", "N3LO rapidity and transverse-mass distributions: inspire:2086427"]
        refs: ["inspire:2691867", "inspire:2086427"]
        provenance: {uid: 0a60c737, ref: "inspire:2691867", locator: "Abstract (W production at the level of αs³ at fixed order and including transverse-momentum resummation; code to be released)", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "NLO EW"
    cells:
      1L:
        status: done
        refs: ["inspire:562503"]
        provenance: {uid: 96e96f29, ref: "inspire:562503", locator: "Abstract (complete set of EW O(α) corrections to Drell-Yan-like W production)", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "NNLO QCD×EW"
    cells:
      2L:
        status: partial
        approximations: ["on-shell W, leptonic decay at leading order (inspire:1818463)", "pole approximation for the finite two-loop part, reweighted (inspire:1848458)"]
        refs: ["inspire:1818463", "inspire:1848458"]
        provenance: {uid: 0dbed058, ref: "inspire:1848458", locator: "Abstract (all real and virtual contributions without approximation except the finite part of the two-loop virtual correction, in pole approximation)", source: agent, status: cross-checked, date: "2026-10-16"}
      ir_scheme:
        status: done
        approximations: ["qT subtraction (inspire:1848458)", "nested soft-collinear subtraction, on-shell W (inspire:1818463)"]
        refs: ["inspire:1848458", "inspire:1818463"]
        provenance: {uid: 8ee84a1a, ref: "inspire:1848458", locator: "Abstract (qT-subtraction formulation derived from the NNLO QCD calculation for heavy-quark production)", source: agent, status: cross-checked, date: "2026-10-16"}
