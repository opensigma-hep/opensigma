id: "proc:dis-nc"
name: "Neutral-current inclusive DIS (e±p → e± X)"
family: "fam:dis"
sector: SM
description: "Inclusive neutral-current deep inelastic scattering of electrons or positrons on protons through γ/Z exchange, e±p → e± X. The reduced cross section is expressed through the structure functions F2, FL and xF3; the HERA measurements span six orders of magnitude in Q² and x and are the backbone of proton-PDF fits (HERAPDF2.0) and of αs determinations from scaling violations. Massless QCD coefficient functions are known to third order for F2 and FL."
watch:
  recids: []
  queries:
    - 'refersto:recid:1377206 and (t "deep inelastic" or t "deep-inelastic") and (t "structure function" or t "neutral current" or t inclusive or t benchmark)'
    - 'refersto:recid:681335 and (t "deep inelastic" or t "deep-inelastic") and (t "structure function" or t N3LO or t "high orders" or t benchmark or t module)'
    - 'refersto:recid:1377206 and t "electron-ion collider" and (t inclusive or t "electron-proton")'
    - 't "deep inelastic" and t "neutral current" and t "electroweak" and t "radiative corrections"'
  last_run: '2026-10-16'
building_blocks:
  - row: "NLO QCD"
    cells:
      code:
        status: done
        refs: ["inspire:130340", "inspire:1377206"]
        provenance: {uid: 73e2ae6c, ref: "inspire:130340", locator: "Abstract (full order-g² corrections to the coefficient functions of deep-inelastic structure functions, electroproduction and neutrino reactions); public implementation: QCDNUM used by HERAPDF2.0 (inspire:1377206, Sec. 6.1)", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "NNLO QCD"
    cells:
      code:
        status: done
        refs: ["inspire:511611", "inspire:318997", "inspire:1377206"]
        provenance: {uid: b315ff8c, ref: "inspire:511611", locator: "Abstract (2-loop coefficient functions of F2, F3 and FL, in agreement with Zijlstra–van Neerven); gluonic part inspire:318997 Abstract; HERAPDF2.0 NNLO fit with QCDNUM: inspire:1377206 Sec. 6.1", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "N3LO QCD"
    cells:
      code:
        status: partial
        approximations: ["massless QCD, photon exchange: F2 and FL known at three loops", "no N3LO coefficient function for the γZ-interference structure function xF3 in the cited references"]
        refs: ["inspire:681335", "inspire:663841"]
        provenance: {uid: 739341d0, ref: "inspire:681335", locator: "Abstract (full three-loop coefficient functions for F2 and FL in massless perturbative QCD, photon exchange); FL also inspire:663841 Abstract", source: agent, status: cross-checked, date: "2026-10-16"}
  - row: "NLO EW"
    cells:
      code:
        status: done
        approximations: ["single-photon bremsstrahlung included without cuts (inspire:269712)"]
        refs: ["inspire:269712", "inspire:296225"]
        provenance: {uid: c70af036, ref: "inspire:296225", locator: "Abstract (HERACLES: single-photon emission from the lepton line, self-energy corrections and the complete set of one-loop weak corrections for NC and CC ep scattering at HERA); analytic NC results inspire:269712 Abstract", source: agent, status: cross-checked, date: "2026-10-16"}
channels:
  - id: "chan:dis-nc/hera"
    collider: "col:hera"
    initial_state: "e±p"
    coverage: partial
    last_reviewed: "2026-10-22"
    headline: {observable: "obs:dis-nc/hera/sigma-r-ep", region: "Q² = 200 GeV², x = 0.0032, e+p at √s = 318 GeV"}
    measurements:
      - id: "meas:dis-nc/hera/hera-2015-comb"
        experiment: "combination"
        dataset: "H1+ZEUS combination of all inclusive HERA I+II NC and CC data (≈1 fb⁻¹, unpolarised), e+p at √s = 318 GeV (Ep = 920 GeV)"
        ref: "inspire:1377206"
        hepdata: "hepdata:ins1377206/Table 1"
    observables:
      - id: "obs:dis-nc/hera/sigma-r-ep"
        name: "Reduced NC cross section σr,NC⁺(x, Q²), e+p, √s = 318 GeV"
        kind: differential
        variable: "x, Q²"
        results:
          - measurement: "meas:dis-nc/hera/hera-2015-comb"
            total: {value_pct: 1.7, provenance: {uid: 330ba8f6, ref: "hepdata:ins1377206/Table 1", locator: "Table 1, quadrature sum of all errors (bin 337); Q² = 200 GeV², x = 0.0032, √s = 318 GeV (e+p): σr = 1.248", source: hepdata, status: machine-verified, date: "2026-10-16"}}
            uncertainties:
              - category: stat
                specific: "stat"
                size: {range: [0.42, 69.0], asymmetric: false}
                full_table: "hepdata:ins1377206/Table 1"
                provenance: {uid: 886d0d46, ref: "hepdata:ins1377206/Table 1", locator: "Table 1, error 'stat'", source: hepdata, status: machine-verified, date: "2026-10-16"}
              - category: syst_combined
                specific: "sys,uncor"
                size: {range: [0.21, 14.0], asymmetric: false}
                full_table: "hepdata:ins1377206/Table 1"
                provenance: {uid: a702cead, ref: "hepdata:ins1377206/Table 1", locator: "Table 1, error 'sys,uncor'", source: hepdata, status: machine-verified, date: "2026-10-16"}
              - category: syst_combined
                specific: "sys,cor"
                size: {range: [0.72, 7.4], asymmetric: false}
                full_table: "hepdata:ins1377206/Table 1"
                provenance: {uid: 2c3e7e08, ref: "hepdata:ins1377206/Table 1", locator: "Table 1, error 'sys,cor'", source: hepdata, status: machine-verified, date: "2026-10-16"}
              - category: other
                specific: "sys,rel"
                size: {range: [0.0, 3.6], asymmetric: false}
                full_table: "hepdata:ins1377206/Table 1"
                provenance: {uid: 6237943b, ref: "hepdata:ins1377206/Table 1", locator: "Table 1, error 'sys,rel'", source: hepdata, status: machine-verified, date: "2026-10-16"}
              - category: background
                specific: "sys,$\\gamma p$"
                size: {range: [0.0, 7.5], asymmetric: false}
                full_table: "hepdata:ins1377206/Table 1"
                provenance: {uid: ea1ddf9d, ref: "hepdata:ins1377206/Table 1", locator: "Table 1, error 'sys,$\\gamma p$'", source: hepdata, status: machine-verified, date: "2026-10-16"}
              - category: energy_scale
                specific: "sys,had"
                size: {range: [0.0, 2.9], asymmetric: false}
                full_table: "hepdata:ins1377206/Table 1"
                provenance: {uid: ed6b076c, ref: "hepdata:ins1377206/Table 1", locator: "Table 1, error 'sys,had'", source: hepdata, status: machine-verified, date: "2026-10-16"}
              - category: other
                specific: "sys,1"
                size: {range: [0.0, 5.8], asymmetric: false}
                full_table: "hepdata:ins1377206/Table 1"
                provenance: {uid: 9459bed1, ref: "hepdata:ins1377206/Table 1", locator: "Table 1, error 'sys,1'", source: hepdata, status: machine-verified, date: "2026-10-16"}
              - category: other
                specific: "sys,2"
                size: {range: [0.0, 1.7], asymmetric: false}
                full_table: "hepdata:ins1377206/Table 1"
                provenance: {uid: c43052cb, ref: "hepdata:ins1377206/Table 1", locator: "Table 1, error 'sys,2'", source: hepdata, status: machine-verified, date: "2026-10-16"}
              - category: other
                specific: "sys,3"
                size: {range: [0.0, 2.0], asymmetric: false}
                full_table: "hepdata:ins1377206/Table 1"
                provenance: {uid: '39678100', ref: "hepdata:ins1377206/Table 1", locator: "Table 1, error 'sys,3'", source: hepdata, status: machine-verified, date: "2026-10-16"}
              - category: other
                specific: "sys,4"
                size: {range: [0.0, 1.1], asymmetric: false}
                full_table: "hepdata:ins1377206/Table 1"
                provenance: {uid: 4b0a8e09, ref: "hepdata:ins1377206/Table 1", locator: "Table 1, error 'sys,4'", source: hepdata, status: machine-verified, date: "2026-10-16"}
        predictions:
          - label: "HERAPDF2.0 NNLO (DGLAP at NNLO, RTOPT general-mass heavy-quark scheme, μr² = μf² = Q²)"
            accuracy: {qcd: NNLO, approximations: ["PDFs fitted to these data", "heavy-quark mass effects in the RTOPT variable-flavour-number scheme"]}
            codes: ["QCDNUM", "HERAFitter"]
            compared_to: ["meas:dis-nc/hera/hera-2015-comb"]
            refs: ["inspire:1377206", "arXiv:1005.1481"]
            provenance: {uid: 13399b46, ref: "inspire:1377206", locator: "Sec. 6.1 (theoretical formalism and settings: NNLO DGLAP with QCDNUM in HERAFitter, light-quark coefficient functions from QCDNUM, heavy-quark coefficient functions in RTOPT for NC, μr² = μf² = Q²)", source: agent, status: cross-checked, date: "2026-10-16"}
            headline: true
          - label: "Massless N3LO coefficient functions for F2 and FL (photon exchange)"
            accuracy: {qcd: N3LO, approximations: ["massless quarks", "photon exchange only", "F2 and FL only"]}
            refs: ["inspire:681335", "inspire:663841"]
            provenance: {uid: d059a2c9, ref: "inspire:681335", locator: "Abstract (full three-loop coefficient functions for F2 and FL; third-order coefficient functions for F2 are the dominant part of the N3LO corrections at not too small x)", source: agent, status: cross-checked, date: "2026-10-16"}
          - label: "Massless N3LO NC structure functions F2, FL, xF3 (γ/Z) and reduced cross sections, public codes apfel++ and hoppet (benchmarked)"
            accuracy: {qcd: N3LO, approximations: ["massless quarks, variable-flavour-number scheme", "MVV parametrisations of the coefficient and splitting functions beyond NLO (about 10⁻⁴ relative accuracy)", "benchmark with toy initial-scale PDFs, not compared with HERA data; agreement between the two codes at the 10⁻⁵ level for Q in [2, 100] GeV, x in [10⁻⁵, 0.9]"]}
            codes: ["apfel++", "hoppet"]
            refs: ["inspire:2780723"]
            provenance: {uid: 6e7fc3fa, ref: "inspire:2780723", locator: "Sec. 1 (O(αs³) structure functions public in hoppet v1.3.0 and apfel++ v4.8.0), Sec. 2.2 (NC F3^{γ/Z} decomposition), Sec. 3 (MVV parametrisations beyond NLO) and Sec. 5 (NC and CC structure functions and reduced cross sections agree at the 10⁻⁵ level)", source: agent, status: agent-draft, date: 2026-10-22}
          - label: "N3LO DIS structure functions in FFNS and ZM-VFNS with PineAPPL grids (yadism)"
            accuracy: {qcd: N3LO, approximations: ["unpolarised NC light, heavy and asymptotic coefficient functions up to N3LO; heavy-quark NC N3LO coefficients approximate (from resummation and high-virtuality limits), with an uncertainty propagated to the result", "renormalisation-scale variation up to N3LO, factorisation-scale variation up to NNLO (N3LO through EKO)", "GM-VFNS built from the high-virtuality limits of the heavy-flavour coefficients; benchmarked against APFEL++ and QCDNUM"]}
            codes: ["yadism", "PineAPPL"]
            refs: ["inspire:2752463"]
            provenance: {uid: 4eb55f12, ref: "inspire:2752463", locator: "Abstract; Sec. 1 (scale variations to N3LO/NNLO, GM-VFNS with EKO) and Sec. 2.3, Table 1 and following text (light, heavy and asymptotic coefficients up to N3LO except CC; heavy NC N3LO approximate with uncertainty)", source: agent, status: agent-draft, date: 2026-10-22}
  - id: "chan:dis-nc/eic"
    collider: "col:eic"
    initial_state: "e±p"
    coverage: partial
    last_reviewed: "2026-10-17"
    headline: {observable: "obs:dis-nc/eic/sigma-r-proj", region: "unpolarised NC e±p reduced cross section, all (x, Q²) bins, optimistic systematics scenario, 10 fb⁻¹ per beam-energy setting"}
    measurements:
      - id: "meas:dis-nc/eic/yr-proj"
        experiment: "EIC"
        dataset: "EIC Yellow Report projection: unpolarised NC e±p pseudo-data (DJANGOH), 10 fb⁻¹, e.g. 18×275 GeV, optimistic systematics scenario"
        ref: "arXiv:2103.05419"
        projected: true
        projection_source: {ref: "arXiv:2103.05419", date: "2021-03-08"}
        assumptions: "Optimistic scenario: ≈1.5% uncorrelated (point-to-point) and ≈2.5% normalisation systematic uncertainty (conservative: 2.3% and 4.3%); statistical uncertainty 0.01-0.35% for 10 fb⁻¹; an additional 2% for y < 0.01 bins (YR Sec. 10.5, Table 10.5)"
      - id: "meas:dis-nc/eic/early-science-proj"
        experiment: "EIC"
        dataset: "EIC early-science projection: inclusive electron-proton pseudo-data, two or three beam-energy configurations (10×250, 10×130, 5×130 GeV; 1 fb⁻¹ each), conservative systematics scenario"
        ref: "arXiv:2602.00860"
        projected: true
        projection_source: {ref: "arXiv:2602.00860", date: "2026-01-31"}
        assumptions: "Central values from HERAPDF2.0 NNLO smeared by the projected uncertainties; point-to-point systematic 1.9% (1% radiative corrections, 1.6% other, in quadrature) degrading as 1/y at low y, normalisation 3.4% uncorrelated between beam-energy configurations; statistical uncertainty negligible except at the largest x and Q² (Sec. 2)"
    observables:
      - id: "obs:dis-nc/eic/sigma-r-proj"
        name: "Reduced NC cross section σr,NC(x, Q²), e±p, EIC projection"
        kind: pseudo
        variable: "x, Q²; relative total uncertainty per (x, Q²) point"
        results:
          - measurement: "meas:dis-nc/eic/yr-proj"
            total: {value_pct: 3.0, provenance: {uid: cbf060f7, ref: "arXiv:2103.05419", locator: "Sec. 10.5, 'Inclusive Processes Systematics': ≈1.5% uncorrelated and ≈2.5% normalisation 'gives a total uncertainty on each point of ≈ 3%' (optimistic scenario); Table 10.5", source: agent, status: cross-checked, date: "2026-10-17"}}
            uncertainties:
              - category: stat
                specific: "Statistical (10 fb⁻¹)"
                size: {range: [0.01, 0.35], asymmetric: false}
                provenance: {uid: '593516e5', ref: "arXiv:2103.05419", locator: "Table 10.5, 'Statistics (10 fb⁻¹)', point-to-point 0.01-0.35%", source: agent, status: cross-checked, date: "2026-10-17"}
              - category: other
                specific: "Point-to-point systematics (radiative corrections, acceptance, bin migration, trigger and tracking efficiency; optimistic-conservative)"
                size: {range: [1.5, 2.3], asymmetric: false}
                provenance: {uid: 1147b392, ref: "arXiv:2103.05419", locator: "Table 10.5, point-to-point 'Total' 1.5-2.3% (2.5-3% for y < 0.01)", source: agent, status: cross-checked, date: "2026-10-17"}
              - category: other
                specific: "Normalisation (luminosity, electron purity, detector effects; optimistic-conservative)"
                size: {range: [2.5, 4.3], asymmetric: false}
                provenance: {uid: b19c36af, ref: "arXiv:2103.05419", locator: "Table 10.5, normalisation 'Total' 2.5-4.3%", source: agent, status: cross-checked, date: "2026-10-17"}
          - measurement: "meas:dis-nc/eic/early-science-proj"
            total: {value_pct: 3.9, provenance: {uid: c515692d, ref: "arXiv:2602.00860", locator: "Sec. 2: point-to-point 1.9% plus normalisation 3.4% 'the total systematic uncertainty attributed to each data point is 3.9 %'; statistical uncertainty for 1 fb⁻¹ negligible except at the largest x and Q²", source: agent, status: cross-checked, date: "2026-10-17"}}
            uncertainties:
              - category: other
                specific: "Point-to-point systematics (1% radiative corrections, 1.6% bin migration, efficiency, background)"
                size: {range: [1.9, 1.9], asymmetric: false}
                provenance: {uid: f3a115f6, ref: "arXiv:2602.00860", locator: "Sec. 2: 'point-to-point uncorrelated systematic uncertainty of 1.9%' (degrades as 1/y at low y, Sec. 5)", source: agent, status: cross-checked, date: "2026-10-17"}
              - category: other
                specific: "Normalisation (luminosity 1.5%, electron purity and detector efficiency 3%)"
                size: {range: [3.4, 3.4], asymmetric: false}
                provenance: {uid: 70279b66, ref: "arXiv:2602.00860", locator: "Sec. 2: 'A normalisation uncertainty of 3.4% is also included for each data set'", source: agent, status: cross-checked, date: "2026-10-17"}
