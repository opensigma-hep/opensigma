id: "proc:dis-nc"
name: "Neutral-current inclusive DIS (e±p → e± X)"
family: "fam:dis"
sector: SM
description: "Inclusive neutral-current deep inelastic scattering of electrons or positrons on protons through γ/Z exchange, e±p → e± X. The reduced cross section is expressed through the structure functions F2, FL and xF3; the HERA measurements span six orders of magnitude in Q² and x and are the backbone of proton-PDF fits (HERAPDF2.0) and of αs determinations from scaling violations. Massless QCD coefficient functions are known to third order for F2 and FL."
watch:
  recids: [1377206, 681335, 663841, 2762925, 2109062]
  queries:
    - 't "deep inelastic" and t "neutral current" and (t HERA or t H1 or t ZEUS)'
    - 't "structure function" and (t N3LO or t "third order" or t "three-loop") and t "deep-inelastic"'
    - 't "electroweak" and t "radiative corrections" and t "deep inelastic" and t "neutral current"'
building_blocks:
  - row: "NLO QCD"
    cells:
      code:
        status: done
        refs: ["inspire:130340", "inspire:1377206"]
        provenance: {uid: 73e2ae6c, ref: "inspire:130340", locator: "Abstract (full order-g² corrections to the coefficient functions of deep-inelastic structure functions, electroproduction and neutrino reactions); public implementation: QCDNUM used by HERAPDF2.0 (inspire:1377206, Sec. 6.1)", source: agent, status: agent-draft, date: "2026-10-16"}
  - row: "NNLO QCD"
    cells:
      code:
        status: done
        refs: ["inspire:511611", "inspire:318997", "inspire:1377206"]
        provenance: {uid: b315ff8c, ref: "inspire:511611", locator: "Abstract (2-loop coefficient functions of F2, F3 and FL, in agreement with Zijlstra–van Neerven); gluonic part inspire:318997 Abstract; HERAPDF2.0 NNLO fit with QCDNUM: inspire:1377206 Sec. 6.1", source: agent, status: agent-draft, date: "2026-10-16"}
  - row: "N3LO QCD"
    cells:
      code:
        status: partial
        approximations: ["massless QCD, photon exchange: F2 and FL known at three loops", "no N3LO coefficient function for the γZ-interference structure function xF3 in the cited references"]
        refs: ["inspire:681335", "inspire:663841"]
        provenance: {uid: 739341d0, ref: "inspire:681335", locator: "Abstract (full three-loop coefficient functions for F2 and FL in massless perturbative QCD, photon exchange); FL also inspire:663841 Abstract", source: agent, status: agent-draft, date: "2026-10-16"}
  - row: "NLO EW"
    cells:
      code:
        status: done
        approximations: ["single-photon bremsstrahlung included without cuts (inspire:269712)"]
        refs: ["inspire:269712", "inspire:296225"]
        provenance: {uid: c70af036, ref: "inspire:296225", locator: "Abstract (HERACLES: single-photon emission from the lepton line, self-energy corrections and the complete set of one-loop weak corrections for NC and CC ep scattering at HERA); analytic NC results inspire:269712 Abstract", source: agent, status: agent-draft, date: "2026-10-16"}
channels:
  - id: "chan:dis-nc/hera"
    collider: "col:hera"
    initial_state: "e±p"
    coverage: partial
    last_reviewed: "2026-10-16"
    headline: {observable: "obs:dis-nc/hera/sigma-r-ep", region: "Q² = 200 GeV², x = 0.0032, e+p at √s = 318 GeV"}
    measurements:
      - id: "meas:dis-nc/hera/hera-2015-comb"
        experiment: "combination"
        dataset: "H1+ZEUS combination of all inclusive HERA I+II NC and CC data (≈1 fb⁻¹, unpolarised), e+p at √s = 318 GeV (Ep = 920 GeV)"
        ref: "inspire:1377206"
        hepdata: "hepdata:ins1377206/Table 1"
    observables:
