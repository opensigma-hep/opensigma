id: "proc:dis-jets"
name: "Inclusive jet and dijet production in NC DIS (e±p → e± + jets + X)"
family: "fam:dis"
sector: SM
description: "Jet production in neutral-current deep inelastic scattering, e±p → e± + jets + X, measured at HERA in the Breit frame with the kt algorithm (inclusive-jet, dijet and trijet cross sections, double-differential in Q² and the jet transverse momentum). The data constrain the strong coupling and the gluon PDF. Predictions are available at NNLO QCD for inclusive-jet and dijet production (NNLOJET, antenna subtraction); an approximate N3LO result exists for laboratory-frame single-jet production."
watch:
  recids: []
  queries:
    - '(refersto:recid:1518159 or refersto:recid:1469089) and t jet and (t "deep inelastic" or t "deep-inelastic" or t DIS) and (t NNLO or t N3LO or t "strong coupling" or t "inclusive jet" or t dijet or t "di-jet")'
    - '(collaboration:H1 or collaboration:ZEUS) and (t "inclusive jet" or t "inclusive-jet" or t dijet or t "jet production" or t multijet) and (t "deep inelastic" or t "deep-inelastic" or t "high Q") and not t photoproduction and not t azimuthal'
  last_run: '2026-10-16'
building_blocks:
  - row: "NLO QCD"
    cells:
      code:
        status: done
        refs: ["inspire:355105", "inspire:556003"]
        provenance: {uid: 27209b0b, ref: "inspire:355105", locator: "Abstract (NLO QCD corrections to (2+1)-jet cross sections in DIS); three-jet cross section at NLO: inspire:556003 Abstract", source: agent, status: cross-checked, date: "2026-10-17"}
  - row: "NNLO QCD"
    cells:
      2L:
        status: done
        approximations: ["massless partons", "γ*→qq̄g two-loop amplitudes used in three crossing regions of DIS kinematics"]
        amplitude: "amp:2L/qqbar-Vg"
        refs: ["inspire:567814", "inspire:587998"]
        provenance: {uid: '93e98309', ref: "inspire:1518159", locator: "Sec. 3.4: 'Our NNLOjet implementation of jet production in DIS uses the same matrix elements [54-56] as were used in Z + j production, however in different kinematical crossings'; ref. [56] = hep-ph/0112081, hep-ph/0206067; three crossing regions required per DIS process", source: agent, status: cross-checked, date: "2026-10-17"}
      RV:
        status: done
        refs: ["inspire:1518159"]
        provenance: {uid: 26ebe5b7, ref: "inspire:1518159", locator: "Sec. 3.1 and 3.2.3 (real-virtual contributions: one-loop (n+1)-parton matrix elements with antenna subtraction)", source: agent, status: cross-checked, date: "2026-10-17"}
      RR:
        status: done
        refs: ["inspire:1518159"]
        provenance: {uid: 0126bb63, ref: "inspire:1518159", locator: "Sec. 3.1 and 3.2.2 (double-real contributions with antenna subtraction)", source: agent, status: cross-checked, date: "2026-10-17"}
      ir_scheme:
        status: done
        refs: ["inspire:1518159", "inspire:1469089"]
        provenance: {uid: c0d5f38c, ref: "inspire:1518159", locator: "Sec. 3.2 (application of the antenna subtraction method; initial-state identity-changing collinear limits Sec. 3.3)", source: agent, status: cross-checked, date: "2026-10-17"}
      code:
        status: done
        approximations: ["massless partons (zero-mass variable-flavour-number scheme; calculations for massive partons unavailable)"]
        refs: ["inspire:1518159", "inspire:1469089"]
        provenance: {uid: 3f57dd51, ref: "inspire:1518159", locator: "Sec. 3.4 (implementation into NNLOjet; di-jet first reported in inspire:1469089); massless-parton statement: arXiv:2309.02889 Sec. 8", source: agent, status: cross-checked, date: "2026-10-17"}
  - row: "N3LO QCD"
    cells:
      code:
        status: partial
        approximations: ["Projection-to-Born: inclusive N3LO DIS coefficient functions combined with an exclusive NNLO calculation for the final state with an extra jet", "single-jet production in the laboratory frame only, not the Breit-frame observables of the HERA jet analyses"]
        refs: ["inspire:1664411"]
        provenance: {uid: 06dbac7e, ref: "inspire:1664411", locator: "Abstract (N3LO corrections to single-jet production in DIS in the laboratory frame via the Projection-to-Born method, compared with ZEUS data)", source: agent, status: cross-checked, date: "2026-10-17"}
channels:
  - id: "chan:dis-jets/hera"
    collider: "col:hera"
    initial_state: "e±p"
    coverage: partial
    last_reviewed: "2026-10-16"
    headline: {observable: "obs:dis-jets/hera/incl-jet", region: "inclusive kt jets in the Breit frame, 150 < Q² < 15000 GeV², 0.2 < y < 0.7, √s = 318 GeV (ZEUS: p⊥,Breit > 7 GeV; H1: 5 < pT < 50 GeV)"}
    measurements:
      - id: "meas:dis-jets/hera/h1-2014-high-q2"
        experiment: "H1"
        dataset: "HERA-II 2003-2007, 351 pb⁻¹, √s = 318 GeV, NC DIS 150 < Q² < 15000 GeV², inclusive jet, dijet and trijet, kt algorithm in the Breit frame"
