              - category: other
                specific: "sys,3"
                size: {range: [0.0, 7.0], asymmetric: false}
                full_table: "hepdata:ins1377206/Table 7"
                provenance: {uid: 2117af67, ref: "hepdata:ins1377206/Table 7", locator: "Table 7, error 'sys,3'", source: hepdata, status: machine-verified, date: "2026-10-16"}
              - category: other
                specific: "sys,4"
                size: {range: [0.02, 0.35], asymmetric: false}
                full_table: "hepdata:ins1377206/Table 7"
                provenance: {uid: f079274b, ref: "hepdata:ins1377206/Table 7", locator: "Table 7, error 'sys,4'", source: hepdata, status: machine-verified, date: "2026-10-16"}
        predictions:
          - label: "HERAPDF2.0 NNLO (DGLAP at NNLO, zero-mass CC coefficient functions, μr² = μf² = Q²)"
            accuracy: {qcd: NNLO, approximations: ["PDFs fitted to these data", "zero-mass approximation for CC structure functions"]}
            codes: ["QCDNUM", "HERAFitter"]
            compared_to: ["meas:dis-cc/hera/hera-2015-comb"]
            refs: ["inspire:1377206", "arXiv:1005.1481"]
            provenance: {uid: 244b1c8e, ref: "inspire:1377206", locator: "Sec. 6.1 (NNLO DGLAP with QCDNUM in HERAFitter; for the CC structure functions the zero-mass approximation was used since all HERA CC data have Q² ≫ Mb²; μr² = μf² = Q²)", source: agent, status: cross-checked, date: "2026-10-16"}
            headline: true
          - label: "Massless N3LO coefficient functions for CC F2, FL and F3"
            accuracy: {qcd: N3LO, approximations: ["massless quarks", "approximate x-space parametrisations of the three-loop coefficient functions"]}
            refs: ["inspire:1472971", "inspire:805947"]
            provenance: {uid: 79225d25, ref: "inspire:1472971", locator: "Abstract (third-order coefficient functions for F2, FL and F3 in ν-ν̄ charged-current DIS, compact approximate expressions); F3: inspire:805947 Abstract", source: agent, status: cross-checked, date: "2026-10-16"}
          - label: "aSACOT-χ (approximate NNLO heavy-quark mass effects in the ACOT scheme), CC F2, FL, F3 (apfel++)"
            accuracy: {qcd: NNLO, approximations: ["SACOT-χ with full mass dependence at NLO; NNLO mass effects approximated by χ (n-)rescaling in the intermediate-mass scheme of inspire:1091243", "CT18 NNLO PDFs for the HERA comparison", "mass effects not resolved by the HERA CC data: Δχ² = 0.2 against zero-mass for the 82 CC points"]}
            codes: ["apfel++"]
            compared_to: ["meas:dis-cc/hera/hera-2015-comb"]
            refs: ["inspire:2913871"]
            provenance: {uid: dc12b903, ref: "inspire:2913871", locator: "Sec. I (aSACOT-χ extended to CC F2, FL, F3; implementation in APFEL++) and Sec. III, Fig. 4 (HERA CC e∓p at √s = 318 GeV, CT18 NNLO; Δχ² = 0.2 for 82 CC points vs ZM)", source: agent, status: cross-checked, date: 2026-10-22}
  - id: "chan:dis-cc/eic"
    collider: "col:eic"
    initial_state: "e±p"
    coverage: partial
    last_reviewed: "2026-10-17"
    headline: {observable: "obs:dis-cc/eic/sigma-r-proj", region: "unpolarised CC e±p reduced cross section, all (x, Q²) bins, optimistic systematics scenario, 10 fb⁻¹"}
    measurements:
      - id: "meas:dis-cc/eic/yr-proj"
        experiment: "EIC"
        dataset: "EIC Yellow Report projection: unpolarised CC e±p pseudo-data (DJANGOH), 10 fb⁻¹, optimistic systematics scenario"
        ref: "arXiv:2103.05419"
        projected: true
        projection_source: {ref: "arXiv:2103.05419", date: "2021-03-08"}
        assumptions: "Optimistic scenario: 2% uncorrelated (2% background subtraction, 0.5% acceptance and bin-centering) and 2.3% normalisation systematic uncertainty (conservative scenario: 5.8% normalisation); no total is quoted in the source (YR Sec. 8.1.6)"
    observables:
      - id: "obs:dis-cc/eic/sigma-r-proj"
        name: "Reduced CC cross section σr,CC(x, Q²), e±p, EIC projection"
        kind: pseudo
        variable: "x, Q²; relative total uncertainty per (x, Q²) point"
        results:
          - measurement: "meas:dis-cc/eic/yr-proj"
            total: {value_pct: 3.0, provenance: {uid: e0cdc0ff, ref: "arXiv:2103.05419", locator: "Sec. 8.1.6 (pseudo-data systematics paragraph): uncorrelated 2% and normalisation 2.3% (optimistic) added in quadrature (3.05%, rounded to 3.0%); no total quoted in the source, statistical part not included", source: agent, status: cross-checked, date: "2026-10-17"}}
            uncertainties:
              - category: other
                specific: "Point-to-point systematics (2% background subtraction, 0.5% acceptance and bin-centering; optimistic)"
                size: {range: [2.0, 2.0], asymmetric: false}
                provenance: {uid: 3d2342e6, ref: "arXiv:2103.05419", locator: "Sec. 8.1.6: 'an uncorrelated uncertainty of 2%' for unpolarised CC pseudo-data", source: agent, status: cross-checked, date: "2026-10-17"}
              - category: other
                specific: "Normalisation (luminosity, radiative corrections, simulation; optimistic-conservative)"
                size: {range: [2.3, 5.8], asymmetric: false}
                provenance: {uid: '59431624', ref: "arXiv:2103.05419", locator: "Sec. 8.1.6: normalisation uncertainty of 2.3/5.8% for the optimistic/conservative scenarios", source: agent, status: cross-checked, date: "2026-10-17"}
