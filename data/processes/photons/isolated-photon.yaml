id: "proc:isolated-photon"
name: "Inclusive isolated prompt photon (pp/pp̄ → γ + X)"
family: "fam:photons"
sector: SM
description: "Production of a single high-ET isolated photon in hadron collisions, dominated by quark–gluon Compton scattering qg → qγ and qq̄ → gγ plus parton-to-photon fragmentation. A direct probe of the gluon PDF and of perturbative QCD with a colourless final-state tag; the same parton-level process gives photon+jet. NNLO QCD is available both for the direct component alone (smooth/hybrid-cone isolation) and, since 2022, including photon fragmentation with the experimental fixed-cone isolation."
watch:
  recids: [2628741, 1748270, 1680459, 2075976, 1727794, 1503171, 584902]
  queries:
    - 't "isolated photon" and (collaboration:ATLAS or collaboration:CMS) and t cross'
    - 't "direct photon" and (t NNLO or t N3LO or t "electroweak corrections")'
    - 't "prompt photon" and (t "13 TeV" or t "13.6 TeV") and (collaboration:ATLAS or collaboration:CMS)'
  last_run: '2026-10-15'
building_blocks:
  - row: "NLO QCD"
    cells:
      1L:
        status: done
        refs: ["inspire:294705"]
        provenance: {uid: 781286b6, ref: "inspire:1727794", locator: "Sec. 1 (NLO QCD corrections for inclusive photon computed for fixed-cone isolation, refs [31-36] incl. Baer-Ohnemus-Owens)", source: agent, status: agent-draft, date: "2026-10-16"}
      code:
        status: done
        approximations: ["JETPHOX: direct plus fragmentation components, parton-level (no shower)"]
        refs: ["inspire:584902"]
        provenance: {uid: '2e144481', ref: "inspire:584902", locator: "Abstract (NLO Monte Carlo programme with direct and fragmentation components, isolation criterion implemented)", source: agent, status: agent-draft, date: "2026-10-16"}
  - row: "NNLO QCD"
    cells:
      2L:
        status: done
        amplitude: "amp:2L/qqbar-gammag"
        refs: ["inspire:582359", "inspire:552493", "inspire:617216"]
        provenance: {uid: ec4561fc, ref: "inspire:1727794", locator: "Sec. 3 (double-virtual matrix elements known as closed analytic expressions, refs [61,62])", source: agent, status: agent-draft, date: "2026-10-16"}
      RV:
        status: done
        refs: ["inspire:397751"]
        provenance: {uid: 667c1e8f, ref: "inspire:1727794", locator: "Sec. 3 (real-virtual matrix elements known as closed analytic expressions, refs [63,64])", source: agent, status: agent-draft, date: "2026-10-16"}
      RR:
        status: done
        refs: ["inspire:508251"]
        provenance: {uid: 430b7e45, ref: "inspire:1727794", locator: "Sec. 3 (double-real matrix elements, ref [65])", source: agent, status: agent-draft, date: "2026-10-16"}
      ir_scheme:
        status: done
        approximations: ["antenna subtraction (NNLOJET)", "N-jettiness slicing (MCFM)"]
        refs: ["inspire:1727794", "inspire:1503171"]
        provenance: {uid: 524cd60b, ref: "inspire:1727794", locator: "Sec. 3 (antenna subtraction at NNLO in NNLOJET); inspire:1503171 Abstract (N-jettiness slicing)", source: agent, status: agent-draft, date: "2026-10-16"}
      code:
        status: done
        approximations: ["NNLOJET with direct plus fragmentation (BFG II fragmentation functions, antenna approximation) and fixed-cone isolation as in the experiments", "earlier NNLO results are direct-only with hybrid-cone (NNLOJET) or dynamical-cone (MCFM) isolation"]
        refs: ["inspire:2075976", "inspire:2012936", "inspire:1727794", "inspire:1503171"]
        provenance: {uid: 5ab96f3d, ref: "inspire:2628741", locator: "Sec. 8, Nnlojet predictions (direct and fragmentation processes included; fragmentation component with BFG II in the antenna approximation, ref. [60]; fixed-cone requirements as in the experiment; ref. [19] = inspire:2075976)", source: agent, status: agent-draft, date: "2026-10-16"}
