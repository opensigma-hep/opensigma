# regex -> experimental uncertainty category; first match wins, no match -> other
'(?i)^stat': stat
'(?i)lumi': lumi
'(?i)(jes|jet energy|scale)|^les$': energy_scale  # LES: CMS lepton energy scale
'(?i)^(absolute|relative|flavorqcd|timepteta|jetflav|jetres|jer\b)|^sys,had$': energy_scale  # CMS JES/JER source names; HERA δ_had
'(?i)unfold|^unf\b': unfolding_model
'(?i)(bkg|background)|^sys,\$\\gamma p\$$': background  # HERA δ_γp: photoproduction background
'(?i)pile|purew|^pu$': pileup
'(?i)beam': beam
'(?i)(eff|trigger|id|iso|btag)|^(ftag|pref)$': efficiency
'(?i)^(sys|syst|systematics?)\.?(,(sys|cor|uncor))?$|^(cor|uncor)$|uncorr\. unc|^systematic uncertainty$': syst_combined  # source gives only a combined systematic
