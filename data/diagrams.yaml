    - {from: b, to: o2, type: fermion, label: "q′"}
    - {from: a, to: c, type: boson, label: "W", flip: true}
    - {from: b, to: c, type: boson, label: "W", flip: true}
    - {from: c, to: oz, type: boson, label: "Z"}

proc:h-decays:
  title: "H → b b̄"
  note: "The largest branching ratio; H → WW*, ZZ*, ττ, μμ are also tree level, H → γγ, Zγ, gg are loop induced."
