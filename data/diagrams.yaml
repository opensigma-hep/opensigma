proc:w-gamma:
  title: "q q̄′ → W⁺ γ"
  note: "Photon radiated off the incoming quark; radiation off the W (triple gauge coupling) is not shown."
  points: {i1: [0, 0.5], i2: [0, 2.5], a: [2, 0.75], b: [2, 2.25], o1: [4, 0.5], o2: [4, 2.5]}
  edges:
    - {from: i1, to: a, type: fermion, label: "u"}
    - {from: a, to: b, type: fermion, label: "u"}
    - {from: i2, to: b, type: antifermion, label: "d̄"}
    - {from: a, to: o1, type: photon, label: "γ"}
    - {from: b, to: o2, type: boson, label: "W⁺"}

proc:z-gamma:
  title: "q q̄ → Z γ"
  note: "t-channel quark exchange; there is no s-channel diagram at leading order."
  points: {i1: [0, 0.5], i2: [0, 2.5], a: [2, 0.75], b: [2, 2.25], o1: [4, 0.5], o2: [4, 2.5]}
  edges:
    - {from: i1, to: a, type: fermion, label: "q"}
    - {from: a, to: b, type: fermion, label: "q"}
    - {from: i2, to: b, type: antifermion, label: "q̄"}
    - {from: a, to: o1, type: photon, label: "γ"}
    - {from: b, to: o2, type: boson, label: "Z"}

proc:vbf-z:
  title: "q q → q′ q′ Z (W⁺W⁻ fusion)"
  note: "Vector-boson fusion; Z bremsstrahlung off a quark line and multiperipheral diagrams are not shown."
  points: {i1: [0, 0.4], i2: [0, 2.6], a: [2, 0.6], b: [2, 2.4], c: [2, 1.5], o1: [4, 0.3], o2: [4, 2.7], oz: [4, 1.5]}
